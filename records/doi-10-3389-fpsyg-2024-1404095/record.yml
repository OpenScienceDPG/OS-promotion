  why_open: "I dati raccolti; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Chi ama esplorare posti nuovi è anche più «verde»? Risparmiare energia, scegliere mezzi di
    trasporto sostenibili o fare acquisti attenti sono comportamenti ecologici diversi, che
    potrebbero dipendere da caratteristiche personali diverse. In questo studio 649 adulti italiani
    hanno raccontato le proprie abitudini per l’ambiente, la propria personalità, il legame con la
    natura e il gusto per l’esplorazione. Il legame con la natura è risultato il più importante,
    associato al maggior numero di comportamenti: risparmio delle risorse, impegno civico e
    acquisti. Apertura mentale e coscienziosità contavano per alcuni comportamenti, come trasporti e
    acquisti. E la novità: anche il gusto di esplorare andava di pari passo con più impegno civico e
    acquisti più sostenibili. Gli esploratori, insomma, sembrano davvero un po’ più verdi.
