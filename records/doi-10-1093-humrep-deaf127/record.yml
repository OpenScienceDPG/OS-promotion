  why_open: "I dati raccolti; Il codice usato per le analisi; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Con l’endometriosi il corpo è spesso segnato da dolore, gonfiore e cicatrici. Come lo vivono le
    donne che ne soffrono, e che cosa cambia nella loro vita? Lo studio ha raccolto online le
    risposte di 270 donne con una diagnosi di endometriosi, misurando non solo l’insoddisfazione per
    il proprio corpo, ma anche l’apprezzamento per ciò che il corpo è e permette di fare. Sono
    emersi tre profili: quasi metà delle donne apprezzava poco il proprio corpo ed era molto
    insoddisfatta, il 17% lo apprezzava molto ed era poco insoddisfatta, le altre stavano nel mezzo.
    Le donne del profilo più positivo riferivano una qualità della vita migliore quasi su tutti i
    fronti e meno sintomi. Un invito a considerare il rapporto con il proprio corpo come parte del
    benessere di queste donne.
