  public_summary: >-
    Quando ascoltiamo qualcuno parlare, l’attività elettrica del nostro cervello segue il ritmo
    delle sillabe. Partecipano anche le aree che controllano i movimenti della parola? Per
    scoprirlo, gli autori hanno confrontato adulti che balbettano e adulti con un eloquio fluente,
    registrandone l’attività cerebrale mentre ascoltavano delle frasi: a volte solo per ascoltarle,
    altre volte sapendo che avrebbero dovuto completarle ad alta voce. La differenza è emersa
    proprio nel secondo caso: mentre si preparavano a parlare, le persone che balbettano seguivano
    meno il ritmo delle sillabe, in regioni parietali e motorie. La balbuzie, quindi, non sembra
    riguardare solo il modo in cui si parla, ma anche il modo in cui si ascolta quando ci si prepara
    a rispondere, come accade di continuo in una conversazione.
