  public_summary: >-
    Alcune persone con malattie neurologiche, come il Parkinson, vanno incontro a un
    cambiamento poco conosciuto: un interesse per il sesso molto più forte di prima, a
    volte difficile da controllare. Un gruppo di ricerca internazionale ha raccolto e confrontato tutto
    ciò che gli studi scientifici dicono su questo fenomeno: 394 ricerche, con oltre 46.000
    persone. In circa sei casi su dieci il cambiamento era legato ai farmaci, soprattutto
    quelli usati per il Parkinson; negli altri a lesioni o malattie del cervello. Gli autori
    indicano come filo comune uno squilibrio nei circuiti cerebrali che fanno da freno e da
    spinta verso le ricompense, e notano che spesso il problema non viene indagato in modo
    sistematico. Propongono quindi di riconoscerlo come un disturbo a sé e di cercarlo
    attivamente durante le visite: un passo concreto per aiutare pazienti e familiari.
