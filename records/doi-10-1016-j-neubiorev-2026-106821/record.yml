    - 'Abstract: about 61% of cases iatrogenic, mostly dopaminergic therapy in Parkinson''s disease; about 25% acquired from lesions, brain injury or neurodegeneration; about 4% linked to deep brain stimulation.'
    - 'Abstract: evidence implicates fronto-striatal-limbic dysfunction reducing inhibitory control and amplifying reward drive.'
    - 'Abstract: assessment inconsistent, nearly half of studies relied on unstructured notes; authors propose a distinct diagnostic entity and structured screening.'
