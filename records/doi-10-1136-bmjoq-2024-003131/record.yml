  why_open: I dati raccolti; L'articolo, gratuito sul sito della rivista
  public_summary: >-
    Durante la pandemia di COVID-19 le riviste mediche hanno dato voce a molti esperti, con idee
    diverse su lockdown, chiusure e altre misure. Ma tutte le voci hanno avuto lo stesso spazio?
    Gli autori hanno contato quanto avevano pubblicato sul British Medical Journal, una delle
    riviste mediche più autorevoli al mondo, diversi gruppi di scienziati britannici: sostenitori
    di misure molto rigorose, consulenti scientifici del governo, firmatari di una dichiarazione a
    favore di misure più limitate, ricercatori molto citati e autori particolarmente prolifici sul
    COVID. Negli anni della pandemia i sostenitori delle misure più rigorose hanno pubblicato sulla
    rivista da circa 11 a 64 volte più degli altri gruppi, soprattutto brevi articoli d’opinione.
    Secondo gli autori, nelle prossime crisi sanitarie un dibattito aperto ed equilibrato tra
    opzioni diverse aiuterà a prendere decisioni migliori.
