  public_summary: 'Basta pochissimo per capire se qualcuno è felice o arrabbiato?
    Le ricercatrici e i ricercatori hanno ridotto il volto a soli cinque puntini luminosi:
    due sulle sopracciglia, due agli angoli della bocca e uno sul naso, una configurazione
    che hanno chiamato Clessidra. Hanno ricavato i movimenti da espressioni autentiche
    delle sei emozioni di base e li hanno mostrati a 91 persone, sia come semplici
    puntini in movimento sia come volti completi. Anche con i soli cinque puntini,
    i partecipanti hanno riconosciuto più spesso del caso felicità, sorpresa, rabbia,
    disgusto e tristezza; la paura invece veniva confusa soprattutto con la sorpresa,
    con cui condivide i movimenti della parte alta del viso. Un risultato sorprendente,
    che mostra quanto racconta il solo movimento del volto, e uno strumento nuovo
    per studiare come comprendiamo le emozioni altrui.'
