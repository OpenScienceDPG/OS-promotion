  why_open: "I dati raccolti; Il codice usato per le analisi; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Le piante di pisello ballano insieme? Quasi. Quando due piantine crescono nello stesso vaso e
    intrecciano i viticci, i loro movimenti mostrano una coordinazione misurabile. Gli autori hanno
    filmato otto coppie di piante, registrando ogni tre minuti le traiettorie dei viticci mentre si
    avvicinavano. Poi hanno confrontato i ritmi dei movimenti con un’analisi matematica che misura
    quanto due segnali vanno a tempo. Le coppie vere erano più coordinate di coppie «finte»,
    costruite al computer abbinando piante cresciute con altri partner, soprattutto all’inizio e
    alla fine del movimento. Ogni coppia, però, aveva il suo stile. Una finestra affascinante sul
    modo in cui le piante, senza cervello né occhi, sembrano accordarsi con chi hanno accanto.
  topics:
  - comportamento vegetale
  - coordinazione
  - analisi del movimento
