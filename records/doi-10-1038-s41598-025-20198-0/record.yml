      limited generalizability; mechanical/chemical mechanisms are hypotheses, not tested causal explanations.'
    - 'PDF p.7 and inspected Zenodo archives: 48 coordinate series and study MATLAB analysis script public;
      no inference of human-like intentions or neural mechanisms.'
