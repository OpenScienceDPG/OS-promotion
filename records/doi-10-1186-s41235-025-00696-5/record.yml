  public_summary: >-
    Esplorare una città nuova: meglio girare dappertutto o tornare sui propri passi? In questo
    studio 234 giovani adulti hanno esplorato liberamente per cinque minuti una città virtuale, con
    l’obiettivo di imparare dove si trovavano edifici e strade, e poi ne hanno disegnato la mappa.
    Sorpresa: chi tornava più spesso nei luoghi già visti, coprendo meno territorio, disegnava mappe
    più accurate. Anche saper ricomporre mentalmente un puzzle si legava a mappe migliori. E un
    dettaglio curioso: le persone più sicure di sé e più amanti dell’esplorazione tendevano a
    ripassare meno dagli stessi luoghi. Per imparare bene un posto nuovo in poco tempo, insomma, a
    volte conviene rivedere ciò che si è già visto.
