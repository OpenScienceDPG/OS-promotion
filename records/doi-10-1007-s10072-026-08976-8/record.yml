  public_summary: Che cosa succede quando una cantante d'opera non riconosce più le
    melodie cantate per anni? È la storia di MK, cantante professionista di 41 anni
    che, dopo un'emorragia nella parte destra del cervello, non riusciva più a cantare
    intonata né a dare un nome a brani famosi. Gli autori dello studio le hanno chiesto
    di cantare scale e arie del suo repertorio, le hanno fatto ascoltare opere celebri
    senza parole e hanno verificato con molti test memoria, attenzione e linguaggio.
    MK sentiva che quelle opere le erano familiari, ma non sapeva dire quali fossero,
    mentre le altre capacità mentali risultavano nella norma. Gli autori parlano di
    «amusia globale pura», una perdita della musica sia nell'ascolto sia nel canto,
    e propongono un modello di come il cervello elabora le melodie. Un caso raro che
    illumina come custodiamo la musica.
