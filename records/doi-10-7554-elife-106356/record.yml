  public_summary: >-
    La luce che arriva nell’uovo prima della schiusa cambia il modo in cui un pulcino ragiona con i
    numeri. Gli autori hanno confrontato 100 pulcini: alcuni incubati al buio, altri esposti alla
    luce negli ultimi giorni nell’uovo, un’esperienza che influenza il modo in cui i due lati del
    cervello si dividono i compiti. I pulcini imparavano a scegliere il quarto oggetto di una fila;
    poi la fila veniva ruotata, così da poter contare sia da sinistra sia da destra. Quando gli
    oggetti erano a distanze regolari, i pulcini esposti alla luce erano più precisi e preferivano
    contare da sinistra, come se anche per loro i numeri scorressero da sinistra a destra.
    Un’esperienza prima della nascita, insomma, può plasmare la linea mentale dei numeri.
