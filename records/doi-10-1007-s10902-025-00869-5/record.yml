curation:
  status: reviewed
  why_open: "Il piano dello studio, reso pubblico prima di raccogliere i dati; I dati raccolti; Il codice usato per le analisi; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Gratitudine, speranza, perseveranza: in vent’anni lo studio dei punti di forza del carattere è
    passato da curiosità di nicchia a campo con oltre cento pubblicazioni l’anno. Gli autori hanno
    ripercorso questa crescita analizzando 914 articoli, rassegne e capitoli dal 2004 al 2023: hanno
    contato pubblicazioni, citazioni e paesi e hanno mappato i temi ricorrenti. Le pubblicazioni
    sono cresciute di circa il 24% l’anno. Gli Stati Uniti guidano ancora, ma il contributo dei
    paesi non occidentali è in aumento. Al centro di tutto c’è il benessere, con gratitudine e
    speranza tra i filoni più solidi e la salute mentale sempre più presente; lavoro e moralità sono
    invece territori ancora poco collegati al resto. Una mappa preziosa di dove va questa ricerca e
    di dove può ancora crescere.
