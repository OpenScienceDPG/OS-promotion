  public_summary: 'Anche i bambini piccoli immaginano i numeri in fila, con i piccoli
    a sinistra e i grandi a destra? Per scoprirlo, le ricercatrici e i ricercatori
    hanno trasformato un esperimento in una minuscola partita di calcio: 21 bambini
    tra i 4 e gli 11 anni infilavano il dito indice in una scarpetta giocattolo e
    calciavano una pallina verso una porta, dopo aver visto sullo schermo 2 oppure
    8 pallini. Speciali telecamere registravano con precisione ogni movimento. I bambini
    in età prescolare, dopo aver visto pochi pallini, facevano movimenti più efficienti
    e deviavano di più verso sinistra, in linea con quella fila immaginaria di numeri.
    Nei bambini che già andavano a scuola, come negli adulti, l''effetto non compariva.
    Secondo gli autori, il legame tra numeri e movimento nasce presto e si trasforma
    con l''esperienza e lo studio della matematica.'
