curation:
  status: curated
  why_open: I dati raccolti
  public_summary: >-
    Chi ha pensieri suicidi non sempre chiede aiuto per questo: spesso si rivolge a
    uno psicologo per la depressione, l'ansia o altri problemi. Le psicoterapie
    pensate per altri disturbi possono ridurre anche il rischio di suicidio? Un
    gruppo di ricerca internazionale, con la partecipazione dell'Università di
    Padova, ha riunito i risultati di 147 studi controllati, con circa 11.000
    persone in tutto. Ha confrontato le terapie rivolte direttamente ai pensieri e ai
    comportamenti suicidari con quelle dedicate ad altri disturbi. Entrambi i tipi di
    intervento erano associati a una diminuzione dei pensieri suicidi e a circa il
    30% di tentativi di suicidio in meno rispetto ai gruppi di confronto, con effetti
    simili. Secondo gli autori, anche le cure per altri disturbi possono così aiutare
    chi difficilmente chiederebbe aiuto per il suicidio.
