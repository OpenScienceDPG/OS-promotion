  public_summary: Il modo in cui guardiamo al passato, al presente e al futuro può
    influire su come viviamo i mesi dopo la nascita di un figlio? Questo studio ha
    seguito 57 coppie in attesa di un bambino, 28 in Italia e 29 in Polonia, dal primo
    trimestre di gravidanza fino a sei mesi dopo il parto. Le future mamme e i futuri
    papà hanno compilato un questionario sul proprio modo di vivere passato, presente
    e futuro; le donne hanno indicato anche il proprio livello di stress dopo il parto.
    Nelle donne polacche, un forte peso dei ricordi negativi durante la gravidanza
    si associava a più stress dopo la nascita; nelle italiane contava di più la sensazione
    di essere in balia degli eventi. Risultati utili, secondo gli autori, per sostegni
    su misura per le coppie in attesa.
