  why_open: I dati raccolti; L'articolo, gratuito sul sito della rivista
  public_summary: 'Si può dare una mano alla memoria mentre dormiamo, semplicemente
    con dei suoni? Nel sonno profondo il cervello produce onde lente che, secondo
    molti studiosi, aiutano a fissare ciò che abbiamo imparato di giorno; in laboratorio
    si è provato a rinforzarle con brevi fruscii sincronizzati con queste onde. I
    ricercatori hanno portato la tecnica a casa: 34 giovani adulti hanno dormito con
    una fascia elettronica che registrava l''attività del cervello e, per metà di
    loro, emetteva i suoni al momento giusto. La sera imparavano la traduzione di
    40 parole inventate, poi venivano rimessi alla prova il mattino dopo e due giorni
    più tardi. I suoni hanno rinforzato le onde lente, senza peggiorare il sonno,
    ma non hanno migliorato memoria né prontezza. Un risultato prezioso, che aiuta
    a capire cosa aspettarsi da questi dispositivi nella vita reale.'
