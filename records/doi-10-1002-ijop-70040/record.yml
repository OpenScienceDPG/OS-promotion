  public_summary: >-
    Chiedere a qualcuno come si sente più volte al giorno, per giorni, restituisce un film della
    vita quotidiana invece di una semplice fotografia. Ma prima di guardarlo, quel film va montato:
    migliaia di risposte da leggere, unire, ripulire e organizzare. Questo tutorial accompagna i
    ricercatori passo dopo passo, con codice R pronto per ogni fase, compreso il modo di separare
    gli alti e bassi di ciascuno dalle differenze stabili tra persone. Come banco di prova, 211
    impiegati che hanno risposto fino a 18 volte in tre giornate di lavoro. E il risultato parla a
    chiunque lavori in ufficio: nei momenti di carico più pesante l’umore scende, mentre sentirsi
    padroni del proprio lavoro va di pari passo con un umore migliore. Una guida pratica per rendere
    questo tipo di ricerca più accessibile e trasparente.
