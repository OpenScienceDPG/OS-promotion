  why_open: I dati raccolti; L'articolo, gratuito sul sito della rivista
  public_summary: >-
    Per riconoscere una croce «sopra» un disco non importa quanto in alto siano o di che colore:
    conta solo come sono disposti tra loro. Ma un pulcino di pochi giorni coglie questa
    differenza? Le ricercatrici hanno insegnato a pulcini di pollo domestico a cercare una larva,
    il loro cibo preferito, dietro un cartoncino con la croce sopra il disco, oppure il contrario.
    Poi hanno variato i disegni: figure più vicine o più lontane, disegni spostati in alto o in
    basso, perfino una forma nuova di un altro colore al posto della croce. I pulcini sceglievano
    ancora la disposizione giusta, in genere tra 14 e 17 volte su 20, mentre con il solo disco
    andavano a caso. Per le autrici è un segno che, nei primi giorni di vita, un pulcino afferra
    già un concetto astratto come «sopra» e «sotto».
