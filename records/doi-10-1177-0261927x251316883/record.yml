curation:
  status: curated
  why_open: "I dati raccolti; Il codice usato per le analisi"
  public_summary: >-
    Riconoscere chi mente leggendo ciò che racconta è difficilissimo, anche per gli esperti. E per
    un computer? Gli autori hanno raccolto 62 racconti di vacanze, in italiano: alcune vissute
    davvero, altre inventate. Persone comuni ed esperti forensi, formati su un metodo classico di
    analisi dei racconti, non riuscivano a distinguerli molto meglio che tirando a indovinare. Gli
    algoritmi di apprendimento automatico, invece, hanno fatto molta strada: analizzando le
    caratteristiche del linguaggio estratte automaticamente dal testo, hanno distinto racconti veri
    e inventati in circa il 77% dei casi. Un risultato promettente, che mostra come l’analisi
    automatica del linguaggio possa aiutare a smascherare le bugie.
  topics:
  - rilevazione della menzogna
  - linguaggio
  - apprendimento automatico
