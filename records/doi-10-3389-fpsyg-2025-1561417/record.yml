  public_summary: >-
    Fare due cose insieme costa fatica a qualunque età. Ma il costo cresce con gli anni? Lo studio
    ha coinvolto 419 adulti italiani sani tra i 18 e i 76 anni, che hanno svolto online, da casa,
    tre prove al computer in cui gestire due richieste insieme: alternare numeri e lettere, dividere
    l’attenzione tra immagini e suoni, ricordare elementi visivi. Con l’età e con la difficoltà le
    prestazioni calavano in tutti i compiti, ma il costo specifico del fare due cose insieme
    cresceva poco. E soprattutto, i costi nei tre compiti erano quasi indipendenti tra loro: chi se
    la cavava bene in uno non era per forza bravo negli altri. Il multitasking, insomma, non è
    un’abilità unica, ma tante abilità diverse.
