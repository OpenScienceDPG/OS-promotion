curation:
  status: reviewed
  why_open: "I dati raccolti; Il codice usato per le analisi; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Sotto stress la mente fatica a fare ordine. Pensate a quando dovete tenere a mente
    un’informazione e, al momento giusto, sostituirla con una nuova: la memoria di lavoro deve
    decidere che cosa tenere e che cosa lasciar entrare. Gli autori hanno diviso a sorte 96 giovani
    adulti in due gruppi: uno affrontava una situazione stressante, fatta di calcoli veloci sotto lo
    sguardo di un valutatore, l’altro no. Intanto tutti svolgevano un compito con lettere da
    ricordare o da aggiornare. Chi era tranquillo migliorava con la pratica; chi era sotto stress
    non mostrava lo stesso progresso, soprattutto quando doveva mantenere l’informazione. Una
    meta-analisi di 42 studi, condotta dagli stessi autori, indica piccoli svantaggi nella stessa
    direzione: lo stress sembra mettere in difficoltà proprio questa regia della memoria.
  topics:
