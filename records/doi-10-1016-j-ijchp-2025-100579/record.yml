    fact_sources:
    - 'PDF pp.1–3: both authors DPG, 2025 citation; distinct community samples 674 (2021–22) and 411 (2012–18).'
    - 'PDF pp.4–5: 11-item solution, omega .943; DASS correlations .510–.624; sex invariance supported
      by changes in fit indices, scalar chi-square is less favorable. IRT global fit is mixed.'
    - 'PDF p.6: demographic/sample differences preclude a demonstrated historical trend; community percentiles
      are not clinical cut-offs; no longitudinal test-retest validation.'
    - PDF p.3 Data analysis; public OSF datasets, R script and actual 11-item Italian questionnaire inspected.
