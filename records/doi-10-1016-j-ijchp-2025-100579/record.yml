curation:
  status: reviewed
  why_open: "I dati raccolti; Il codice usato per le analisi; I materiali dello studio, come questionari e stimoli; L'articolo, gratuito sul sito della rivista; Uno strumento che altri possono riutilizzare, come un programma o un test"
  public_summary: >-
    Quanto ci preoccupiamo? Per misurarlo serve un buon questionario, e uno dei più noti ha un punto
    debole: alcune domande sono formulate «al contrario» e rischiano di misurare più il modo in cui
    sono scritte che la preoccupazione. Gli autori propongono una versione italiana aggiornata a 11
    domande, eliminando le cinque problematiche, e la mettono alla prova su 674 adulti,
    affiancandoli a un campione raccolto qualche anno prima. La versione snella funziona bene: le
    risposte sono coerenti, si legano come previsto ad ansia, depressione e stress e sono
    confrontabili tra uomini e donne. Uno strumento più semplice e pulito per chi studia la
    preoccupazione.
