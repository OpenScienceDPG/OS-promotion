  why_open: "Il protocollo dettagliato dello studio; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Come si trasforma un programma psicologico di gruppo in una conversazione con un’app? Questo
    articolo racconta come Self-Help Plus, un programma dell’Organizzazione mondiale della sanità
    per gestire lo stress, è stato adattato al chatbot ALBA, pensato per donne con tumore al seno e
    donne in gravidanza. Psicologi, informatici ed esperti di progettazione dei servizi hanno
    lavorato insieme per ripensare contenuti, tempi e modi del sostegno. Le sessioni di gruppo
    diventano incontri individuali digitali di circa 40 minuti, divisibili in due parti,
    accompagnati da audio, video, esercizi, promemoria e un diario. Il chatbot segue dialoghi
    preparati con cura, che rispondono alle scelte della persona. Un esempio concreto di come
    portare un aiuto validato nella vita quotidiana.
