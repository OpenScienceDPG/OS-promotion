  why_open: I dati raccolti; L'articolo, gratuito sul sito della rivista
  public_summary: 'Ricordare un nome è una cosa, ricordare a quale volto apparteneva
    è un''altra: con l''età è spesso il collegamento tra due informazioni a diventare
    più difficile. Questo studio ha chiesto a 34 giovani e 17 anziani italiani in
    buona salute di memorizzare parole abbinate a un colore, sia in italiano sia in
    tedesco, una lingua straniera. In alcune prove ricevevano un suggerimento: immaginare
    l''oggetto proprio di quel colore, per fondere le due informazioni in un''unica
    immagine. Gli anziani, con una buona riserva cognitiva, cioè molte esperienze
    stimolanti nel corso della vita, se la cavavano come i giovani quando il compito
    era più semplice, nella propria lingua e senza suggerimenti. Con la lingua straniera
    e con la strategia, invece, la differenza emergeva, anche perché i giovani traevano
    maggior vantaggio dal suggerimento. Uno studio prezioso per capire quando l''età
    pesa sulla memoria.'
