  why_open: Il piano dello studio, reso pubblico prima di raccogliere i dati; Il progetto,
    approvato dalla rivista prima di conoscere i risultati; I dati raccolti; Il codice
    usato per le analisi; I materiali dello studio, come questionari e stimoli; Il
    protocollo dettagliato dello studio; L'articolo, gratuito sul sito della rivista
  public_summary: 'Quando pensiamo a chi guida un Paese, che immagine ci viene in
    mente? Centinaia di ricercatori lo hanno chiesto a quasi 23.000 persone in 42
    Paesi o regioni e 30 lingue, invitandole a descrivere donne, uomini e leader politici
    con coppie di aggettivi come «caldo o freddo» e «dominante o sottomesso». Per
    metà dei partecipanti, scelti a caso, la domanda sui leader usava un linguaggio
    inclusivo, come «lui o lei»; per gli altri, espressioni neutre come «questa persona».
    Chi indovinava meglio l''opinione più diffusa nel proprio Paese poteva vincere
    un premio. Quasi ovunque i leader sono stati descritti più simili agli uomini
    che alle donne, e il linguaggio inclusivo non ha cambiato questa immagine. Un
    risultato inatteso ma prezioso: secondo gli autori, una piccola modifica nelle
    parole difficilmente basta, da sola, a scalfire pregiudizi così radicati.'
