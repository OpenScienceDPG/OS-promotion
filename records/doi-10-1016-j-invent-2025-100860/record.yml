  public_summary: >-
    Un programma online o un’app possono aiutare davvero chi soffre di un disturbo psicologico? Per
    rispondere, gli autori hanno riunito in un’unica grande analisi 168 studi sperimentali, con
    oltre 22.000 persone a cui era stato diagnosticato un disturbo: dalla depressione all’insonnia,
    dall’ansia sociale al disturbo da stress post-traumatico, otto condizioni in tutto. Hanno
    confrontato chi seguiva un percorso digitale, via internet o smartphone, con gruppi che non lo
    ricevevano, distinguendo i programmi accompagnati da un professionista da quelli da seguire in
    autonomia. I benefici sono risultati da moderati a grandi per tutti e otto i disturbi, con gli
    effetti più ampi per le fobie specifiche e il disturbo di panico. Alcuni di questi programmi
    sono ormai prescrivibili come vere e proprie terapie digitali. Una fotografia ampia e
    aggiornata di quanto la psicologia digitale può offrire.
