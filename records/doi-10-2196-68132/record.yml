  why_open: "Il piano dello studio, reso pubblico prima di raccogliere i dati; Il codice usato per le analisi; I materiali dello studio, come questionari e stimoli; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    La realtà virtuale può aiutare a valutare la depressione? Prima ancora di chiederselo, bisogna
    sapere se le persone la trovano accettabile. Cento giovani adulti, metà con sintomi depressivi e
    metà senza, hanno esplorato per circa mezz’ora una casa virtuale, svolgendo piccoli compiti
    mentali. Il verdetto è incoraggiante: il sistema è stato giudicato in generale accettabile e
    facile da usare. I partecipanti lo vedevano però come un alleato del professionista, non come un
    suo sostituto. Chi aveva sintomi depressivi riferiva più spesso nausea e stanchezza durante
    l’esperienza, un aspetto da tenere d’occhio. Un primo passo verso strumenti di valutazione più
    coinvolgenti, al fianco dello psicologo.
