curation:
  status: curated
  why_open: "I dati raccolti; Il codice usato per le analisi; I materiali dello studio, come questionari e stimoli"
  public_summary: >-
    Stimolare il cervello con deboli correnti elettriche può aiutarci a vedere meglio il movimento?
    Dipende anche da dove si mettono gli elettrodi. In uno studio precedente, una particolare
    stimolazione detta «a rumore casuale» aiutava a cogliere la direzione comune di tanti puntini in
    movimento, con entrambi gli elettrodi sulla testa. Qui gli autori hanno spostato il secondo
    elettrodo sul braccio, e il beneficio non è comparso. Le simulazioni al computer suggeriscono il
    perché: spostare l’elettrodo cambia il percorso della corrente nel cervello, allontanandola
    dalla zona da stimolare. Il titolo lo dice bene: le scintille si spengono con la distanza.
    Un’indicazione preziosa per chi progetta queste tecniche di stimolazione.
  topics:
