  public_summary: 'Resistere a una sigaretta, a un bicchiere in più o a uno snack
    fuori pasto: e se bastasse allenare il cervello a dire «no»? Esistono semplici
    esercizi al computer pensati proprio per questo, in cui si impara a trattenere
    la risposta quando sullo schermo compaiono, per esempio, immagini di cibo, alcol
    o sigarette. Un gruppo di ricercatori ha raccolto gli studi controllati su questi
    allenamenti condotti con adulti che fumano, bevono troppo o hanno un rapporto
    difficile con il cibo: quindici articoli, con oltre mille partecipanti in tutto.
    Mettendo insieme i risultati, gli autori non hanno trovato differenze tra chi
    si allenava e chi svolgeva attività di confronto, né subito dopo né a distanza
    di tempo. Un risultato prezioso: secondo gli autori, da soli questi esercizi non
    bastano, e conviene studiarli insieme ad altri trattamenti.'
