  public_summary: >-
    Sapere di non sapere è una dote preziosa: permette di rinunciare quando si rischia di sbagliare.
    Ce l’hanno anche le ghiandaie? Sette di questi uccelli, cugini dei corvi, guardavano nascondere
    un bocconcino prelibato sotto uno di due bicchieri, che poi venivano mescolati una volta sola
    oppure più volte. A quel punto potevano tentare la sorte o accontentarsi di un terzo bicchiere,
    con un cibo meno buono ma sicuro. Quando il gioco si faceva difficile, rinunciavano più spesso.
    E le ghiandaie più «prudenti» erano anche quelle che, quando decidevano di cercare, indovinavano
    il bicchiere giusto più spesso del caso: segno, per gli autori, che sceglievano in base a quanto
    si fidavano della propria memoria. Un indizio affascinante di metacognizione in un cervello di
    uccello.
