  why_open: I dati raccolti; L'articolo, gratuito sul sito della rivista
  public_summary: 'Il corpo non è solo qualcosa da guardare allo specchio: ci permette
    di correre, abbracciare, ridere, respirare. Apprezzarlo per ciò che sa fare, e
    non solo per come appare, è associato secondo molte ricerche a un rapporto più
    sereno con sé stessi. Per studiarlo negli adolescenti italiani, però, mancava
    uno strumento affidabile. Il gruppo di ricerca ha proposto un breve questionario
    di sette frasi a 1.289 ragazze e ragazzi tra i 13 e i 17 anni, insieme ad altre
    domande sull''immagine del corpo, sull''alimentazione e sulla stima di sé. Il
    questionario si è rivelato solido e funziona allo stesso modo per maschi e femmine,
    per i più giovani e i più grandi; i ragazzi hanno riportato in media un apprezzamento
    più alto delle ragazze. La ricerca ha ora uno strumento in più per studiare un''immagine
    positiva del corpo.'
