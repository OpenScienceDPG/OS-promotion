  public_summary: 'Un bambino di cinque anni sa già cogliere le regole nascoste di
    un gioco e regolare di conseguenza la propria attenzione? Per scoprirlo, i ricercatori
    hanno proposto a circa 150 bambini e ragazzi dai 5 ai 14 anni, nelle loro scuole,
    due giochi al computer. Nel primo bisognava indicare la direzione di una freccia
    centrale ignorando quelle ai lati; nel secondo si aiutavano due astronauti a ritrovare
    stelle perdute, senza premere nulla quando compariva un alieno. Senza spiegazioni,
    in ogni gioco una parte era più prevedibile dell''altra. Già i più piccoli si
    adattavano al cambiamento. Nel gioco più impegnativo, però, dai 9 anni circa emergeva
    un equilibrio migliore tra rapidità e precisione. Questa capacità nasce dunque
    presto e continua a maturare durante l''infanzia: secondo gli autori, una conoscenza
    preziosa per adattare l''insegnamento alle diverse età.'
