curation:
  status: curated
  why_open: I materiali dello studio, come questionari e stimoli; L'articolo, gratuito
    sul sito della rivista
  public_summary: >-
    Quando l'insistenza smette di essere romantica e diventa qualcosa di preoccupante? Per lo
    stalking, cioè le attenzioni ripetute e indesiderate che spaventano chi le subisce, mancavano
    strumenti capaci di cogliere i primi segnali prima che si arrivi al reato. I ricercatori hanno
    costruito un nuovo questionario: cinque psicologi hanno scritto le prime 55 frasi, un gruppo di
    studenti le ha rese più chiare e poi oltre 700 universitari maschi, in due gruppi, hanno
    indicato quanto si riconoscevano in ciascuna. Ne sono rimaste 15, raggruppate in due tendenze:
    l'insistenza e la gelosia esagerata. I punteggi più alti andavano di pari passo con la paura di
    essere abbandonati, il rimuginare sulle relazioni e gli atteggiamenti sessisti. Il risultato è
    un questionario breve e rapido da compilare, che secondo gli autori può aiutare la ricerca e i
    percorsi educativi rivolti ai giovani.
