  public_summary: >-
    Una figura che compare per un istante può diventare difficile da riconoscere, se subito dopo
    appare un contorno vicino. È un’illusione nota come mascheramento, e questo studio la usa per
    capire come il cervello costruisce le forme. In quattro esperimenti, gli autori hanno mostrato
    per appena 20 millesimi di secondo dischi incompleti o figure di cui giudicare la simmetria,
    seguiti dopo un intervallo variabile da una «maschera». Le persone sbagliavano di più
    soprattutto con intervalli intermedi. E quando figura e maschera comparivano insieme, il
    risultato dipendeva da come si combinavano: se formavano un’immagine coerente il riconoscimento
    migliorava, con forme irregolari peggiorava. Ciò che vediamo, insomma, dipende anche da come il
    cervello organizza i pezzi in un tutto.
  topics:
  - percezione visiva
  - simmetria
  - mascheramento visivo
