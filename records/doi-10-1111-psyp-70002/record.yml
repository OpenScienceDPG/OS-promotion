  public_summary: >-
    Come cambia una scienza in sessant’anni? Gli autori l’hanno raccontato attraverso i 5.869
    articoli pubblicati dalla rivista Psychophysiology tra il 1964 e il 2023. Analizzando autori,
    citazioni e parole dei titoli, emerge un ritratto vivace. I gruppi di ricerca sono diventati più
    numerosi e internazionali, anche se Europa e Nord America restano protagonisti. La quota di
    donne come prime autrici o autrici di riferimento si è avvicinata alla metà negli anni recenti.
    E i temi si sono spostati: dalle risposte fisiologiche del corpo all’attività del cervello, con
    un intreccio sempre più stretto tra pensiero ed emozioni. Un viaggio nella storia di una
    disciplina che studia il dialogo tra mente e corpo.
