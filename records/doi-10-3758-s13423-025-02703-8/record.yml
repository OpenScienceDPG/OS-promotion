curation:
  status: reviewed
  why_open: "Il piano dello studio, reso pubblico prima di raccogliere i dati; I dati raccolti; Il codice usato per le analisi; I materiali dello studio, come questionari e stimoli; Il protocollo dettagliato dello studio; L'articolo, gratuito sul sito della rivista; Uno strumento che altri possono riutilizzare, come un programma o un test"
  public_summary: >-
    Se cerchiamo spesso qualcosa sempre dallo stesso lato, i nostri occhi se ne ricordano. Quaranta
    adulti hanno cercato su uno schermo bersagli invisibili, guidati da un suono che cambiava man
    mano che lo sguardo si avvicinava al punto giusto. Senza che quasi nessuno se ne accorgesse, i
    bersagli comparivano più spesso a destra o a sinistra. Con l’esercizio la ricerca migliorava. E
    dopo, guardando liberamente uno schermo vuoto o delle fotografie, lo sguardo si spostava
    leggermente verso il lato «fortunato». Un’abitudine imparata senza saperlo, che sopravvive anche
    quando il gioco è finito, e che potrebbe un giorno essere sfruttata per aiutare chi, dopo un
    danno cerebrale, trascura un lato dello spazio.
