  why_open: I dati raccolti; Uno strumento che altri possono riutilizzare, come un programma o un test
  public_summary: >-
    Dopo un ictus o un trauma alla testa, alcune persone smettono di vedere metà di
    ciò che hanno davanti, pur avendo gli occhi sani. Per capire se una riabilitazione
    funziona bisogna misurare con precisione dove finisce la parte che si vede e dove
    comincia quella cieca. Un gruppo di ricerca dell'Università di Padova ha messo a
    punto un nuovo test al computer: un puntino bianco attraversa lo schermo e la
    persona preme un tasto quando lo vede comparire e scomparire, mentre un apparecchio
    controlla che lo sguardo resti fisso al centro. Il test è stato ripetuto due volte
    su 17 pazienti e su 20 volontari con una perdita di vista simulata. Le due
    misure coincidevano quasi perfettamente, ancora di più dopo un accorgimento che
    ripulisce i dati. Un aiuto prezioso per capire se un miglioramento dopo la
    riabilitazione è reale.
