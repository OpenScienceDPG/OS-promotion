  public_summary: >-
    Una pianta di pisello può «ricomporre» un sostegno spezzato in due? Per arrampicarsi deve
    trovare un appoggio, e a quanto pare usa anche le radici per percepirlo. Gli autori hanno diviso
    un sostegno in due pezzi, ai lati opposti del vaso: uno sottoterra, che solo le radici potevano
    raggiungere, e uno sospeso in aria, accessibile solo alla parte che cresce fuori dal terreno.
    Con il solo pezzo sospeso, 10 piante su 13 non lo trovavano e cadevano. Con entrambi i pezzi,
    invece, 8 piante su 13 si dirigevano verso quello in aria, anche se con movimenti più lenti e
    lunghi che con un sostegno intero. Come se la pianta mettesse insieme ciò che «sentono» radici e
    fusto: per gli autori, una forma di completamento percettivo. Le piante percepiscono il mondo in
    modi ancora tutti da scoprire.
