  public_summary: >-
    Anche chi fa lo psicoterapeuta prova emozioni verso i propri pazienti:
    simpatia, fastidio, voglia di prendere le distanze. Accorgersene è il primo
    passo per gestirle bene, ma finora mancavano strumenti per misurare questa
    consapevolezza. Un gruppo di ricerca delle Università di Padova, Roma Sapienza,
    Bergamo e della Pennsylvania State University ha costruito due brevi
    questionari di dodici domande ciascuno: uno sulle emozioni che il terapeuta
    riconosce in sé, l'altro sui comportamenti che quelle emozioni possono
    provocare in seduta, come il bisogno di dominare, l'ostilità o il distacco. Li
    hanno provati con 245 terapeuti italiani e 110 statunitensi. I questionari si
    sono dimostrati affidabili e funzionano allo stesso modo nei due paesi.
    Secondo gli autori, potranno servire per la ricerca, la formazione dei
    terapeuti e il lavoro clinico di ogni giorno.
