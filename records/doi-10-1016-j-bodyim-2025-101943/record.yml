  public_summary: >-
    Si può non piacersi del tutto e, allo stesso tempo, apprezzare il proprio corpo? Sì: immagine
    corporea negativa e positiva non sono due estremi della stessa scala, ma possono convivere. Lo
    studio lo mostra su oltre mille adolescenti italiani tra i 14 e i 19 anni, raggruppati in base
    alle risposte su insoddisfazione e vergogna per il corpo, ma anche sull’apprezzamento per ciò
    che il corpo è e permette di fare. Sono emersi tre profili, uguali per ragazzi e ragazze: chi
    vede soprattutto il negativo, chi soprattutto il positivo e chi sta a metà, con un po’ di
    entrambi. I ragazzi del profilo più positivo riportavano meno sintomi alimentari, meno rincorsa
    alla magrezza e meno confronti con l’aspetto altrui. Un indizio, per gli autori, che apprezzare
    il proprio corpo possa fare da scudo.
