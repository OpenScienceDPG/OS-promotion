  why_open: "I dati raccolti; Il codice usato per le analisi; I materiali dello studio, come questionari e stimoli; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Avere un disturbo dell’apprendimento non significa soltanto faticare con lettura, scrittura o
    calcolo. Questo studio ha confrontato quasi 3.000 studenti italiani di medie e superiori, 359
    dei quali con una diagnosi, su un ventaglio di abilità per la vita: organizzarsi, collaborare,
    gestire le emozioni, relazionarsi, avere idee nuove. Gli studenti con un disturbo si
    descrivevano un po’ meno forti nell’organizzarsi, nel relazionarsi e nell’innovare, ma le
    differenze erano piccole, e nella gestione delle emozioni non c’erano affatto. Anche creatività
    e abilità artistiche erano le stesse: il divario riguardava il pensiero astratto e
    l’elaborazione delle informazioni. E il legame tra queste abilità e la soddisfazione per la
    propria vita era simile nei due gruppi. Un ritratto che va oltre la diagnosi.
  topics:
  - disturbi specifici dell’apprendimento
  - abilità socio-emotive
  - rendimento scolastico
