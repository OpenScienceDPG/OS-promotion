  why_open: I dati raccolti; L'articolo, gratuito sul sito della rivista
  public_summary: 'Basta un istante perché il cervello si accorga che una forma è
    simmetrica? I ricercatori hanno mostrato a 24 giovani adulti delle figure a otto
    lati, simmetriche oppure irregolari, per appena 20 millesimi di secondo, mentre
    una cuffia di elettrodi registrava l''attività elettrica del cervello. Per evitare
    che la mente si preparasse in anticipo a premere un tasto, il tasto per rispondere
    veniva indicato solo dopo, cambiando a ogni prova. Nonostante l''immagine fosse
    poco più di un lampo, nella parte posteriore della testa, dove il cervello elabora
    ciò che vediamo, è comparsa la tipica firma elettrica della simmetria, che durava
    per centinaia di millesimi di secondo. Secondo gli autori, uno sguardo fugace
    basta ad avviare un lavoro che il cervello porta avanti anche senza continuare
    a guardare: un tassello importante per capire come cogliamo l''ordine intorno
    a noi.'
