  public_summary: Davanti alla scomparsa di tante specie di piante e animali, che
    cosa ci spinge ad agire, da soli o insieme agli altri? Le ricercatrici e i ricercatori
    lo hanno chiesto a 2000 adulti, 500 ciascuno in Francia, Germania, Cina e Stati
    Uniti, con un questionario nelle rispettive lingue. Hanno misurato quanto le persone
    riescano a immaginare un futuro in cui viviamo senza danneggiare la natura e quanto
    credano che l'impegno di tutti possa fare la differenza. Chi immaginava più facilmente
    un domani positivo e aveva più fiducia nell'impegno si diceva anche più disposto
    ad agire, nelle scelte quotidiane come nelle attività di gruppo; contava anche
    sentirsi parte di chi protegge la natura. Secondo il gruppo di ricerca, aiutare
    le persone a immaginare un futuro sostenibile potrebbe alimentare la voglia di
    difendere la varietà della vita sulla Terra.
