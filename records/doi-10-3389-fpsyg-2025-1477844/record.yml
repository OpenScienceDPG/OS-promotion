  why_open: "I dati raccolti; Il codice usato per le analisi; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Al telefono con il 118, l’infermiere deve decidere in pochi minuti quanto è grave una situazione
    e quale mezzo inviare. Ognuno, però, ha la sua «soglia»: c’è chi tende a vedere più urgenza e
    chi meno. Gli autori propongono un metodo statistico che stima questa soglia per ogni infermiere
    e misura quanto gli infermieri siano d’accordo tra loro e con gli esperti, al netto delle
    differenze personali. Lo hanno applicato a 21 infermieri della centrale operativa di Venezia,
    che hanno valutato 15 registrazioni di vere chiamate d’emergenza. A prima vista l’accordo con
    gli esperti sembrava basso; ma tenendo conto delle soglie individuali, la maggior parte degli
    infermieri mostrava un accordo piuttosto alto. Uno strumento utile per capire dove la formazione
    può fare la differenza.
