  public_summary: >-
    Chi ha un disturbo specifico dell'apprendimento, come la dislessia, a scuola fatica con
    lettura, scrittura o calcolo. Ma come se la cava con le abilità di tutti i giorni, come
    organizzarsi, collaborare o fare amicizia? Il gruppo di ricerca ha analizzato le risposte
    di oltre cinquemila studenti delle superiori, 243 dei quali con una diagnosi di questo
    tipo, raccolte in un ampio progetto tra università e scuole. Gli
    studenti con disturbo si descrivevano in media meno capaci di organizzarsi, di proporre
    idee nuove, di stare in mezzo agli altri e di cooperare. Gli autori hanno poi unito
    questi risultati a quelli di studi precedenti, ottenendo un quadro più solido. Inoltre,
    per questi ragazzi le capacità di organizzazione sembravano tradursi meno in voti
    migliori. Un lavoro accurato che rende più affidabili le conoscenze su
    un tema che riguarda molte famiglie.
