  public_summary: >-
    Un ictus può lasciare tracce nascoste anche per anni. Lo racconta questo studio su un uomo di 65
    anni, colpito sei anni prima da una lesione all’emisfero destro. Nei normali test su carta
    sembrava tutto a posto: nessuna difficoltà a notare ciò che stava alla sua sinistra. Al
    computer, però, la storia cambiava. Quando doveva segnalare piccoli bersagli ai lati dello
    schermo, quelli a sinistra gli sfuggivano. E con bersagli più grandi bastava chiedergli di fare
    contemporaneamente un’altra cosa, come classificare figure o suoni, perché le dimenticanze
    tornassero a galla. Un caso che mostra quanto servano prove abbastanza impegnative per scovare
    le difficoltà che restano dopo un ictus.
