  public_summary: >-
    Un’intelligenza artificiale può capire che effetto ci fa un’immagine? Gli autori hanno mostrato
    a tre dei sistemi più noti, GPT-4o, Gemini 1.5 Pro e Claude 3.5 Sonnet, oltre 1.300 fotografie
    usate nella ricerca sulle emozioni, chiedendo quanto fossero piacevoli, quanto invitassero ad
    avvicinarsi o ad allontanarsi e quanto fossero emozionanti. Poi hanno confrontato le risposte
    con le valutazioni medie già raccolte su persone in carne e ossa. Il risultato sorprende: i
    giudizi delle macchine coincidevano in larga parte con quelli umani, soprattutto per GPT-4o,
    anche quando si trattava di singole emozioni. Le macchine non provano emozioni, ma sanno
    riprodurre sorprendentemente bene il giudizio medio delle persone.
