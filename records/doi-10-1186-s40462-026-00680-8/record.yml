  why_open: I dati raccolti; L'articolo, gratuito sul sito della rivista
  public_summary: 'Quando allunghiamo la mano verso un oggetto lontano o piccolo impieghiamo
    più tempo: è una regola ben nota nei movimenti di persone e animali. Succede qualcosa
    di simile anche alle piante rampicanti? Il gruppo di ricerca ha osservato piante
    di pisello mentre cercavano un sostegno a cui aggrapparsi, posto a 5 o a 10 centimetri
    e largo 1,1 oppure 2 centimetri. Con un sistema di telecamere hanno ricostruito
    in tre dimensioni i movimenti circolari con cui i viticci esplorano lo spazio,
    misurando quanto tempo serviva per raggiungere e afferrare il sostegno. Il tempo
    cresceva sia con la distanza sia con la larghezza del sostegno, come se le due
    caratteristiche si sommassero in un''unica sfida. Un risultato affascinante, che
    mostra come anche le piante regolino i tempi dei loro movimenti in base all''ambiente.'
