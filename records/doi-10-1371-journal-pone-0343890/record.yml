  public_summary: >-
    Guardando un paesaggio, notate prima il cane o l'albero? Molti di noi trascurano le piante, al punto
    che gli studiosi parlano di una vera «disattenzione verso le piante». Silvia Guerra e colleghi si
    sono chiesti se questa svista arrivi fino a un'abilità di base come valutare quanti oggetti abbiamo
    davanti. In tre esperimenti online, oltre 150 persone hanno osservato gruppi di alberi, animali o
    minerali: dovevano dire quanti erano, oppure scegliere il gruppo più numeroso. A parità di numero,
    gli alberi venivano sistematicamente sottostimati, anche con immagini in bianco e nero: il verde,
    quindi, non c'entra. Con le immagini capovolte, più difficili da riconoscere, il divario si riduceva
    molto. Per gli autori, la svista nasce da come diamo significato a ciò che vediamo. Un passo importante
    per capire perché le piante, così essenziali, passano spesso inosservate.
