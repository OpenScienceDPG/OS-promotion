  public_summary: >-
    L’olfatto conta più di quanto pensiamo: ci fa gustare il cibo, ci avverte dei pericoli,
    influisce sull’umore e sui rapporti con gli altri. Questa meta-analisi ha riunito 73
    pubblicazioni, con oltre 3.000 persone con schizofrenia o altri disturbi psicotici e altrettante
    senza, per fare il punto sul loro naso. Il risultato è netto: le persone con un disturbo
    psicotico faticano molto di più a riconoscere e distinguere gli odori, anche se li percepiscono
    con la stessa sensibilità. Il problema, insomma, non è sentire l’odore, ma capire di che cosa si
    tratta. Le difficoltà erano maggiori con una malattia di lunga durata e con sintomi come apatia
    e ritiro sociale, minori in chi aveva studiato di più. Un aspetto del disturbo che vale la pena
    conoscere.
