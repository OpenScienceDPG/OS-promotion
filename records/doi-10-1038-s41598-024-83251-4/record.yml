  public_summary: >-
    A otto mesi un bambino non sa ancora contare, eppure nota qualcosa di speciale in certi gruppi
    di punti. Quarantotto bambini hanno prima guardato insiemi di 4, 6, 10 e 12 punti, poi coppie di
    insiemi nuovi: 7 contro 9, oppure 9 contro 11. Osservando dove si dirigeva il loro sguardo, i
    ricercatori hanno visto che i piccoli si giravano più spesso verso il 7 e verso l’11. Perché?
    Secondo gli autori, questi insiemi non si possono suddividere in sottogruppi uguali, mentre
    tutti gli altri sì, e questo li rende diversi da quelli già visti. Una preferenza simile era già
    stata osservata nei pulcini: un indizio di un meccanismo della percezione che potremmo
    condividere con altre specie.
