  public_summary: 'Le piante si muovono, emettono sostanze odorose e reagiscono all''ambiente,
    ma studiare tutto insieme è difficile: di solito i movimenti dei fusti, gli odori
    e la crescita delle radici si osservano con strumenti separati, in momenti diversi.
    Il gruppo di ricerca ha costruito Mind(the)Plant, un laboratorio su misura in
    cui le piante crescono in condizioni controllate mentre telecamere tridimensionali
    seguono i germogli, uno strumento di precisione analizza le sostanze emesse sopra
    e sotto terra e speciali videocamere riprendono le radici. Tutto è sincronizzato
    e i dati confluiscono in un unico sistema. Le prove, durate diverse settimane,
    hanno mostrato che ogni componente funziona in modo stabile e affidabile, e una
    giornata di registrazione continua ha fatto vedere che cosa si può scoprire combinando
    i diversi segnali. Una nuova finestra sul comportamento delle piante, pensata
    per crescere con nuovi moduli.'
