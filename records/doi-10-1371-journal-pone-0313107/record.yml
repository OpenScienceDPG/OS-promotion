  public_summary: >-
    Quanto siamo soddisfatti della nostra vita? Per confrontare la risposta tra paesi, lingue e
    gruppi bisogna prima essere sicuri che il questionario misuri la stessa cosa ovunque. Gli autori
    l’hanno verificato con i dati di un grande progetto internazionale: quasi 57.000 persone in 65
    paesi e 40 lingue hanno compilato la Satisfaction With Life Scale, un breve questionario molto
    diffuso. Il questionario ha la stessa struttura ovunque e funziona allo stesso modo tra generi e
    fasce d’età, mentre tra paesi e lingue i confronti vanno fatti con più attenzione. Le differenze
    tra nazioni erano ampie, quelle tra generi ed età piccole; e in generale chi aveva più sicurezza
    economica e una relazione stabile era più soddisfatto della propria vita. Una guida preziosa per
    chi vuole confrontare la soddisfazione di vita nel mondo.
