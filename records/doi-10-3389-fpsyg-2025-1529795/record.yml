  why_open: "I dati raccolti; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Uscire, partecipare ad attività, incontrarsi: dopo gli anni della pandemia, chi passa più tempo
    con gli altri sta meglio. Lo studio ha raccolto le risposte di quasi 270 studenti
    dell’Università di Padova tra il 2022 e il 2023, interrogandoli su ansia, depressione,
    soddisfazione per la vita, solitudine e sostegno ricevuto dagli altri. Chi partecipava più
    spesso ad attività con altre persone si sentiva meno solo, riferiva meno ansia e depressione ed
    era più soddisfatto della propria vita. Anche sentirsi sostenuti si accompagnava a meno
    solitudine e depressione, mentre chi aveva vissuto la pandemia come più pesante mostrava il
    quadro opposto. Un messaggio semplice e importante per le università: le relazioni vanno di pari
    passo con il benessere degli studenti.
