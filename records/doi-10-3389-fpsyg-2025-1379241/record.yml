  public_summary: >-
    Già a quattro anni i bambini imparano, senza accorgersene, a sfruttare le regolarità
    dell’ambiente per rispondere meglio. Lo studio lo ha verificato con 174 bambini tra i 4 e i 7
    anni di una scuola veneta, con due giochi al computer: uno misurava quanto sapevano prepararsi o
    trattenersi quando cambiavano i tempi di attesa, l’altro quanto riuscivano a ignorare le
    distrazioni in situazioni più o meno prevedibili. Anche i più piccoli coglievano queste
    regolarità e le usavano a proprio vantaggio. Poi tutti hanno seguito per otto settimane un
    programma scolastico di yoga e mindfulness, e alla nuova valutazione questa capacità appariva
    migliorata. Un primo passo, che mostra soprattutto come yoga e mindfulness possano entrare in
    classe fin dai primi anni di scuola.
