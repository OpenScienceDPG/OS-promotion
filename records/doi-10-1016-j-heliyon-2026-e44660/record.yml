  public_summary: 'Quando siamo sotto pressione da settimane, anche un compito semplice
    può sembrare più faticoso. Un gruppo di ricercatori ha provato a misurarlo in
    91 giovani adulti: alcuni seguiti da psicologi clinici per un forte stress, altri
    studenti universitari. Dopo un questionario sullo stress percepito, tutti hanno
    svolto online due prove di attenzione: indicare il colore dell''inchiostro di
    una parola, ignorando ciò che c''è scritto, e premere un tasto per certe frecce
    trattenendosi per altre. In due versioni successive comparivano anche brevi suoni
    o lampi di disturbo. Le persone più stressate davano meno risposte corrette, soprattutto
    in presenza dei disturbi: con i lampi, circa 14 risposte giuste contro 26 di chi
    era poco stressato. Per gli autori, questo legame aiuta a capire quanto uno stress
    prolungato possa pesare sulla concentrazione di tutti i giorni.'
