  public_summary: 'Affrontare un momento difficile con qualcuno accanto ci fa sentire
    più al sicuro: ma che cosa succede davvero nel nostro corpo? Le ricercatrici e
    i ricercatori hanno sottoposto 70 giovani donne a una prova stressante, un finto
    colloquio di lavoro davanti a una commissione. Alcune lo affrontavano da sole,
    altre con il proprio partner accanto, altre ancora con una persona sconosciuta.
    Durante la prova, brevi suoni improvvisi provocavano il riflesso di sussulto,
    misurato dal battito delle palpebre, un indicatore di quanto siamo all''erta.
    Lo stress era associato a un forte smorzamento di questo riflesso, ma avere qualcuno
    vicino ne attenuava l''effetto, che si trattasse del partner o di uno sconosciuto.
    Secondo gli autori, la vicinanza degli altri aiuta a gestire la minaccia condividendone
    il peso: una conferma preziosa del valore del sostegno sociale.'
