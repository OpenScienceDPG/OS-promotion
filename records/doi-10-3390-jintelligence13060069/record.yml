  why_open: Il codice usato per le analisi; L'articolo, gratuito sul sito della rivista
  public_summary: 'Quanti usi diversi vi vengono in mente per una graffetta? Domande
    così servono a misurare la creatività, ma qualcuno deve giudicare quanto ogni
    idea sia originale, e c''è chi è più severo e chi più generoso. Gli autori hanno
    ripreso dati raccolti e condivisi da altri ricercatori: 201 persone avevano inventato
    usi per una corda, una graffetta e un sacco della spazzatura, producendo oltre
    4.700 idee. Alcuni giudici avevano valutato ogni risposta, altri l''insieme delle
    idee di ciascuno. Con un modello statistico che tiene conto della severità di
    ogni giudice, gli autori hanno confrontato punteggi corretti e semplici, simulando
    anche valutazioni affidate a meno persone. Con giudici molto concordi, i punteggi
    sono risultati praticamente identici. Una buona notizia per chi misura la creatività,
    e un modo in più per capire come giudicano i valutatori.'
