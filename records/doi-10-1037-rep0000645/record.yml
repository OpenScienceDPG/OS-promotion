    fact_sources:
    - 'Abstract: 30 PD-MCI patients randomized to training or active placebo; training with planning, shifting and updating exercises of increasing difficulty in an immersive virtual environment; placebo with similar daily tasks of lower demand; all remotely via telemedicine with iVR headsets.'
    - 'Method: life-size virtual supermarket as setting; sessions three times per week over 4 weeks; headset delivered at the clinic, then remote sessions.'
    - 'Abstract results: training group improved on prospective memory tasks versus placebo, with effects lasting at the 2-month follow-up.'
    - 'Abstract conclusion: authors highlight the potential of iVR and telemedicine for cognitive interventions.'
    review_note: 'Scientific reread: RCT result stated as group difference; executive-task null result omitted as a caveat; application attributed to authors. Medicine/phone examples illustrate prospective memory, not study tasks. Editorial reread: no statistics or acronyms.'
