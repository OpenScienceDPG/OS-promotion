  why_open: I materiali dello studio, come questionari e stimoli
  public_summary: >-
    Ricordarsi di prendere una medicina all'ora giusta o di fare una telefonata dopo
    cena: è la memoria "per il futuro", che nel Parkinson con lievi difficoltà
    cognitive spesso vacilla. Un gruppo di ricerca italiano ha messo alla prova un
    allenamento a distanza in realtà virtuale: 30 pazienti, con un visore, si
    muovevano in un supermercato virtuale a grandezza naturale. Metà svolgeva esercizi
    via via più impegnativi di pianificazione e di attenzione flessibile, l'altra metà
    attività quotidiane simili ma più semplici, con tre sedute a settimana per un
    mese, seguite a distanza dai clinici. Chi aveva seguito l'allenamento più
    impegnativo ricordava meglio di eseguire le azioni programmate, e il miglioramento
    si manteneva ancora due mesi dopo. Per gli autori, realtà virtuale e telemedicina
    aprono strade nuove e promettenti per allenare la memoria anche senza spostarsi
    da casa.
