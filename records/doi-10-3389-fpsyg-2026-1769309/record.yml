  why_open: I dati raccolti; L'articolo, gratuito sul sito della rivista
  public_summary: Immaginate un ricercatore che, invece di raccogliere tutti i dati
    previsti, controlla i risultati di continuo e si ferma appena trova qualcosa di
    significativo. Questa abitudine, chiamata in gergo sbirciare i dati, aumenta il
    rischio di annunciare scoperte che in realtà non esistono. Finora, per misurare
    quanto, si ricorreva a lunghe simulazioni al computer, ripetendo moltissimi esperimenti
    immaginari. Gli autori hanno costruito invece un modello matematico che calcola
    direttamente quanto cresce la probabilità di un falso allarme, a seconda di quante
    volte si sbircia e di quanto è grande il campione. Messo a confronto con le simulazioni
    in molte situazioni diverse, il modello ha dato risultati concordanti, in modo
    più rapido e con meno errori. Uno strumento prezioso per capire meglio una delle
    cattive abitudini che minano l'affidabilità della ricerca scientifica.
