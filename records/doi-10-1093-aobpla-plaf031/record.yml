  public_summary: >-
    Anche le radici si accorgono di avere una vicina, e la loro crescita cambia a seconda di chi è.
    Gli autori hanno ricostruito per sette giorni, in tre dimensioni, i movimenti delle punte delle
    radici di mais e pisello cresciuti in acqua arricchita di nutrienti. Quando una piantina di mais
    aveva una vicina, le sue radici crescevano di più, con traiettorie più tortuose e oscillazioni
    più rapide. E, considerando entrambe le specie, le radici si dirigevano verso la vicina più
    spesso quando era della stessa specie. Un mondo sotterraneo fatto di movimenti sensibili al
    contesto, che le tecniche di ricostruzione in tre dimensioni permettono di osservare da vicino.
