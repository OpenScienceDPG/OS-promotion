  why_open: I dati raccolti; L'articolo, gratuito sul sito della rivista
  public_summary: 'Un buon rapporto con l''insegnante aiuta i ragazzi a restare coinvolti
    a scuola? E uno studente svogliato finisce per allontanarsi dal suo professore?
    Per capirlo, le ricercatrici e i ricercatori hanno seguito per un intero anno
    scolastico 1031 studenti cileni di undici scuole, dai dieci anni fino all''ultimo
    anno delle superiori. Quattro volte, a circa due mesi di distanza, i ragazzi hanno
    compilato un questionario su quanto si sentissero distaccati dalla scuola e su
    quanto apprezzassero un loro insegnante. Entrambi gli aspetti sono risultati piuttosto
    stabili: chi partiva con un buon rapporto tendeva a mantenerlo. I piccoli cambiamenti
    nell''uno non anticipavano cambiamenti nell''altro, ma a fine anno maggiore distacco
    e rapporto meno buono andavano di pari passo. Un risultato che chiarisce con quali
    tempi la relazione con gli insegnanti si intreccia con la voglia di partecipare.'
