curation:
  status: curated
  why_open: "Il piano dello studio, reso pubblico prima di raccogliere i dati; Il progetto, approvato dalla rivista prima di conoscere i risultati; I dati raccolti; Il codice usato per le analisi; I materiali dello studio, come questionari e stimoli; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    I musicisti hanno una memoria migliore? Per rispondere, 33 gruppi di ricerca in 15 paesi hanno
    unito le forze, confrontando 1.200 giovani adulti: 600 musicisti, con almeno dieci anni di
    lezioni alle spalle, e 600 non musicisti simili per età, genere e istruzione. Tutti hanno svolto
    le stesse prove di memoria a breve termine per melodie, cifre e posizioni su una griglia. Il
    verdetto: i musicisti ricordano molto meglio le melodie, un po’ meglio le posizioni e solo
    leggermente meglio le cifre, un vantaggio molto più piccolo di quanto suggerissero gli studi
    precedenti. Un’impresa collettiva che offre una risposta solida a una domanda molto dibattuta.
  topics:
  - psicologia della musica
  - memoria a breve termine
  - studio multilaboratorio
