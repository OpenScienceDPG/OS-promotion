  public_summary: >-
    Aspettare un dolore cambia il modo in cui il cervello prepara i movimenti. In due esperimenti,
    adulti sani hanno imparato che certi cerchi colorati annunciavano una stimolazione dolorosa sul
    braccio, dopo un’attesa breve o lunga. Con impulsi magnetici sulla corteccia motoria, gli autori
    hanno misurato quanto il sistema dei movimenti fosse «pronto a scattare» durante l’attesa. Il
    risultato: il sistema motorio si «frenava» già prima del dolore, restava frenato durante
    l’attesa e si riattivava dopo il momento previsto, anche quando il dolore alla fine non
    arrivava. E chi si frenava di più all’inizio tendeva a pensare che il dolore arrivasse prima. Il
    nostro corpo, insomma, impara i tempi del dolore e si prepara ad affrontarlo.
