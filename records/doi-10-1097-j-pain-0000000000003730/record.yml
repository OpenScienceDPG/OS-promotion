    - 'PDF pp.2/7: separate healthy adult groups, 30 recruited/28 analyzed in experiment 1; 28 recruited
      in experiment 2, one MEP recording excluded. Avoid an ambiguous pooled sample count.'
    - 'PDF pp.3–5/7: colored cues predict painful forearm shocks at 1750 or 5500 ms; single-pulse motor-cortex
      TMS probes muscle MEPs at selected times; experiment 2 separates early/late conditioning blocks.'
    - 'PDF pp.8–10/13: Bayesian hypothesis comparisons favor sustained inhibition during anticipation
      and recovery after expected pain time; recovery also in non-shocked trials. No continuous recording
      of the inhibition trajectory.'
    - 'PDF pp.12–13/15: exploratory pooled correlation in late condition between early MEP amplitude and
      time-reproduction error, r=-0.385 (n=53 after exclusions); association, not a causal effect on subjective
      timing.'
    - 'PDF pp.2/7/15: healthy participants, discrete TMS timepoints, central/spinal mechanisms unresolved;
      clinical implications not tested.'
