  public_summary: >-
    Le ragazze sono meno portate per la matematica? Questa grande sintesi, che riunisce 440 studi e
    oltre 15 milioni di persone dall’asilo all’età adulta, risponde con i numeri: in media la
    differenza tra maschi e femmine è minima. Ma il diavolo sta nei dettagli. Nel senso del numero e
    nella matematica avanzata le differenze praticamente spariscono. In geometria e nel calcolo,
    invece, un vantaggio dei ragazzi compare intorno alla quinta elementare e cresce fino alla fine
    delle superiori. E, a sorpresa, il divario tende a essere un po’ più ampio proprio nei paesi con
    maggiore parità di genere. Un quadro che smonta i luoghi comuni e mostra in quali ambiti, e a
    che età, le differenze compaiono davvero.
