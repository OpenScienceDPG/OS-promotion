curation:
  status: reviewed
  why_open: "I dati raccolti; Il codice usato per le analisi"
  public_summary: >-
    Saliresti su un’auto che guida da sola? Dipende soprattutto da quanto pensi che ti sarebbe
    utile. Lo studio ha chiesto a 201 adulti italiani di immaginare un’auto a guida automatizzata
    «condizionale», che guida da sé ma chiede al conducente di riprendere il volante quando serve, e
    di valutarne utilità, facilità d’uso, affidabilità e rischi. Il legame più forte era chiaro: più
    l’auto sembrava utile, più le persone erano disposte a usarla. I timori su come vengono gestiti
    i dati personali, invece, frenavano la disponibilità. Per conquistare i guidatori di domani,
    insomma, contano i vantaggi percepiti e la fiducia nella gestione dei propri dati.
