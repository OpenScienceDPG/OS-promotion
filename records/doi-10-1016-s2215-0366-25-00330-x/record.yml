  why_open: Il piano dello studio, reso pubblico prima di raccogliere i dati
  public_summary: >-
    Chi sta meglio dopo una depressione curata con gli antidepressivi prima o poi si
    chiede: posso smettere? E come? Un gruppo di ricerca italiano e francese ha
    riunito e confrontato 76 studi clinici con più di 17 mila persone che stavano
    bene dopo una depressione o un disturbo d'ansia. Nei diversi studi la terapia
    veniva sospesa di colpo, ridotta in fretta o molto lentamente, con o senza un
    sostegno psicologico, oppure proseguita. Nella depressione, ridurre il farmaco
    gradualmente, in più di un mese, affiancando un aiuto psicologico, proteggeva
    dalle ricadute quanto continuare la cura, e meglio che smettere all'improvviso o
    in poche settimane. Per gli autori, le linee guida dovrebbero promuovere percorsi
    di sospensione su misura, graduali e accompagnati da un sostegno psicologico
    strutturato.
