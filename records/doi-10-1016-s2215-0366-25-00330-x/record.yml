    fact_sources:
    - 'Abstract Methods: systematic review and network meta-analysis of RCTs comparing abrupt discontinuation, fast tapering (4 weeks or less), slow tapering (over 4 weeks), dose reduction or continuation, with or without psychological support, in adults with remitted depressive or anxiety disorders.'
    - 'Abstract Findings: 76 trials, 17 379 participants; continuation and slow tapering plus psychological support outperformed abrupt discontinuation and fast tapering for relapse prevention.'
    - 'Abstract Interpretation: in remitted depression slow tapering plus psychological support is as effective as continuation and superior to abrupt or rapid discontinuation; guidelines should promote individualised gradual deprescribing with structured psychological support.'
