  public_summary: >-
    Perché la parola inventata "kiki" ci fa pensare a una forma spigolosa e "bouba"
    a una tondeggiante? Persone di lingue diverse fanno lo stesso abbinamento, e da
    tempo ci si chiede se dipenda dal linguaggio. Un gruppo di ricerca dell'Università
    di Padova lo ha verificato con pulcini di tre giorni e, in un secondo esperimento,
    con pulcini nati da meno di un giorno, senza alcun addestramento. Ogni pulcino
    vedeva una figura tonda e una a punte, una accanto all'altra, mentre sentiva per
    la prima volta "bouba" o "kiki". Proprio come noi, i pulcini si avvicinavano
    spontaneamente alla forma a punte quando sentivano "kiki" e a quella rotonda con
    "bouba". Per gli autori, questa capacità di collegare suoni e forme potrebbe
    essere innata e diffusa in molte specie, molto più antica del linguaggio umano.
