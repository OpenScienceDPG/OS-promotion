  public_summary: >-
    Che cos’è, esattamente, la psicopatia? Manipolazione, freddezza emotiva e impulsività ne fanno
    parte, ma non c’è pieno accordo su come descriverla. Il manuale diagnostico di riferimento in
    psichiatria, il DSM-5, propone di definirla attraverso tratti come antagonismo, disinibizione,
    ricerca di attenzione e bassa ansia. Un altro modello, detto triarchico, la scompone in tre
    dimensioni: disinibizione, cattiveria e audacia. Questo studio ha messo a confronto i due
    approcci su quasi 1.700 adulti, chiedendosi quale descriva meglio aspetti come l’uso di
    sostanze, l’ansia, la depressione, il benessere e l’empatia. Il risultato: nessuno dei due
    vince. Il modello triarchico spiega meglio l’uso di sostanze, il benessere e l’empatia, quello
    del DSM-5 l’ansia e la depressione. Più che rivali, i due modelli si completano.
