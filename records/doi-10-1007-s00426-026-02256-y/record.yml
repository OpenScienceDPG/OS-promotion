  public_summary: Molti di noi immaginano il passato a sinistra e il futuro a destra,
    come su una linea del tempo. Succede qualcosa di simile con l'età delle persone?
    Gli autori hanno condotto due esperimenti online con 240 giovani adulti italiani,
    che vedevano volti maschili e femminili creati al computer, con età tra i 15 e
    i 65 anni. Premendo un tasto a sinistra o a destra, metà dei partecipanti indicava
    se il volto era più giovane o più vecchio di 40 anni; l'altra metà ne indicava
    solo il sesso. In entrambi i casi le risposte erano coerenti con un legame tra
    volti giovani e sinistra e tra volti anziani e destra, più marcato quando si giudicava
    l'età. Il volto umano si conferma uno stimolo potente, capace di evocare una mappa
    mentale anche quando l'età non è al centro dell'attenzione.
