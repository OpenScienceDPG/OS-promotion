  public_summary: Il tempo non è solo quello dell'orologio, ma anche quello che sentiamo
    scorrere e il modo in cui guardiamo al passato e al futuro. I ricercatori hanno
    confrontato 18 persone con schizofrenia, un disturbo mentale che altera il modo
    di percepire la realtà, e 19 persone senza il disturbo. I partecipanti dovevano
    giudicare se un intervallo di meno di due secondi fosse breve o lungo e, in un'altra
    prova, premere un tasto appena compariva un segnale. Hanno anche descritto il
    proprio rapporto con il tempo. Le persone con schizofrenia erano meno precise
    nel giudicare le durate e sfruttavano meno l'attesa per prepararsi a rispondere.
    Inoltre guardavano più spesso al passato con amarezza e al presente con rassegnazione.
    Secondo gli autori, unire questi aspetti aiuta a capire meglio come la malattia
    cambia il rapporto con il tempo.
