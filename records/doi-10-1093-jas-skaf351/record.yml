  why_open: "I dati raccolti; Il codice usato per le analisi; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Davanti a due gruppi di oggetti, un pulcino di tre giorni sceglie «il numero giusto» o
    semplicemente «quello più grande»? Gli autori hanno insegnato a 124 pulcini ad associare il cibo
    a un certo numero di elementi, poi li hanno lasciati scegliere liberamente, senza premio,
    misurando quanto tempo passavano vicino a ciascun gruppo. Nel complesso i pulcini non
    preferivano una strategia all’altra. Ma guardando gli animali uno per uno emergeva una sorpresa:
    sembravano dividersi in due «squadre», una che cercava il numero esatto già associato al cibo,
    l’altra che sceglieva in base al confronto, il gruppo più grande o più piccolo. Il quadro
    reggeva anche cambiando l’aspetto degli elementi. Anche tra i pulcini, insomma, ognuno ha il suo
    modo di ragionare con le quantità.
