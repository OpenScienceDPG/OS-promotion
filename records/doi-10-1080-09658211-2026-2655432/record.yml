  public_summary: 'Provate a memorizzare parole che non c''entrano nulla tra loro,
    come «forno», «tesoro» e «finestra»: ripetendole, spesso le si raggruppa a modo
    proprio e le si ricorda a piccoli blocchi. È una strategia efficace, che però
    con l''età tende a indebolirsi. I ricercatori hanno coinvolto 40 giovani adulti,
    non iscritti all''università, e 40 persone tra i 60 e gli 80 anni. Tutti hanno
    ricordato più volte una lista di 20 parole scollegate, hanno cercato di riconoscere
    coppie di parole viste poco prima e hanno svolto tre prove di memoria di lavoro,
    la capacità di tenere a mente e rielaborare informazioni per pochi secondi. Il
    fattore che spiegava meglio l''abilità di organizzare le parole era proprio la
    memoria di lavoro, a ogni età e soprattutto nei più giovani. Un tassello importante
    per capire come cambia la memoria invecchiando.'
