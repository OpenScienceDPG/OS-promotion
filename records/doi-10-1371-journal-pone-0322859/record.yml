  public_summary: >-
    Una pianta di pisello sa contare i sostegni? Per arrampicarsi deve trovare un appoggio, e le
    occasioni non sono sempre distribuite in modo uniforme. Gli autori hanno coltivato 24 piante in
    vasi con quattro sostegni: in metà dei casi due per lato, nell’altra metà tre da un lato e uno
    dall’altro. Telecamere a infrarossi hanno registrato ogni tre minuti la crescita della pianta e
    i movimenti dei viticci, i sottili «fili» con cui si avvolge al sostegno. Con la distribuzione
    sbilanciata, 9 piante su 12 si sono dirette verso il lato con tre sostegni; con due per lato la
    direzione era casuale. E con i sostegni sbilanciati anche i movimenti cambiavano, più lenti e
    misurati. Per gli autori, un segno che anche le piante possano distinguere le quantità.
  topics:
  - comportamento vegetale
  - cognizione numerica
  - piante rampicanti
