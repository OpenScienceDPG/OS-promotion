  why_open: I dati raccolti; Il codice usato per le analisi; I materiali dello studio,
    come questionari e stimoli; L'articolo, gratuito sul sito della rivista
  public_summary: 'Chi suona uno strumento da tanti anni ha una memoria migliore,
    o ragiona in modo diverso? Per rispondere servono molti partecipanti e regole
    uguali per tutti, una combinazione rara. Le ricercatrici e i ricercatori di trentacinque
    gruppi in sedici Paesi hanno raccolto con la stessa procedura i dati di 1438 giovani
    tra i 18 e i 30 anni: musicisti con almeno dieci anni di studio e persone che
    la musica non l''hanno quasi mai praticata. In laboratorio ciascuno ha svolto
    prove di memoria per numeri, posizioni e melodie, test di ragionamento e di vocabolario,
    e ha risposto a domande su personalità e piacere per la musica. Molti musicisti
    sono abbinati a non musicisti della stessa età, genere e istruzione. Questa grande
    raccolta, descritta in ogni dettaglio, permette a chiunque di studiare il legame
    tra musica e mente.'
