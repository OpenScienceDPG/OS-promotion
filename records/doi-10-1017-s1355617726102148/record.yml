  why_open: Uno strumento che altri possono riutilizzare, come un programma o un test
  public_summary: >-
    Il test di Stroop è un classico della psicologia: si vedono nomi di colori stampati in
    un altro colore, come la parola «rosso» scritta in verde, e bisogna dire il colore
    dell'inchiostro senza farsi ingannare dalla parola. Una versione breve si usa spesso
    in ambulatorio per valutare quanto sappiamo frenare le risposte automatiche, ma i valori
    di riferimento italiani avevano più di vent'anni. Il gruppo di ricerca ha fatto svolgere
    il test a 317 adulti sani tra i 40 e gli 89 anni, insieme ad altre prove di rapidità
    e controllo mentale. Ne sono nate tabelle aggiornate che tengono conto di età,
    istruzione e sesso, e nuove conferme che il test è legato alle capacità che dovrebbe
    misurare. Agli specialisti viene offerto anche un foglio di calcolo che fa i conti in
    automatico: uno strumento pratico per valutazioni più precise.
