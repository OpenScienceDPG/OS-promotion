  why_open: I dati raccolti; L'articolo, gratuito sul sito della rivista
  public_summary: 'Alcune persone si abituano in fretta al ticchettio di un orologio
    o al ronzio del frigorifero, altre continuano a sentirli a lungo. Questa differenza
    ha a che fare con l''attenzione? Le ricercatrici e i ricercatori hanno chiesto
    a 143 adulti quanto tempo impiegano ad abituarsi agli stimoli sensoriali della
    vita di tutti i giorni, e li hanno messi alla prova con un compito al computer:
    riconoscere lettere bersaglio in figure fatte di una lettera grande composta da
    tante lettere piccole, ignorando ora i dettagli ora l''insieme. Chi dichiarava
    di abituarsi più lentamente era meno preciso nel cogliere la forma d''insieme
    quando doveva ignorare i dettagli, ma rispondeva più in fretta nelle prove senza
    bersaglio. Secondo gli autori, abitudine e attenzione sono strettamente legate:
    un tassello utile per capire le diverse sensibilità di ciascuno, anche nelle persone
    neurodivergenti.'
