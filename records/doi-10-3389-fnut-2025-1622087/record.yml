  why_open: I dati raccolti; L'articolo, gratuito sul sito della rivista
  public_summary: Perché una ciambella ci tenta molto più dei broccoli? Un gruppo
    di ricerca ha coinvolto 42 studentesse universitarie, arrivate in laboratorio
    dopo alcune ore di digiuno. Ognuna ha guardato foto di cibi, dalla frutta al pesce
    fino a patatine e dolciumi, indicando quanto le piacessero e quanta voglia avesse
    di mangiarli; poi ha svolto un gioco al computer in cui doveva premere un tasto
    oppure trattenersi. Un braccialetto misurava le piccole variazioni naturali tra
    un battito del cuore e l'altro, che gli autori considerano un segnale della capacità
    di autoregolarsi. I cibi spazzatura sono risultati più attraenti di quelli sani.
    Le studentesse con un battito più variabile, e quelle più attive fisicamente,
    tendevano a mangiare meno dolci confezionati e più frutta e verdura. Un indizio
    prezioso su come corpo e mente accompagnano le nostre scelte a tavola.
