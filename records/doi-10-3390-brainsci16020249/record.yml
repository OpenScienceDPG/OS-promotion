  public_summary: >-
    Stimare quanto dura un’attesa, riprodurre un intervallo, organizzare il proprio tempo: abilità
    quotidiane che possono essere fragili nei bambini con ADHD o con discalculia, cioè con
    difficoltà specifiche in matematica. Questo studio ha coinvolto 811 bambini dai 6 ai 13 anni, a
    scuola e in centri clinici di Milano e Padova, con giochi al computer sul tempo, questionari per
    bambini, genitori e insegnanti e prove di matematica e attenzione. Il senso del tempo era legato
    sia all’attenzione e all’iperattività sia alla matematica. E i gruppi formati in base alle
    difficoltà effettive mostravano differenze più nette di quelli basati sulle diagnosi, con un
    peso maggiore delle difficoltà di attenzione. Un invito a guardare alle difficoltà reali di ogni
    bambino, al di là delle etichette.
