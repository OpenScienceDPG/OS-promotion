  public_summary: >-
    Il semaforo che sta per diventare verde, il conto alla rovescia prima di una gara: usiamo di
    continuo indizi sul «quando» per prepararci e reagire più in fretta. In laboratorio questa
    capacità si studia con prove diverse, ma mancava un test unico per misurarne i vari aspetti in
    una sola seduta. Gli autori hanno creato il TEP-Task, un compito al computer di 35 minuti in
    cui bisogna reagire appena compare un asterisco, preceduto da attese più o meno lunghe, da
    segnali che indicano quando arriverà o da ritmi regolari di luci e suoni. Messo alla prova su
    109 studenti universitari in Francia, il test ha ritrovato in una sola sessione tutti e quattro
    gli effetti classici della preparazione temporale. Uno strumento pratico, pensato anche per
    future ricerche con persone anziane e pazienti.
