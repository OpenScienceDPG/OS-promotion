  why_open: "I dati raccolti; Il codice usato per le analisi; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Per riconoscere una forma nascosta tra tanti puntini, conta di più quante immagini diverse
    vediamo o quanto velocemente si susseguono? Gli autori hanno rianalizzato due esperimenti con 29
    adulti, che dovevano distinguere disposizioni di coppie di punti orientate in modo coerente da
    disposizioni casuali, presentate come brevi sequenze di immagini. Il risultato: vedere più
    immagini diverse rendeva la forma più facile da riconoscere, anche quando il segnale era debole.
    La velocità con cui le immagini si alternavano sembrava aiutare a sua volta, ma molto meno. Il
    cervello, insomma, raccoglie indizi sulla forma nel tempo, sommando ciò che vede in istanti
    diversi.
