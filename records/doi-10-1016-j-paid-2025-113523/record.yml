  why_open: I dati raccolti; L'articolo, gratuito sul sito della rivista
  public_summary: >-
    Che cosa ci spinge verso ciò che desideriamo, e che cosa ci trattiene davanti a un
    rischio? Secondo una nota teoria, nel nostro carattere convivono un
    acceleratore, sensibile alle ricompense, e un freno, sensibile a minacce e punizioni.
    Un gruppo di ricerca italiano ha seguito per nove mesi 698 studenti delle superiori,
    che tre volte hanno compilato questionari su questi due sistemi e su tre tratti di
    personalità che, quando sono molto marcati, caratterizzano la psicopatia: audacia,
    scarso autocontrollo e freddezza verso gli altri. Chi aveva un acceleratore più forte
    mostrava in seguito un po' di più tutti e tre i tratti. Il freno, invece, si
    legava nel tempo a meno audacia e a meno autocontrollo, in un'influenza
    reciproca. Per gli autori, conoscere questi percorsi può aiutare a riconoscere presto
    i ragazzi in difficoltà e a sostenerli.
