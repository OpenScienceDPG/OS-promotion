  public_summary: >-
    Due bambine con la stessa mutazione genetica, quella della sindrome dell’X fragile, possono
    avere profili molto diversi. Perché? Questo studio racconta due casi di 10 e 11 anni, esaminati
    a fondo con analisi genetiche, test neuropsicologici, questionari per i genitori, compiti
    sperimentali e analisi del cammino. La differenza chiave stava in un numero: la quota di cellule
    in cui era attivo il cromosoma X con la copia sana del gene, il 30% in una bambina e il 70%
    nell’altra. La bambina con la quota più bassa mostrava più difficoltà cognitive, nella vita
    quotidiana e in matematica, anche se non in tutte le abilità. Due storie che invitano a leggere
    insieme genetica e valutazione delle abilità, per capire davvero ogni bambina.
