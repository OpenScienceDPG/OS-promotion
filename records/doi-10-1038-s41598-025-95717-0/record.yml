  public_summary: >-
    Un lampo di luce, due bip: e all’improvviso ci sembra di vedere due lampi. È un’illusione in cui
    l’udito inganna la vista, e questo studio mostra che diventa più forte quando la mente è
    impegnata. In due esperimenti online, circa 200 adulti dovevano contare i lampi comparsi a
    destra o a sinistra dello schermo, a volte svolgendo intanto un altro compito, come tenere a
    mente delle informazioni. Con la mente più carica l’illusione cresceva: i suoni condizionavano
    di più ciò che si vedeva. E questo valeva allo stesso modo per entrambi i lati dello schermo.
    Quando l’attenzione è occupata, insomma, vista e udito si mescolano di più.
