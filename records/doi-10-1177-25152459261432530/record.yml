  public_summary: >-
    Quando uno studio ha pochi partecipanti, anche un risultato «significativo» può ingannare:
    l’effetto può apparire molto più grande del vero o, in casi estremi, persino nella direzione
    sbagliata. Per segnalare questi rischi erano stati proposti due indicatori, gli errori di
    «segno» e di «grandezza». In questo articolo gli autori, tra cui due ricercatori che li avevano
    promossi, li rimettono in discussione con onestà. Mostrano che l’errore di segno aggiunge poco a
    ciò che già sappiamo, e che usare l’errore di grandezza per «correggere» un singolo risultato,
    come fanno alcuni lavori, porta fuori strada. Propongono strumenti più adatti, come l’effetto
    critico, e indicano dove i due indici restano utili: nella didattica e per riflettere sugli
    studi troppo piccoli. Un bell’esempio di scienza che sa correggere sé stessa.
  topics:
  - metodologia statistica
  - potenza statistica
  - dimensione dell’effetto
