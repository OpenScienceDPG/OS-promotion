  public_summary: >-
    La paura della morte riguarda tutti, ma in alcune persone pesa più che in altre. Questa grande
    meta-analisi ha riunito 129 studi e oltre 34.000 partecipanti per capire quanto questa ansia
    vada di pari passo con il disagio psicologico. La risposta è netta: chi ha più paura della morte
    tende a soffrire di più di ansia, depressione e malessere in generale, con legami di intensità
    consistente. Un risultato che mette al centro della scena una paura antichissima. Il prossimo
    passo, per gli autori, sarà capire che cosa venga prima: se la paura della morte alimenti il
    disagio, o il contrario.
