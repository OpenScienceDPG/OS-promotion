  public_summary: >-
    Confrontare il cervello di una persona con quello di migliaia di altre, per capire quanto si
    discosta dalla norma: un’operazione potente ma complessa, finora alla portata di pochi gruppi di
    ricerca. Neurofind la mette a disposizione di tutti i ricercatori: è uno strumento online
    gratuito che, a partire da una risonanza magnetica, calcola quanto la forma del cervello si
    allontana dalla norma e quanti anni «dimostra». I suoi modelli di intelligenza artificiale hanno
    imparato da oltre 3.300 immagini di persone sane tra i 20 e gli 80 anni. Messo alla prova su 364
    pazienti, ha rilevato scostamenti molto marcati nel 55% delle persone con Alzheimer e nel 30% di
    quelle con schizofrenia; in entrambi i gruppi il cervello sembrava più vecchio dell’età reale.
    Uno strumento prezioso al servizio della ricerca sul cervello.
