  public_summary: Vi è mai capitato che un pomeriggio tra amici voli via, mentre un'attesa
    in coda sembra non finire mai? Le ricercatrici e i ricercatori hanno voluto capire
    se le emozioni cambiano il nostro senso del tempo. In due esperimenti, 79 giovani
    adulti hanno guardato scene di film allegre, tristi o neutre, proiettate in una
    stanza che avvolge chi guarda con immagini e suoni. Intanto battevano il dito
    a un ritmo spontaneo, premevano un tasto quando pensavano fosse passato un minuto
    e poi stimavano quanto era durato il video; sensori registravano battito del cuore
    e sudorazione della pelle. Dopo le scene emozionanti, allegre o tristi, il ritmo
    del dito tendeva ad accelerare e la pelle restava più attivata; la stima del minuto
    cambiava invece solo in alcune condizioni. Un passo importante per capire come
    le emozioni modellano il tempo vissuto.
