  why_open: Il protocollo dettagliato dello studio; L'articolo, gratuito sul sito
    della rivista
  public_summary: >-
    Contro la depressione esistono diverse psicoterapie efficaci. Due delle più studiate sono la
    terapia cognitivo-comportamentale, che lavora su pensieri e comportamenti, e la terapia
    interpersonale, che si concentra sulle relazioni con gli altri. Ma quale funziona meglio, e per
    chi? Questo articolo presenta il piano di un grande studio per scoprirlo. Gli autori
    cercheranno tutte le sperimentazioni che hanno confrontato le due terapie negli adulti e
    chiederanno ai ricercatori di condividere i dati, resi anonimi, di ogni singolo partecipante.
    Mettendoli insieme potranno confrontare le due terapie non solo sui sintomi depressivi, ma
    anche su ansia, qualità della vita e benessere a distanza di tempo, e capire se caratteristiche
    come età o gravità della depressione rendano una terapia più adatta dell’altra. Un passo verso
    cure sempre più su misura per ogni persona.
