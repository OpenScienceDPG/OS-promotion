curation:
  status: curated
  public_summary: >-
    Nelle fabbriche di oggi sempre più operai lavorano fianco a fianco con robot collaborativi,
    telecamere intelligenti e sistemi automatici. Ma come si sentono? Questo articolo presenta il
    piano di uno studio che vuole scoprirlo, coinvolgendo operai di aziende manifatturiere del
    Nord-Est. I partecipanti compileranno un questionario online di circa venti minuti sul proprio
    benessere, sull’intesa con le macchine e sui rapporti con i colleghi, e racconteranno la
    propria esperienza in interviste di circa un’ora. Gli autori si aspettano che un lavoro ben
    sincronizzato con la macchina protegga il benessere, mentre un atteggiamento negativo verso le
    nuove tecnologie possa favorire lo stress. Dai risultati nascerà un documento condiviso con
    indicazioni pratiche per le aziende e per la formazione. Un passo per mettere davvero le
    persone al centro della fabbrica del futuro.
  topics: []
