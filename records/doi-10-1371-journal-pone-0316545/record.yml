  public_summary: >-
    Imparare a fare un vaso d’argilla, come nel Neolitico, lascia tracce nei vasi e nel cervello? In
    questo studio pilota, studenti alle prime armi si sono esercitati per almeno 24 ore in quattro
    settimane, costruendo vasi con la tecnica a colombino, cioè sovrapponendo cordoni d’argilla,
    diffusa nel Neolitico; un altro gruppo non si è allenato. Prima e dopo, i ricercatori hanno
    analizzato la forma dei vasi e registrato le risposte del cervello e dei muscoli mentre i
    partecipanti osservavano gesti corretti o sbagliati. Dopo la pratica i vasi erano più regolari e
    con meno errori, e alcune risposte del sistema motorio agli errori osservati erano cambiate. Un
    ponte originale tra archeologia e neuroscienze, per capire come nasce una nuova abilità manuale.
