  public_summary: Siamo davvero ciò che mangiamo? Un gruppo di ricerca italo-giapponese
    ha provato a scoprirlo con un compito al computer svolto online da un centinaio
    di adulti, metà italiani e metà giapponesi. I partecipanti dovevano immaginare
    di «essere» un cibo tipico italiano, come pizza o tiramisù, mentre un'altra persona
    era un piatto giapponese, come sushi o ramen; poi i ruoli si invertivano. A ogni
    prova dovevano decidere in fretta se la parola «tu» o «altro» si abbinava correttamente
    all'immagine di cibo mostrata. Le immagini legate a sé stessi venivano riconosciute
    meglio con entrambe le cucine, ma in tutti e due i Paesi il vantaggio era più
    forte per i piatti della propria tradizione. Questo legame non risultava collegato
    alla diffidenza verso i cibi sconosciuti. Secondo gli autori, il cibo è una parte
    importante della nostra identità personale e culturale.
