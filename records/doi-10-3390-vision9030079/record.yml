  public_summary: 'Se una parte della vista si oscura, vediamo peggio soltanto le
    forme o anche il ritmo degli eventi? Per scoprirlo, i ricercatori hanno simulato
    in laboratorio una "macchia cieca", coprendo metà dello schermo con un velo scuro
    semitrasparente. Venticinque volontari dovevano dire se avevano visto uno o due
    brevissimi lampi, separati da pochi millesimi di secondo, mentre uno strumento
    controllava che tenessero lo sguardo fisso al centro. Sotto il velo, per distinguere
    due lampi serviva in media una pausa di circa 52 millesimi di secondo, contro
    i 35 della parte libera: la vista diventava meno precisa anche nel tempo. In un
    secondo esperimento, mostrare prima un volto felice, arrabbiato o neutro non cambiava
    questo risultato, un chiarimento utile. Secondo gli autori, capire questi meccanismi
    è un passo verso aiuti migliori per chi convive con difetti del campo visivo.'
