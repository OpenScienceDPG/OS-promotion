  public_summary: >-
    Autismo, ADHD e disturbi del linguaggio: si è «dentro» o «fuori», come suggerisce una diagnosi,
    oppure sono l’estremo di caratteristiche che tutti abbiamo in misura diversa? Esistono metodi
    statistici pensati proprio per rispondere, e questa revisione ha raccolto i 14 studi che li
    hanno applicati. Per ADHD e disturbi del linguaggio le prove indicano una scala continua, senza
    un confine netto. Per l’autismo, invece, molti studi trovavano categorie distinte. Ma gli autori
    scoprono un inganno: quegli studi spesso mettevano insieme persone già diagnosticate e persone
    reclutate altrove, e simulazioni al computer mostrano che questa mescolanza fa comparire
    «categorie» anche dove non ce ne sono. Una lezione importante su quanto il modo di scegliere i
    partecipanti possa plasmare le conclusioni.
