  public_summary: >-
    Nella nostra mente i numeri sembrano disposti lungo una linea: i piccoli a sinistra, i grandi a
    destra. Lo si vede con un compito semplice: indicare il centro di una linea che ha un numero a
    ciascuna estremità. Il centro scelto tende a spostarsi, come se i numeri piegassero lo spazio.
    Ma conta come il numero è presentato, in cifre o come gruppi di puntini? In quattro esperimenti
    i due formati hanno spinto in direzioni diverse: i puntini spostavano la stima soprattutto verso
    sinistra, in particolare quando la quantità maggiore stava a sinistra; le cifre la spostavano
    soprattutto verso destra, anche quando i due numeri erano identici. Le quantità che vediamo e i
    numeri che leggiamo influenzano dunque la nostra percezione dello spazio, ma per strade diverse.
  topics:
  - cognizione numerica
  - spazio e numeri
  - attenzione spaziale
