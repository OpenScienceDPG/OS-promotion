  public_summary: >-
    Nei giovani il rischio di pensieri suicidi non è sempre uguale: può salire o scendere
    da un giorno all'altro. Che cosa lo fa oscillare? Il gruppo di ricerca ha seguito per
    otto giorni 104 studenti universitari, che quattro volte al giorno rispondevano a brevi
    domande sul proprio stato d'animo, mentre un braccialetto registrava sonno, movimento e
    battito del cuore. Dopo notti più corte del solito, il giorno seguente il rischio
    risultava più alto; lo stesso accadeva dopo giornate con il battito più accelerato del
    normale. Il legame con battito e movimento era più forte nei giorni segnati da eventi
    negativi, mentre quelli positivi proteggevano poco. Per gli autori, il rischio negli
    studenti è legato ai cambiamenti quotidiani di sonno, attività e attivazione del corpo,
    soprattutto nei giorni di stress: un'indicazione preziosa per capire quando offrire
    aiuto.
