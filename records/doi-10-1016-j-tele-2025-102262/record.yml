  public_summary: >-
    Ci piace chi ci somiglia: vale anche per un assistente digitale? Gli autori hanno dato a un
    assistente sanitario tre «personalità» diverse: scrupolosa, estroversa o emotivamente stabile.
    Poi due gruppi di persone, quasi 280 in tutto, hanno conversato online con l’assistente
    immaginando di avere un’emicrania, e ne hanno valutato la personalità e quanto le coinvolgesse.
    Le personalità scrupolosa ed estroversa venivano riconosciute bene. La sorpresa è arrivata dopo:
    chi aveva un carattere simile a quello dell’assistente non si sentiva più coinvolto degli altri.
    Il proverbio «chi si somiglia si piglia», insomma, non basta per progettare assistenti digitali
    più coinvolgenti: per personalizzarli bisognerà esplorare altre strade.
