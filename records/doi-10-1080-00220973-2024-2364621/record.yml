curation:
  status: reviewed
  why_open: "I dati raccolti"
  public_summary: >-
    Curiosità e perseveranza aiutano anche in matematica? Sì, ma per una strada indiretta. Lo studio
    ha coinvolto 551 studenti italiani tra gli 11 e i 18 anni, che in classe hanno svolto prove di
    calcolo e di ragionamento e raccontato le proprie soft skills, il modo di studiare, la
    motivazione e le emozioni legate alla scuola. Per il calcolo contavano soprattutto la capacità
    di ragionamento, poi la motivazione e il provare meno emozioni negative. Le soft skills non si
    legavano direttamente ai risultati, ma andavano di pari passo con più motivazione, migliori
    strategie di studio, più emozioni positive e meno emozioni negative: ed è proprio attraverso
    motivazione ed emozioni che si collegavano, un poco, alla bravura nei calcoli. Un quadro che
    aiuta a capire come il carattere entra in classe.
