  public_summary: >-
    Il cuore batte il tempo, ma ci aiuta anche a misurarlo? Due studi con giovani adulti hanno
    cercato legami tra il battito, la capacità di percepire i segnali del proprio corpo e il senso
    del tempo. I partecipanti dovevano distinguere durate brevi e lunghe, reagire a segnali comparsi
    dopo attese variabili oppure battere un tasto al proprio ritmo preferito. Il quadro è più
    sottile del previsto: chi contava meglio i propri battiti reagiva più in fretta dopo attese
    brevi, mentre chi si fidava di più delle proprie sensazioni cardiache era meno preciso nel
    giudicare le durate. E un indice del ritmo cardiaco a riposo si legava alla velocità con cui si
    batteva il tasto. Il dialogo tra cuore e tempo esiste, ma non è quello di un semplice metronomo.
