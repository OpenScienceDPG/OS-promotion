  why_open: "Il piano dello studio, reso pubblico prima di raccogliere i dati; I dati raccolti"
  public_summary: >-
    Nel 2018 un amministratore delegato statunitense guadagnava in media 265 volte più del
    lavoratore medio. Che effetto fa, a chi lavora, sapere che i vertici guadagnano tanto di più? In
    due indagini con oltre 1.300 lavoratrici e lavoratori negli Stati Uniti e in Italia, chi
    percepiva un divario retributivo più ampio nella propria azienda sentiva anche che l’azienda si
    curava poco del suo benessere, era meno soddisfatto del lavoro e si identificava meno con
    l’organizzazione. Due esperimenti con circa 800 partecipanti, che presentavano aziende
    ipotetiche con differenze di stipendio grandi o piccole, hanno confermato il quadro: davanti a
    un divario ampio, le persone si aspettavano di sentirsi meno considerate, meno soddisfatte e
    meno legate all’azienda. Le disuguaglianze di stipendio, insomma, sono anche un messaggio:
    dicono ai dipendenti quanto contano.
