curation:
  status: reviewed
  why_open: "Il protocollo dettagliato dello studio; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Le donne in cura per un tumore al seno vivono spesso livelli alti di stress, ma un aiuto
    psicologico non è sempre a portata di mano. E se arrivasse direttamente sul telefono? Questo
    articolo presenta il piano di uno studio pilota su ALBA, un assistente virtuale inserito in
    un’app sanitaria trentina, che propone in forma digitale Self-Help Plus, un programma per
    gestire lo stress validato dall’Organizzazione mondiale della sanità. Per sei settimane circa 50
    pazienti della Breast Unit di Trento riceveranno sessioni settimanali con testi, audio, video ed
    esercizi. Lo studio verificherà soprattutto quanto l’app sia facile da usare e coinvolgente, ed
    esplorerà stress, benessere e qualità della vita. Un primo passo per portare un aiuto validato
    nelle mani delle pazienti.
