  why_open: I dati raccolti; L'articolo, gratuito sul sito della rivista
  public_summary: 'Attraversare la strada sembra un gesto semplice, ma richiede attenzione
    continua: un attimo di distrazione può costare caro, soprattutto a chi comincia
    a muoversi da solo. Questo studio ha messo alla prova 42 ragazzi tra gli 11 e
    i 16 anni, metà con disturbo da deficit di attenzione e iperattività (ADHD) e
    metà senza, dentro una città in realtà virtuale: con un visore sugli occhi dovevano
    attraversare la strada e camminare sul marciapiede, tra auto in arrivo, semafori
    e imprevisti. I ragazzi con ADHD deviavano di più dal percorso, distoglievano
    più spesso lo sguardo e impiegavano più tempo a evitare gli ostacoli; ma prima
    di attraversare controllavano con cura entrambi i lati. Capire quali comportamenti
    espongono al rischio, e quali buone abitudini sono già presenti, aiuta a pensare
    un''educazione stradale su misura per ogni ragazzo.'
