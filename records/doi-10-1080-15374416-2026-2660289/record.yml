  why_open: I dati raccolti; L'articolo, gratuito sul sito della rivista
  public_summary: 'Durante l''adolescenza alcuni ragazzi mostrano tratti come la freddezza
    verso gli altri, l''impulsività o un''audacia senza paura. Che legame hanno con
    il modo in cui i ragazzi stanno nel tempo? I ricercatori hanno seguito 698 studenti
    di sei scuole superiori dell''Italia centrale, che hanno compilato questionari
    tre volte nell''arco di circa nove mesi. Le domande riguardavano comportamenti
    aggressivi o contro le regole, emozioni, rapporti con i compagni, gentilezza verso
    gli altri e voti scolastici. Ne emergono tre profili distinti: la freddezza si
    accompagnava a più comportamenti aggressivi e a meno gesti di aiuto; l''impulsività
    a quasi tutte le difficoltà, compresi voti più bassi; l''audacia a meno ansia
    e tristezza. Questi legami erano in gran parte simili tra ragazzi e ragazze. Secondo
    gli autori, conoscere queste differenze può aiutare a progettare interventi mirati
    a ciascun tratto.'
