  why_open: I dati raccolti
  public_summary: >-
    La terapia cognitivo-comportamentale, che aiuta a modificare pensieri e abitudini
    che alimentano il disagio, è tra le cure psicologiche più diffuse al mondo. Ma
    quanto funziona, disturbo per disturbo? Un ampio gruppo di ricerca
    internazionale, con la partecipazione dell'Università di Padova, ha analizzato
    con lo stesso metodo 375 studi controllati su quasi 33.000 adulti: depressione,
    vari disturbi d'ansia, disturbo ossessivo-compulsivo, stress post-traumatico,
    disturbi alimentari, psicosi e disturbo bipolare. La terapia è risultata
    probabilmente efficace per la maggior parte di questi disturbi, con benefici più
    ampi per le fobie specifiche e lo stress post-traumatico e più contenuti, ma
    possibili, per psicosi e disturbo bipolare. Gli autori mostrano anche che il
    beneficio stimato dipende dal confronto scelto: è più ampio rispetto alla lista
    d'attesa che rispetto alle cure abituali. Un quadro d'insieme che finora mancava.
