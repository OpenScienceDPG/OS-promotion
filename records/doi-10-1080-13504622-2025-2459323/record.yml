  why_open: "I dati raccolti; Il codice usato per le analisi; I materiali dello studio, come questionari e stimoli"
  public_summary: >-
    Che cosa spinge un adolescente a prendersi cura del pianeta? Sentirsi parte della natura e
    sentirsi capaci di fare qualcosa per l’ambiente sono due premesse importanti. Questo studio, con
    702 studenti italiani tra i 12 e i 20 anni, ha cercato quali abilità personali vadano di pari
    passo con questi atteggiamenti. Spicca la capacità di innovare, che comprende curiosità e
    pensiero astratto: era la più legata sia al sentirsi vicini alla natura sia al sentirsi in grado
    di agire. Seguivano la capacità di collaborare e quella di organizzarsi. E queste abilità
    sembravano collegarsi ai comportamenti a favore dell’ambiente proprio attraverso quegli
    atteggiamenti. Curiosità e collaborazione, insomma, vanno a braccetto con l’amore per la natura.
