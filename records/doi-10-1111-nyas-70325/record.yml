  public_summary: 'Perché, quando pensiamo ai numeri, li immaginiamo in fila da sinistra
    a destra? Per capire quanto conti l''esperienza, il gruppo di ricerca ha lavorato
    con pulcini di un giorno, che hanno una naturale tendenza a esplorare partendo
    da sinistra. In due esperimenti, 70 pulcini hanno imparato a cercare un vermetto
    nascosto dietro tre pannelli disposti uno dietro l''altro, con un numero di elementi
    che per alcuni cresceva (2, 5, 8) e per altri diminuiva. Alla prova, con i pannelli
    messi in fila orizzontale, i pulcini abituati alle sequenze crescenti partivano
    sempre da sinistra, mentre quelli abituati alle sequenze decrescenti non mostravano
    alcuna preferenza. Secondo gli autori, anche una breve esperienza con i numeri
    può modellare le inclinazioni spaziali del cervello fin dai primi giorni di vita:
    un indizio prezioso sulle radici del nostro modo di pensare i numeri.'
