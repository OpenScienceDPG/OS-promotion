  why_open: "I dati raccolti"
  public_summary: >-
    Dopo aver girato in una città nuova, sapresti disegnarne la mappa? In questo studio ci
    riuscivano meglio le persone brave a ricomporre mentalmente un puzzle. Settantaquattro giovani
    adulti hanno percorso due volte un itinerario in una città virtuale immersiva, poi hanno
    collocato su una mappa i luoghi incontrati: una volta a mano libera, una volta con alcuni
    suggerimenti sulle posizioni possibili. I suggerimenti aiutavano, come prevedibile. Ma in
    entrambi i casi, tra cinque prove di memoria visuospaziale, a fare la differenza era soprattutto
    una: la capacità di mettere insieme nella mente pezzi di immagini. Orientarsi, insomma, non è
    solo questione di ricordare: bisogna saper combinare.
