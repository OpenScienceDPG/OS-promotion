curation:
  status: curated
  why_open: I dati raccolti
  public_summary: >-
    Si può capire se qualcuno mente guardandolo negli occhi? Il gruppo di ricerca ha chiesto
    a 57 adulti di rispondere a una serie di domande su sé stessi; a una parte di loro era
    stato chiesto di sostenere un'identità inventata. Mentre rispondevano, uno strumento
    registrava la dilatazione della pupilla e i battiti di ciglia, insieme ai tempi di
    risposta. Il segnale più chiaro è stato il tempo: chi mentiva impiegava di più a
    rispondere, soprattutto alle domande inattese, quelle a cui non poteva essersi preparato.
    Anche la pupilla si comportava in modo diverso tra chi diceva il vero e chi mentiva,
    mentre i battiti di ciglia non cambiavano. Un programma che impara dagli esempi ha
    riconosciuto chi mentiva fino a 84 volte su 100. Per gli autori, la pupilla può offrire
    un'informazione in più accanto ai tempi di risposta.
