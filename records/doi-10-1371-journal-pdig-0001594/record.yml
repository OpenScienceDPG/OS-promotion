  why_open: I dati raccolti; L'articolo, gratuito sul sito della rivista
  public_summary: 'Se in ospedale un programma di intelligenza artificiale aiuta a
    prendere decisioni, chi lo usa ha diritto a sapere come funziona, quanto è affidabile
    e quali limiti ha. La legge europea prevede per questo un documento apposito,
    le istruzioni per l''uso, con un elenco preciso di informazioni da fornire. Ma
    risponde davvero alle domande di chi usa questi strumenti? Il gruppo di ricerca
    ha chiesto a 813 persone, tra dirigenti, professionisti sanitari, pazienti ed
    esperti informatici, di valutare l''importanza di 24 tipi di informazioni e di
    indovinare in quale parte del documento trovarle. Le priorità cambiavano da un
    gruppo all''altro e alcune informazioni risultavano difficili da rintracciare.
    Da qui gli autori ricavano consigli concreti per scrivere istruzioni più chiare
    e utili: un passo importante perché la tecnologia in medicina sia davvero trasparente
    per tutti.'
