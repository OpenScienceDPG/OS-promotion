  public_summary: >-
    Ciò che guardiamo al centro può nascondere ciò che sta ai margini. Gli autori descrivono un
    fenomeno della vista che hanno chiamato CRIP: un disegno al centro del campo visivo può
    ostacolare il riconoscimento di ciò che compare in periferia. In cinque esperimenti le persone,
    tenendo lo sguardo fisso su un punto, dovevano dire come fossero inclinate delle piccole linee
    ai lati, mentre al centro comparivano altri disegni. Il riconoscimento peggiorava quando il
    disegno centrale conteneva linee con inclinazioni simili, e quando le due zone erano più vicine.
    A sorpresa, persino linee centrali identiche a quelle da riconoscere potevano disturbare. Una
    scoperta che svela un’interferenza inattesa tra visione centrale e periferica.
