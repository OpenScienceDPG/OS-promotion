  why_open: I dati raccolti; L'articolo, gratuito sul sito della rivista
  public_summary: 'Ballare va di pari passo con l''essere creativi? Le ricercatrici
    e i ricercatori hanno messo a confronto 35 ballerini esperti di danza moderna,
    45 ballerini amatoriali e 36 persone che non ballano. Tutti hanno svolto una prova
    di creatività, inventando usi originali per oggetti comuni, e hanno risposto a
    domande su quanto si sentono creativi. Ballerini esperti e amatori hanno anche
    improvvisato una danza a partire da uno spunto poetico: il corpo è un orologio.
    Gli esperti hanno ottenuto i risultati migliori sia nella prova di creatività
    sia nell''improvvisazione, e anche gli amatori hanno trovato più idee di chi non
    balla; solo gli esperti, però, si percepivano più creativi. Negli amatori, inoltre,
    chi aveva più idee nella prova scritta improvvisava meglio. Un risultato che conferma
    il legame tra danza e creatività, nella mente come nel corpo.'
