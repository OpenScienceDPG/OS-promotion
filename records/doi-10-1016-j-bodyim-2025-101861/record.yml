  why_open: "I dati raccolti; Il codice usato per le analisi"
  public_summary: >-
    Magri, muscolosi, attraenti: gli adolescenti sono circondati da ideali di bellezza che arrivano
    da famiglia, amici e media. Per capire quanto pesano servono strumenti di misura affidabili, e
    questo studio ne mette alla prova uno per i ragazzi italiani. Quasi 1.150 studenti tra i 13 e i
    17 anni hanno compilato il SATAQ-4R, un questionario che misura quanto si fanno propri gli
    ideali di bellezza e quanta pressione si sente dalle persone vicine e dai media. Il risultato:
    lo strumento funziona bene sia per le ragazze sia per i ragazzi, mantiene la stessa struttura
    dalla prima alla media adolescenza e si collega come previsto ad autostima, insoddisfazione per
    il corpo e sintomi alimentari. Ricercatori e clinici hanno ora un metro affidabile per studiare
    queste pressioni negli adolescenti italiani.
