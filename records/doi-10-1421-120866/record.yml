curation:
  status: curated
  why_open: I materiali dello studio, come questionari e stimoli
  public_summary: >-
    Se dovete dire in fretta se un numero è piccolo o grande, rispondete un
    po' prima con la mano sinistra per i numeri piccoli e con la destra per quelli grandi:
    è come se nella nostra mente i numeri stessero in fila da sinistra a destra. Questo
    legame vale anche quando stimiamo a colpo d'occhio quanti oggetti abbiamo davanti? I
    ricercatori hanno mostrato a 80 giovani adulti immagini piene di cerchi, chiedendo di
    indicare con un tasto a sinistra o a destra se fossero più o meno di venti. Intanto
    cambiavano luminosità, fittezza, superficie e contorno dei cerchi. Il legame
    tra numeri e spazio è comparso comunque, anche se superficie e contorno ne modulavano un
    po' la forza. Per gli autori, il nostro senso della quantità si basa in gran parte su
    meccanismi propri, distinti dall'aspetto visivo delle cose.
