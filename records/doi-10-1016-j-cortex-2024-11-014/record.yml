  public_summary: >-
    Quando guardiamo una figura simmetrica, il cervello risponde con un segnale elettrico
    caratteristico, che nasce in due regioni visive, una per lato. Qualche tempo fa era spuntata una
    terza risposta, più tardiva e più centrale, che sembrava accendersi solo quando la simmetria era
    ben visibile e importante per il compito. Esiste davvero? Per scoprirlo gli autori hanno
    riaperto l’archivio del loro laboratorio: 23 esperimenti e 500 partecipanti. La risposta è
    sfumata: la terza sorgente a volte compare, e quando c’è va di pari passo con la risposta
    classica, ma è molto meno prevedibile di quanto si pensasse, forse perché i suoi tempi cambiano
    da una volta all’altra. Un bell’esempio di ricerca che rimette alla prova le proprie scoperte.
