  public_summary: >-
    Avere accanto qualcuno durante un momento di stress aiuta? Dipende anche da chi è. In questo
    esperimento 40 giovani donne hanno affrontato un colloquio di lavoro simulato davanti a una
    commissione, una classica prova di stress. Accanto a loro, in silenzio, c’era il partner oppure
    uno sconosciuto. Con il partner presente il cuore batteva più piano durante la prova, ma le
    donne dicevano di sentirsi più ansiose e stressate; e tra loro, chi soffriva di più di ansia
    sociale viveva la prova con maggiore intensità. Forse, suggeriscono gli autori, davanti al
    partner è più facile ammettere il proprio disagio. Un risultato che mostra come corpo e
    sensazioni possano raccontare due storie diverse.
