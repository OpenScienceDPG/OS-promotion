  public_summary: >-
    Essere gentili con sé stessi vuol dire la stessa cosa ovunque nel mondo? Per scoprirlo gli
    autori hanno usato le risposte di quasi 57.000 persone, in 65 paesi e 40 lingue, a un breve
    questionario sull’autocompassione. La versione che funziona meglio usa 11 domande e distingue
    due atteggiamenti: affrontare le difficoltà con comprensione verso sé stessi, oppure con durezza
    e senso di isolamento. Questa struttura regge allo stesso modo per uomini e donne e a tutte le
    età, e in buona parte anche tra paesi e lingue diverse, mentre i livelli medi di autocompassione
    cambiano molto da una nazione all’altra. Un’ampia base comune per confrontare come le persone di
    culture diverse si prendono cura di sé.
