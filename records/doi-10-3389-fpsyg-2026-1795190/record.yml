  public_summary: 'Una visita guidata in un luogo storico può farci sentire meglio,
    come una passeggiata nel verde? Le ricercatrici e i ricercatori hanno chiesto
    a 149 visitatori di compilare brevi questionari prima e dopo una visita guidata
    di 45 minuti in due luoghi del Nord-Est: il sito archeologico di Aquileia e l''Abbazia
    benedettina di Praglia, sui Colli Euganei. Hanno misurato emozioni, stress dell''ultimo
    mese, legame con la natura e la sensazione di essersi ricaricati. In entrambi
    i luoghi, dopo la visita, le emozioni erano più positive; ad Aquileia i visitatori
    si sentivano anche più attivati, mentre a Praglia il livello di attivazione restava
    stabile. Chi attribuiva alla visita un forte valore artistico, culturale e storico
    si sentiva più rigenerato. Un suggerimento prezioso per progettare visite che
    facciano bene anche alla mente.'
