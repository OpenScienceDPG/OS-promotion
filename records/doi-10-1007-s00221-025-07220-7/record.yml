  why_open: I dati raccolti; L'articolo, gratuito sul sito della rivista
  public_summary: 'Scrivere sul telefono sembra banale, ma i pollici di chi è cresciuto
    con lo smartphone si muovono come quelli di chi l''ha scoperto da adulto? Le ricercatrici
    e i ricercatori hanno confrontato 33 persone destrorse: giovani nati dal 1980
    in poi e adulti nati prima. Con un sistema di telecamere hanno registrato i movimenti
    del pollice mentre tutti scrivevano le stesse frasi in una chat su WhatsApp e
    in una ricerca su Google. I più giovani hanno scritto più in fretta, in media
    circa 76 secondi contro 131, con movimenti più rapidi e decisi. Gli adulti, però,
    hanno usato di più i suggerimenti automatici della tastiera, soprattutto in chat,
    senza commettere più errori. Secondo il gruppo di ricerca, la nostra storia di
    gesti contribuisce a plasmare il modo in cui usiamo la tecnologia.'
