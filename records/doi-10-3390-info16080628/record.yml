  public_summary: >-
    Riconoscere gli uccelli dal canto, in automatico, per sapere quali specie vivono in un bosco: è
    ciò che fa BirdNET, un sistema di intelligenza artificiale. Ma funziona bene ovunque? Gli autori
    l’hanno «addestrato» con circa 18 ore di registrazioni raccolte in una foresta delle Alpi
    italiane, arricchite con suoni di un archivio pubblico per le specie più rare. Il risultato: la
    versione adattata ai suoni locali riconosceva più canti dell’originale e batteva anche una rete
    più semplice costruita da zero, per 16 specie diverse. Un piccolo ritocco con esempi locali,
    insomma, rende l’orecchio artificiale più fine. Uno strumento prezioso per monitorare la
    biodiversità delle nostre montagne.
