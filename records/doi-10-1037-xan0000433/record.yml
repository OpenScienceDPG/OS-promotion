  public_summary: 'Perché impariamo in fretta a temere ciò che ci ha fatto male, ma
    non ciò che ci ha appena sfiorato? Le ricercatrici e i ricercatori hanno chiesto
    a 20 adulti di osservare dei cerchi colorati su uno schermo: un colore era spesso
    seguito da una leggera scossa sul polso, un altro da una scossa dolorosa, regolata
    sul limite di sopportazione di ciascuno, il terzo da nulla. Intanto misuravano
    la sudorazione della pelle, un segnale involontario di allerta. Solo il colore
    legato al dolore ha iniziato a provocare una reazione di attesa, e una risposta
    più forte quando la scossa prevista non arrivava, come un segnale di sorpresa.
    Un modello al computer ha mostrato che le persone davano al dolore un peso maggiore,
    pur imparando con velocità simile. Un tassello prezioso per capire come impariamo
    dalle esperienze spiacevoli.'
