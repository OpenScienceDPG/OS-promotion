  public_summary: 'Quando un esperimento non trova l''effetto cercato, che cosa possiamo
    concludere davvero? Gli autori hanno ripreso uno studio sulle scelte morali in
    cui 185 persone decidevano come dovrebbe comportarsi un''auto a guida autonoma
    davanti a un incidente inevitabile, per esempio se sacrificare il proprio passeggero
    per salvare tre pedoni. Si voleva capire se avere pochi secondi per decidere,
    o l''ordine delle situazioni, cambiasse le risposte. Gli stessi dati sono stati
    analizzati con due approcci statistici: quello tradizionale, che cerca prove contro
    l''assenza di un effetto, e quello bayesiano, che valuta quanto è plausibile ciascuna
    ipotesi. Entrambi hanno indicato che i fattori studiati non influenzavano in modo
    apprezzabile le scelte, e il secondo ha mostrato prove a favore dell''assenza
    di un effetto. Un esempio concreto e prezioso per chi deve interpretare un risultato
    nullo.'
