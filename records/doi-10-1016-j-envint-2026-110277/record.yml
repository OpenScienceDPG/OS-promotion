  public_summary: Una passeggiata al parco ci fa sentire meglio, ma per quale strada?
    Un grande gruppo internazionale di ricercatrici e ricercatori lo ha chiesto a
    oltre 50.000 adulti di 58 Paesi, in 36 lingue diverse. Le domande riguardavano
    il tempo passato nella natura, quanto ci si sente rigenerati dopo una gita all'aperto,
    la gentilezza verso sé stessi, l'apprezzamento del proprio corpo e la soddisfazione
    per la propria vita. Chi frequenta di più la natura tende a trattarsi con più
    gentilezza e a sentirsi più rigenerato; queste persone apprezzano anche di più
    il proprio corpo, e ciò va di pari passo con una vita più soddisfacente. Il quadro
    si ripete a ogni età e quasi in ogni Paese. Secondo il gruppo di ricerca, il benessere
    che troviamo nella natura potrebbe passare anche da un rapporto più sereno con
    il nostro corpo.
