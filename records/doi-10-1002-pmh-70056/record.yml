  public_summary: 'Sapere chi siamo, capire gli altri e riuscire a stare vicino alle
    persone: sono ingredienti fondamentali di una personalità che funziona bene. Ma
    si possono misurare con un semplice questionario? Gli autori hanno studiato la
    versione italiana di un breve questionario di 24 domande, compilato online da
    1183 persone della popolazione generale insieme ad altre scale su ansia, depressione,
    comportamenti problematici e benessere. Le analisi hanno mostrato che lo strumento
    misura bene tre dimensioni: identità, empatia e intimità; le domande sulla capacità
    di orientare la propria vita, invece, non funzionavano e sono state tolte. Chi
    riportava più difficoltà in queste dimensioni tendeva a riferire più disagio emotivo,
    più chiusura verso gli altri e meno benessere, soprattutto sul fronte dell''identità.
    Secondo gli autori, il questionario può aiutare a riconoscere per tempo fragilità
    psicologiche, anche fuori dagli ambulatori.'
