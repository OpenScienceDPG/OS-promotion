  public_summary: >-
    Un suono acuto «sa» di chiaro, uno grave di scuro: molte persone fanno spontaneamente questa
    associazione, e lo fanno anche gli scimpanzé. E una tartaruga? Lo studio l’ha chiesto a 18
    testuggini di Hermann, rettili che non comunicano con la voce. Dopo aver imparato a trovare il
    cibo seguendo un suono, le testuggini sentivano un suono acuto o grave e potevano entrare in uno
    scomparto bianco o in uno nero, mai visti prima. Il risultato: sceglievano il bianco con il
    suono acuto e il nero con quello grave più spesso di quanto atteso dal caso. Una scoperta che
    suggerisce che queste curiose associazioni tra i sensi non dipendano dal linguaggio, e che apre
    la domanda su quanto siano antiche.
