  public_summary: >-
    Quando qualcuno ci spiega a voce come arrivare in un posto, riusciamo a farcene una mappa
    nella testa? E aiuta se lungo la strada ci sono elementi naturali, come una strada sterrata o
    un cartello di legno? Le ricercatrici hanno fatto ascoltare a 160 giovani adulti tre
    descrizioni di percorsi: in una i punti di riferimento erano naturali, in un'altra
    artificiali, come asfalto e cemento, nella terza descritti per la loro funzione. Dopo ogni
    ascolto i partecipanti disegnavano la mappa del luogo. Le descrizioni «naturali» sono state
    giudicate più piacevoli, ma non hanno portato a mappe più precise. A fare la differenza era
    soprattutto la persona: chi ricordava meglio le caratteristiche dei punti di riferimento e li
    immaginava in modo vivido disegnava mappe più accurate. Un risultato prezioso per capire come
    costruiamo lo spazio a partire dalle parole.
