  public_summary: >-
    Anche un pesciolino appena nato ha i suoi gusti in fatto di casa? Un gruppo di
    ricerca delle università di Padova e Ferrara lo ha chiesto alle larve di pesce
    zebra, un piccolo pesce molto studiato nei laboratori, a pochi giorni dalla
    schiusa. Le larve potevano scegliere tra una zona vuota e una arredata con oggetti
    di forme e colori diversi. All'inizio esitavano davanti alle novità, ma entro
    un'ora e mezza cominciavano a preferire la zona arredata, e il giorno dopo la
    preferenza era ancora più netta. Anche le fotografie degli oggetti le attiravano,
    ma meno di quelli veri, mentre oggetti trasparenti o tutti bianchi le lasciavano
    indifferenti: contavano soprattutto la vista e il colore. Per gli autori, questi
    risultati invitano a ripensare l'allevamento delle larve, con ambienti più ricchi
    fin dai primi giorni di vita.
