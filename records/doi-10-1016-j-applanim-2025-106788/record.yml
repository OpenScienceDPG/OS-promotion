    - 'Abstract Exp. 1: larvae aged 4-6 days post-fertilization preferred an environment with objects of varying shape and colour over a barren one; preference emerged within 90 min and peaked the following day, after an initial neophobic response.'
    - 'Abstract Exp. 2-3: photographs of objects attracted larvae but less than real objects; transparent and white objects were ineffective.'
    - 'Highlights and abstract: visual input, especially colour, is key; authors call for reassessing husbandry practices and research protocols.'
