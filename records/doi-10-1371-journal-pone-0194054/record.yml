  public_summary: >-
    Per scoprire una regola nascosta, come lo schema dietro una sequenza, il cervello si affida alla
    corteccia prefrontale. Una sua regione, il giro frontale inferiore sinistro, a lungo associata
    soprattutto al linguaggio, si attiva anche quando la regola è spaziale. Ma tratta allo stesso
    modo parole e forme, o sa distinguerle? Tredici partecipanti, dentro una risonanza magnetica,
    osservavano lettere che comparivano in punti diversi dello schermo e dovevano scoprire la
    regola: a volte le lettere formavano parole, altre volte le loro posizioni disegnavano figure
    geometriche. Dall’attività di quella regione si riusciva a capire quale tipo di regola la
    persona stesse cercando. E ripetendo l’esperimento sugli stessi partecipanti due anni dopo, il
    risultato si è confermato, anche se i singoli schemi di attività erano cambiati: il segno di un
    cervello flessibile.
