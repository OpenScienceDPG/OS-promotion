  public_summary: >-
    Nei primi mesi della pandemia, uno studio molto discusso sull’idrossiclorochina fu accettato
    dopo una revisione durata un solo giorno, su una rivista il cui direttore lavorava nell’istituto
    degli autori e figurava tra i firmatari. Partendo da questo caso, gli autori hanno passato al
    setaccio le riviste di malattie infettive con un indicatore semplicissimo: quanta parte degli
    articoli di ciascuna rivista è firmata dal suo autore più prolifico. Su oltre duecento riviste,
    una spicca nettamente: in cinque anni, più di un terzo dei suoi articoli portava la firma della
    stessa persona. Gli autori propongono di chiamare queste testate «riviste di autopromozione»:
    sedi che rischiano di servire soprattutto a gonfiare gli indicatori su cui si decidono carriere
    e finanziamenti. Un campanello d’allarme semplice ed efficace per proteggere la qualità della
    ricerca medica.
