  why_open: I dati raccolti; Il codice usato per le analisi
  public_summary: >-
    All'università, chi ha un disturbo specifico dell'apprendimento, come la dislessia,
    deve spesso faticare più dei compagni per stare al passo. Ma conta solo il modo di
    studiare, o anche abilità personali come organizzarsi, collaborare e gestire le
    emozioni? Il gruppo di ricerca ha raccolto con un questionario online le risposte di
    752 studenti universitari, 125 dei quali con una diagnosi di questo tipo, confrontando
    fiducia nelle proprie capacità, strategie di studio, abilità personali, voti,
    soddisfazione e senso di esaurimento. Gli studenti con disturbo si sentivano meno sicuri
    nello studio, usavano meno strategie efficaci, si descrivevano meno organizzati e
    avevano voti un po' più bassi. In entrambi i gruppi, però, il coinvolgimento negli studi
    e la capacità di gestire le emozioni andavano di pari passo con più benessere. Per gli
    autori, sostenere queste risorse può aiutare tutti gli studenti.
