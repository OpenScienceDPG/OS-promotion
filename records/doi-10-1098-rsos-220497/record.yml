  why_open: "Il piano dello studio, reso pubblico prima di raccogliere i dati; Il progetto, approvato dalla rivista prima di conoscere i risultati; I dati raccolti; Il codice usato per le analisi; I materiali dello studio, come questionari e stimoli; Il protocollo dettagliato dello studio; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Il ticchettio di un orologio, il rumore dei passi, il moto delle onde: il mondo è pieno di
    ritmi, e si pensa che il cervello li usi per anticipare ciò che sta per accadere. Nel 2015 uno
    studio aveva mostrato che, dopo aver ascoltato un rumore pulsante, si coglie meglio un suono
    debole se arriva «a tempo» con quel ritmo. Ma i partecipanti erano appena cinque. Così numerosi
    laboratori nel mondo hanno unito le forze e ripetuto l’esperimento con 149 persone. Il verdetto:
    l’effetto è solido, anche se varia molto da persona a persona. Un risultato che conta anche
    fuori dal laboratorio: la stimolazione ritmica è usata nella riabilitazione dopo un ictus o nel
    Parkinson, e capire quanto il ritmo aiuti ciascuno può dire a chi possa servire di più.
