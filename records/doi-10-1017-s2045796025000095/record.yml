  public_summary: 'Quando si vuole sapere se una psicoterapia contro la depressione
    ha funzionato, a chi conviene chiedere: al paziente o a un esperto? Da tempo si
    teme che i pazienti, sapendo di essere stati curati, tendano a dichiararsi migliorati
    più del dovuto. Per verificarlo, il gruppo di ricerca ha riunito 91 studi sperimentali,
    con oltre 7.000 partecipanti, nei quali la depressione era stata misurata in due
    modi: con questionari compilati dai pazienti e con valutazioni fatte da clinici.
    Nel complesso è emerso che i questionari dei pazienti non gonfiano i benefici
    della terapia: anzi, mostrano miglioramenti leggermente più modesti di quelli
    registrati dai clinici, e negli studi sugli adulti in generale le due misure coincidono.
    Una conclusione preziosa: secondo gli autori, il modo in cui i pazienti giudicano
    il proprio miglioramento non va considerato per principio meno attendibile.'
