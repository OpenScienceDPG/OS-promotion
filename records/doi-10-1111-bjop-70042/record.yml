  why_open: I dati raccolti; I materiali dello studio, come questionari e stimoli
  public_summary: >-
    Nei quadri in cui Venere si guarda allo specchio, quasi tutti diciamo che la dea
    sta ammirando sé stessa. Eppure, dal suo punto di vista, spesso non potrebbe
    vedersi: a vedere il suo volto nello specchio è chi osserva il quadro. Un gruppo
    di ricerca italiano ha prima raccolto un catalogo di opere d'arte con specchi,
    dai mosaici antichi agli affreschi, e poi ne ha mostrate 21 a circa duecento
    persone online. La maggior parte cadeva nell'errore, chiamato "effetto Venere".
    Chi se la cavava meglio in un test su che cosa si vede da un certo punto di vista
    sbagliava meno, mentre la capacità di mettersi nei panni degli altri non faceva
    differenza. Per gli autori, l'errore nasce dalla difficoltà di immaginare una
    scena da un'altra posizione: un piccolo enigma dell'arte che svela come
    funziona la nostra mente.
