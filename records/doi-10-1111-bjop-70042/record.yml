    - 'Abstract: observers claim a character is looking at themselves when their reflection is visible, despite not sharing the viewpoint (Venus effect).'
    - 'Abstract: part 1 survey and catalogue of artworks with mirrors (mosaics, painted pottery, frescos); part 2 online with 21 artworks, N = 97, effect in most participants; part 3 N = 101.'
    - 'Abstract: AQ (cognitive/emotional perspective-taking) did not predict the effect, ROMP (visual perspective-taking) did; authors conclude the effect arises from failing to understand what can be seen from a viewpoint.'
