  why_open: Uno strumento che altri possono riutilizzare, come un programma o un test
  public_summary: >-
    Provate a dire, in un minuto, tutte le parole che vi vengono in mente e che iniziano
    con una certa lettera, oppure tutti gli animali che conoscete. Sembra un gioco, ma
    è una prova che neurologi e neuropsicologi usano spesso per capire come lavorano
    insieme linguaggio e capacità di controllo mentale. Servono però valori di riferimento
    aggiornati, e in Italia molti avevano decenni. Il gruppo di ricerca ha proposto cinque prove
    brevi di questo tipo, tra cui una in cui bisogna dare un nome a delle azioni, a 317
    adulti sani tra i 40 e gli 89 anni. Ne sono nate tabelle nuove che tengono conto di
    età e istruzione, accompagnate da un foglio di calcolo che fa i conti in automatico:
    uno strumento pronto per la pratica clinica e la ricerca.
