  public_summary: >-
    Il cuore e la mente dialogano più di quanto pensiamo. Questo studio, con 88 studenti
    universitari, mostra che chi ha qualche sintomo depressivo, anche lieve, tende a «sentire» meno
    il proprio corpo. I partecipanti dovevano contare e riconoscere i propri battiti e raccontare
    quanta attenzione prestassero alle sensazioni corporee; intanto si registrava l’attività del
    cuore a riposo. Sono emersi due profili. Chi percepiva meno i battiti, era meno attento al corpo
    e aveva un ritmo cardiaco meno flessibile, segno di un minore controllo da parte del nervo vago,
    riportava più sintomi depressivi, anche tenendo conto di ansia e stress. Un legame sottile tra
    corpo e umore, visibile già prima che il disagio diventi un disturbo.
