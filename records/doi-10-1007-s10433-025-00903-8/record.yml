  public_summary: 'Invecchiando, memoria, carattere e umore cambiano ciascuno per
    conto proprio, oppure si trasformano insieme, come pezzi di un unico sistema?
    Per rispondere, i ricercatori hanno analizzato i dati di un grande progetto internazionale
    su 681 adulti tra i 22 e i 79 anni, divisi in giovani, adulti di mezza età e anziani.
    Per ogni gruppo hanno disegnato una sorta di mappa dei legami tra 19 caratteristiche:
    capacità di ragionamento e memoria, tratti di personalità, benessere psicologico.
    Nei giovani le abilità mentali più semplici e quelle più complesse formavano due
    gruppi distinti, che con l''età si fondevano in un unico blocco. Negli anziani,
    inoltre, il riconoscere le emozioni altrui e la scelta tra un premio subito o
    uno più grande in futuro si avvicinavano alla sfera della personalità e dell''umore.
    Secondo gli autori, invecchiare significa anche riorganizzarsi, non soltanto declinare.'
