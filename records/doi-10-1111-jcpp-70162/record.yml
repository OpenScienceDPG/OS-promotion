  why_open: I dati raccolti; L'articolo, gratuito sul sito della rivista
  public_summary: 'Spesso si pensa che i bambini con ADHD, il disturbo da deficit
    di attenzione e iperattività, fatichino in tutto ciò che richiede concentrazione.
    Ma è davvero così? Grazie a dieci centri clinici e ad alcune scuole, oltre 240
    bambini e ragazzi tra 7 e 14 anni, 145 dei quali con ADHD, hanno affrontato due
    videogiochi: uno con frecce da seguire ignorando quelle vicine, l''altro con astronauti
    da aiutare, trattenendosi dal rispondere quando appariva un alieno. Alcune parti
    dei giochi erano più prevedibili di altre. Nel gioco più semplice, i bambini con
    ADHD imparavano a sfruttare le regolarità come i coetanei. Nel compito più complesso
    si adattavano in modo meno efficiente. Secondo gli autori, le difficoltà non dipendono
    da una minore capacità di imparare dal contesto: un messaggio incoraggiante, utile
    per pensare interventi mirati alle situazioni quotidiane più impegnative.'
