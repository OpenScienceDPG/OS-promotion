  why_open: "Il piano dello studio, reso pubblico prima di raccogliere i dati; I dati raccolti; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Nella nostra mente le quantità piccole stanno a sinistra e quelle grandi a destra: rispondiamo
    più in fretta ai numeri piccoli con la mano sinistra e a quelli grandi con la destra. Vale anche
    per la velocità? Gli autori l’hanno verificato in quattro esperimenti: le persone guardavano una
    nuvola di puntini in movimento e dovevano dire, premendo un tasto a sinistra o a destra, se
    fosse più lenta o più veloce di un riferimento. Il risultato: le velocità basse andavano
    d’accordo con la sinistra e quelle alte con la destra, qualunque fosse la direzione del
    movimento. L’effetto spariva solo quando la direzione cambiava di continuo da una prova
    all’altra. Anche la velocità, insomma, trova posto sulla nostra linea mentale.
