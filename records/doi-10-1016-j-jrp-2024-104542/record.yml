  why_open: "Il piano dello studio, reso pubblico prima di raccogliere i dati; I dati raccolti; Il codice usato per le analisi; I materiali dello studio, come questionari e stimoli; Il protocollo dettagliato dello studio"
  public_summary: >-
    «Il mio paese è speciale, ma il mondo non glielo riconosce»: è il narcisismo collettivo. Ne
    esistono due versioni: una rivendica la superiorità e il potere del proprio gruppo, l’altra lo
    vede come il più buono e generoso. Come si sono comportate queste persone durante la pandemia?
    Uno studio con oltre 15.000 partecipanti in 61 paesi ha cercato la risposta, e il quadro è
    sorprendente. Chi aveva livelli più alti di narcisismo collettivo credeva di più alle teorie del
    complotto, ma allo stesso tempo dichiarava di proteggersi di più dal virus, di fare più scorte e
    di aiutare di più gli altri. Non un rifiuto delle regole, quindi, ma una reazione più intensa su
    tutti i fronti.
