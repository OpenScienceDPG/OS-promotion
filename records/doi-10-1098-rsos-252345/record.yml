  public_summary: >-
    Dopo una notte quasi in bianco ci sentiamo meno lucidi, ma che cosa cambia davvero nella nostra
    mente? Margherita Calderan, Nicola Cellini e colleghi hanno chiesto a un gruppo di giovani
    adulti di dormire solo quattro ore, mentre un altro gruppo riposava normalmente; un sensore
    registrava il sonno di tutti. La mattina dopo tutti svolgevano un compito al computer: premere
    un tasto quando appariva un certo segnale e trattenersi quando ne compariva un altro, mentre la
    frequenza dei due segnali cambiava senza preavviso. Sorprendentemente, chi aveva dormito poco
    non sbagliava più degli altri nel trattenersi. Un modello matematico dell'apprendimento ha però
    rivelato una differenza: i partecipanti privati di sonno percepivano l'ambiente come meno
    mutevole. Secondo gli autori, questo rende più difficile accorgersi dei cambiamenti e
    aggiornare le proprie aspettative. Un motivo in più per difendere una buona notte di sonno.
