  public_summary: >-
    Anche quando non stiamo facendo nulla, il cervello lavora: secondo alcune teorie è come se
    immaginasse da solo esperienze possibili. Gli autori hanno esplorato questa idea con reti
    neurali artificiali che hanno imparato da sole a riprodurre cifre scritte a mano e volti. Una
    volta addestrate, le reti erano capaci di «sognare»: generavano immagini partendo dai propri
    stati interni, senza alcuno stimolo dall’esterno. Partendo da stati «chimera», che mescolavano
    caratteristiche di categorie diverse, le immagini diventavano più varie. Le reti a più livelli
    esploravano più possibilità di quelle semplici, e le immagini «sognate» le aiutavano a imparare
    cose nuove senza dimenticare quelle già note. Un affascinante laboratorio al computer per capire
    che cosa fa il cervello quando sembra a riposo.
