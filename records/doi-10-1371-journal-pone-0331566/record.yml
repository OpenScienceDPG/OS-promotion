  public_summary: >-
    Una persona capisce a colpo d’occhio se in una foto ci sono tre o quattro mele, e sa contarne
    con precisione anche di più. Le intelligenze artificiali che vedono e scrivono ci riescono? Gli
    autori le hanno messe alla prova con due compiti ispirati alla psicologia: dire quanti oggetti
    compaiono in un’immagine semplice, oppure disegnarne un numero preciso. Hanno esaminato molti
    sistemi, dai più diffusi ai più avanzati come Gemini e GPT, fino ai generatori di immagini come
    DALL-E e Stable Diffusion. La sorpresa: anche i migliori sbagliano spesso, a volte vistosamente,
    appena gli oggetti superano i pochi che si colgono con un’occhiata, e gli errori cambiano con il
    tipo di oggetto. Contare, insomma, resta una sfida per le macchine, e per gli autori non basterà
    renderle più grandi.
