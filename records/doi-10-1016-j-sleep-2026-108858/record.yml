  public_summary: Alcune persone, di notte, si alzano e camminano, parlano o gridano
    spaventate senza svegliarsi davvero, e al mattino spesso non ricordano nulla.
    Sonnambulismo e terrori notturni hanno a che fare con il carattere? Per capirlo,
    le ricercatrici e i ricercatori hanno coinvolto cinque centri del sonno tra Italia
    e Svizzera, confrontando 39 adulti con questi disturbi e 40 persone senza, simili
    per età e sesso. Tutti hanno compilato un lungo questionario sulla personalità
    e alcune scale sul sonno. Presi uno per uno, i tratti di personalità non distinguevano
    i due gruppi. Considerati insieme, però, una maggiore tendenza a preoccuparsi,
    un forte bisogno di legami affettivi e una spiccata perseveranza si associavano
    a una maggiore probabilità di avere questi episodi. Il lavoro aiuta a conoscere
    meglio chi vive queste notti agitate e apre la strada a nuovi studi.
