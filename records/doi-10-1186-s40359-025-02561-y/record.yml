curation:
  status: reviewed
  why_open: "I dati raccolti; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Il cuore può influenzare il modo in cui il cervello filtra i suoni? Quando sentiamo due clic uno
    dopo l’altro, il cervello risponde al secondo con meno forza: è un filtro naturale che ci evita
    di essere sommersi dagli stimoli ripetuti. Gli autori hanno registrato l’attività del cuore e
    del cervello di 31 giovani adulti, prima a riposo e poi durante l’ascolto di coppie di clic. Il
    risultato: chi aveva oscillazioni più ampie del ritmo cardiaco a bassa frequenza attenuava di
    più la risposta al secondo clic. Un primo indizio di una «via nascosta» tra la regolazione del
    corpo e le prime fasi in cui il cervello elabora ciò che sentiamo.
  topics:
  - psicofisiologia
  - filtraggio sensoriale
  - variabilità cardiaca
