  public_summary: >-
    Chi passa ore sullo smartphone o fatica a staccarsi da internet ha qualcosa in comune? Matilda Floris
    e Claudio Gentili l'hanno chiesto a 420 adulti italiani con un questionario online.
    Hanno misurato l'uso problematico di internet e del cellulare, il consumo di sostanze, il disagio
    psicologico e i tratti autistici: caratteristiche come il modo di comunicare o di gestire i cambiamenti,
    presenti in misura diversa in ognuno di noi. I più giovani, tra i 18 e i 24 anni, mostrano l'uso più
    intenso di rete e telefono. Chi ha tratti autistici più marcati tende a usare internet e cellulare
    in modo più problematico, mentre il disagio psicologico va di pari passo con tutti questi comportamenti,
    compreso il consumo di sostanze. Per gli autori, dietro abitudini simili possono nascondersi strade
    diverse: una pista preziosa per aiuti più mirati.
