  why_open: "Il piano dello studio, reso pubblico prima di raccogliere i dati; I dati raccolti; I materiali dello studio, come questionari e stimoli; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Basta un minuto di cammino nel verde per sentirsi meglio? Sembrerebbe di sì. Centocinquantuno
    giovani hanno camminato per Padova lungo sei brevi tragitti, di circa un minuto ciascuno, scelti
    tra percorsi più o meno ricchi di alberi e vegetazione. Dopo ogni tratto raccontavano come si
    sentivano e quanto l’ambiente fosse rigenerante, e stimavano distanza e tempo. Il risultato: più
    verde, più emozioni positive e più sensazione di ricaricarsi. Il verde non cambiava invece la
    precisione nello stimare distanze e tempi, legata piuttosto all’abilità di ruotare mentalmente
    gli oggetti. Un buon motivo in più per portare il verde in città: anche un minuto tra gli alberi
    si fa sentire.
