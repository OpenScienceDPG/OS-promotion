  public_summary: >-
    Provate a memorizzare delle immagini mentre qualcuno vi detta delle lettere da contare: non è
    facile. Lo studio ha messo alla prova 38 adulti tra i 52 e i 72 anni, registrandone l’attività
    cerebrale mentre memorizzavano immagini ascoltando una serie di lettere, a volte ignorandole, a
    volte contando quante volte compariva una lettera precisa. Quando l’attenzione era divisa,
    ricordare le immagini diventava più difficile. Con l’età la memoria era un po’ meno precisa in
    generale, ma la distrazione non pesava in modo evidente di più sulle persone più anziane. E il
    cervello rispondeva alla sfida: sotto distrazione aumentavano alcuni segnali elettrici legati
    alla memorizzazione, come se mettesse in campo più risorse.
