curation:
  status: curated
  why_open: "I dati raccolti; Il codice usato per le analisi; I materiali dello studio, come questionari e stimoli"
  public_summary: >-
    Gonfiare ancora il palloncino o fermarsi? Più si gonfia, più caramelle si vincono, ma se scoppia
    si perde tutto. A questo gioco hanno giocato 170 bambini tra i 4 e i 7 anni. Il segreto era nel
    colore: senza che nessuno lo dicesse, alcuni palloncini reggevano più di altri. E i bambini
    l’hanno capito da soli, usando quell’informazione per vincere di più. Quando le regole
    cambiavano a metà gioco, si adattavano soprattutto se la situazione diventava più favorevole.
    Già da piccoli, insomma, impariamo senza accorgercene quando vale la pena rischiare. E il modo
    in cui ciascun bambino si adattava si legava anche alle eventuali difficoltà di comportamento
    segnalate dai genitori.
