  why_open: "I dati raccolti"
  public_summary: >-
    Lavorare fianco a fianco con un robot: quando diventa troppo? In laboratorio, 34 persone hanno
    assemblato dei componenti insieme a un braccio robotico, una volta concentrandosi solo su
    quello, un’altra facendo nel frattempo sottrazioni a voce alta. Mentre lavoravano, i ricercatori
    ne registravano battito cardiaco e dilatazione delle pupille, oltre a chiedere come si
    sentivano. Il doppio compito faceva salire la fatica mentale percepita e rallentava il lavoro,
    ma senza aumentare gli errori; e un compito più impegnativo non voleva dire per forza più
    stress. Il dato più interessante: combinare cuore e pupille diceva di più che guardarli
    separatamente, soprattutto su sforzo e attivazione. Un primo passo verso sistemi capaci di
    «leggere» lo stato di chi lavora accanto ai robot.
