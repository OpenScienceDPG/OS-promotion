curation:
  status: curated
  why_open: Il piano dello studio, reso pubblico prima di raccogliere i dati; I dati
    raccolti; Il codice usato per le analisi; I materiali dello studio, come questionari
    e stimoli
  public_summary: Se si affidano gli stessi dati a cinque esperti diversi, arriveranno
    alla stessa risposta? Un grande progetto internazionale ha voluto scoprirlo. Le
    ricercatrici e i ricercatori hanno estratto a sorte 100 studi di economia, scienze
    politiche, psicologia e altre scienze sociali, pubblicati tra il 2009 e il 2018,
    scegliendo per ciascuno un'affermazione chiave. Poi hanno consegnato i dati originali
    ad almeno cinque analisti indipendenti, centinaia in tutto, liberi di usare il
    metodo che ritenevano migliore; altri colleghi hanno valutato ogni analisi. Solo
    circa un terzo dei nuovi risultati coincideva quasi esattamente con l'originale.
    Le conclusioni, invece, erano le stesse in circa tre casi su quattro; negli altri
    l'effetto per lo più spariva o restava incerto. Lo studio mostra quanto conti
    chi fa i calcoli e indica una strada concreta per una ricerca più solida.
