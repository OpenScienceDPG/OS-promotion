    dettagliato dello studio; L'articolo, gratuito sul sito della rivista
  public_summary: La vecchiaia fa pensare ad acciacchi e perdite. Ma chi ci vive accanto
    può aiutarci a guardarla diversamente? Questo articolo presenta il piano di uno
    studio a Barcellona che punta a coinvolgere 180 coppie con più di 65 anni. In
    alcune coppie entrambi i partner seguiranno un percorso di dodici settimane, in
    altre lo seguirà uno solo, altre ancora faranno da confronto. Il percorso unisce
    tre incontri di gruppo, in cui si riconoscono i luoghi comuni sull'età e si impara
    a sostituire i pensieri negativi con altri più realistici, e un programma di camminate
    a passo svelto. Le ricercatrici e i ricercatori misureranno come cambiano il modo
    di vedere il proprio invecchiamento, il movimento e l'umore, fino a sei mesi dopo.
    Un progetto che guarda all'età che avanza come a un'esperienza da vivere in due.
