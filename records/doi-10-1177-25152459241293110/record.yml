  public_summary: >-
    Quando un ricercatore ha già un’idea precisa di quali gruppi dovrebbero differire, confrontare
    tutto con tutto dopo aver visto i dati è una scelta poco efficiente: aumenta il rischio di falsi
    allarmi e rende più difficile trovare proprio le differenze cercate. Molto meglio i confronti
    pianificati in anticipo, detti contrasti. Questo tutorial ne spiega la logica con chiarezza, dai
    contrasti più comuni a quelli costruiti su misura, e mostra come tradurre un’ipotesi in un
    modello statistico. Soprattutto, presenta appRiori, un’applicazione gratuita in R con menu
    guidati che costruisce i contrasti e genera il codice pronto da usare. Tre esempi accompagnano
    il lettore passo passo. Uno strumento prezioso per analisi più mirate e rigorose.
