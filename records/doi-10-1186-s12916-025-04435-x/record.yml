  public_summary: >-
    Nel 2019 le autorità sanitarie di Stati Uniti ed Europa hanno approvato l’esketamina, uno spray
    nasale per la depressione che non migliora con le cure abituali. Quanto funziona davvero? Per
    scoprirlo, gli autori hanno rianalizzato i dati dei singoli pazienti degli studi usati per
    l’approvazione: sette sperimentazioni con oltre 1.500 persone, in cui né i pazienti né i medici
    sapevano chi riceveva il farmaco e chi un placebo. Aggiunta a un antidepressivo, l’esketamina
    riduceva i sintomi più del placebo, ma di poco: circa 3 punti su una scala da 0 a 60, meno
    della soglia di 6,5 punti considerata rilevante quando gli studi originali furono progettati.
    Aumentavano sonnolenza e sensazioni di distacco dalla realtà, senza un aumento degli effetti
    avversi gravi. Un’analisi trasparente, preziosa per pazienti e medici chiamati a scegliere.
