curation:
  status: curated
  why_open: I dati raccolti
  public_summary: >-
    Quando sbagliamo, c'è chi si tratta con gentilezza e chi invece si rimprovera
    senza pietà. Questo modo di stare dalla propria parte, chiamato autocompassione,
    va di pari passo con una vita più soddisfacente: ma perché? Un gruppo di ricerca
    italiano lo ha chiesto a 517 adulti, dai 18 agli 84 anni, con un questionario
    online su come si trattano nei momenti difficili, su quanto si sentono soddisfatti
    e realizzati, e su tre bisogni di fondo: sentirsi liberi nelle proprie scelte,
    capaci e legati agli altri. Chi era più gentile con sé stesso riferiva anche di
    soddisfare meglio questi bisogni, soprattutto i primi due, che a loro volta si
    accompagnavano a un maggiore benessere. Secondo gli autori, aiutare le persone a
    sentirsi più libere e capaci potrebbe rendere ancora più efficaci gli interventi
    che insegnano a essere gentili con sé stessi.
