  public_summary: >-
    Cucinare ascoltando la radio, camminare chiacchierando: fare due cose insieme è all’ordine del
    giorno. Ma come cambia questa capacità con l’età? Gli autori hanno coinvolto 61 volontari in
    buona salute, tra i 50 e i 77 anni, nella zona di Carpi. Al computer dovevano memorizzare una
    serie di dieci immagini; in una delle prove, nello stesso momento, dovevano anche dire ad alta
    voce più parole possibili che iniziassero con una certa lettera. Come previsto, fare le due
    cose insieme peggiorava sia il ricordo sia la produzione di parole, e le prestazioni calavano
    con l’età. Sorprendentemente, però, il «prezzo» del doppio compito restava simile dai 50 ai 77
    anni. Una prova semplice e sensibile che, secondo gli autori, potrebbe servire da base per
    sviluppare test capaci di cogliere presto i primi segnali di declino.
