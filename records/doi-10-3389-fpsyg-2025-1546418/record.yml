  public_summary: >-
    Un sorriso spontaneo si riconosce da come si muove il viso. Gli autori hanno applicato piccoli
    marcatori agli angoli della bocca e sulle sopracciglia di alcuni volontari, registrandone i
    movimenti in tre dimensioni mentre guardavano scene comiche o volti che ridevano, e poi mentre
    sorridevano su richiesta. I sorrisi «a comando» erano diversi: la bocca si muoveva in modo più
    ampio e veloce e le sopracciglia si allontanavano di più. I sorrisi spontanei, invece, si
    somigliavano qualunque cosa li avesse fatti nascere. E chi si immedesimava di più nei personaggi
    delle scene comiche sorrideva in modo più ampio e rapido. Come nel ritratto di Dorian Gray, il
    volto custodisce una traccia della felicità vera.
