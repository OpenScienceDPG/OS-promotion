  why_open: I dati raccolti; L'articolo, gratuito sul sito della rivista
  public_summary: 'Paura o sorpresa? Sopracciglia alzate, occhi spalancati, bocca
    aperta: le due emozioni si somigliano tanto che, nei test di riconoscimento, la
    paura viene spesso scambiata per sorpresa. I ricercatori hanno prima rianalizzato
    le risposte di 432 persone che avevano guardato brevi video di volti: l''errore
    capitava molto più spesso con le espressioni recitate a comando che con quelle
    spontanee. Poi hanno applicato piccoli marcatori sulle sopracciglia e agli angoli
    della bocca di 21 volontari, mentre telecamere speciali ne ricostruivano i movimenti
    in tre dimensioni: prima guardando filmati che fanno sobbalzare o stupire, poi
    imitando foto di volti spaventati o sorpresi. Recitate, paura e sorpresa si muovevano
    in modo quasi identico; spontanee no, perché la paura vera apriva la bocca di
    più e più in fretta. Secondo gli autori, per capire le emozioni bisogna osservarle
    anche quando nascono spontanee.'
