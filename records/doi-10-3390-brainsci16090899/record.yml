  public_summary: Ricordarsi di togliere la torta dal forno dopo venti minuti, mentre
    si fa altro, chiede al cervello di tenere d'occhio il tempo. Le ricercatrici e
    i ricercatori hanno studiato una zona del cervello ai lati della fronte, in diversi
    compiti legati al tempo. A 33 giovani adulti hanno applicato sulla testa una debolissima
    corrente elettrica che oscilla al ritmo di alcune onde cerebrali, oppure una stimolazione
    finta, in due sedute a una settimana di distanza. Con la stimolazione vera i partecipanti
    sono stati più precisi nel premere un tasto ogni due minuti e nel collocare eventi
    nel tempo immaginandosi nel passato o nel presente, ma non nel futuro. Le scelte
    tra pochi soldi subito o più soldi dopo non sono invece cambiate in modo affidabile.
    Lo studio offre nuovi indizi su come il cervello gestisce il tempo.
