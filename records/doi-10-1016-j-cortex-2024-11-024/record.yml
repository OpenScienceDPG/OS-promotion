  why_open: "Il piano dello studio, reso pubblico prima di raccogliere i dati; Il progetto, approvato dalla rivista prima di conoscere i risultati; I dati raccolti; Il codice usato per le analisi; I materiali dello studio, come questionari e stimoli; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Un disegno simmetrico visto di sbieco non è più simmetrico nell’immagine che arriva all’occhio,
    eppure lo riconosciamo come tale. Il cervello, però, paga un prezzo: quando guardiamo in
    prospettiva e pensiamo ad altro, il suo segnale di simmetria si indebolisce. Si può ridurre
    questo «costo della prospettiva» aiutando il cervello a cogliere la profondità? Centoventi
    persone hanno osservato figure simmetriche e non, di fronte o inclinate, giudicandone solo la
    luminosità. Gli autori hanno provato tre aiuti: guardare con un occhio solo, inserire le figure
    in una cornice che suggerisce una superficie, oppure farla oscillare per dare un effetto
    tridimensionale. Il risultato è netto: il costo restava lo stesso. Quando non ci facciamo caso,
    questi indizi di profondità non bastano perché il cervello tratti la simmetria in prospettiva
    come quella vista di fronte.
