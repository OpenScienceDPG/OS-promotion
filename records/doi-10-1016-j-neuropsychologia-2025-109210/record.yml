curation:
  status: reviewed
  why_open: "I dati raccolti; Il codice usato per le analisi; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Molti ricordi quotidiani seguono un copione: se vediamo qualcuno entrare al ristorante e poi
    uscire, ci sembra di ricordare anche il pasto. Il sonno, che aiuta la memoria, rafforza anche
    questi «riempitivi»? Lo studio ha messo alla prova l’idea con 72 adulti, che guardavano
    fotografie di otto piccole storie e dovevano poi riconoscerle subito e dodici ore dopo: metà
    dopo una notte di sonno, metà dopo una giornata da svegli. Alcune immagini mai viste
    completavano la storia in modo plausibile, altre suggerivano una causa del finale. Con il tempo
    tutti confondevano un po’ di più immagini viste e non viste, ma il sonno non rendeva questi
    falsi ricordi chiaramente più o meno frequenti. Un tassello utile per capire come la memoria
    ricostruisce gli eventi.
  topics:
  - sonno
  - falsi ricordi
  - memoria episodica
