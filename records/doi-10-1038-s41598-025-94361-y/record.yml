  public_summary: >-
    Un oggetto vicino può aiutarci a vedere qualcosa, oppure nasconderlo. Dipende anche da quanto è
    contrastato. In tre esperimenti, 80 persone dovevano scovare una piccola trama a righe, al
    centro o ai margini del campo visivo, affiancata da altre trame allineate più o meno vicine e
    più o meno contrastate. Al centro della vista, i vicini poco contrastati facilitavano il
    compito, quelli molto contrastati lo ostacolavano; a distanze maggiori tornavano ad aiutare. Ai
    margini del campo visivo, invece, i vicini ostacolavano soprattutto. Un risultato utile per chi
    studia gli allenamenti della vista: per interpretarne gli effetti conta anche il contrasto degli
    stimoli.
