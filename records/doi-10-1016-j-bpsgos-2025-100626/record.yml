  public_summary: >-
    Quanto è durata quella pausa? Di solito le emozioni influenzano anche il modo in cui valutiamo
    il tempo. E a chi si sente giù di morale? Gli autori hanno coinvolto 120 studenti
    dell’Università di Padova, metà con sintomi depressivi. Dopo aver guardato un breve spezzone di
    film, triste o neutro, i partecipanti fissavano una croce sullo schermo per quasi due minuti e
    mezzo, senza sapere che poi avrebbero dovuto dire quanto era durata. Intanto, una cuffia con
    128 sensori registrava la loro attività cerebrale. Negli studenti senza sintomi, le emozioni
    più intense e negative andavano di pari passo con stime di durata più brevi; in chi aveva
    sintomi depressivi questo legame non compariva, come se le emozioni avessero meno presa sul
    senso del tempo. Un tassello prezioso per capire come la depressione cambia il nostro vissuto.
