  public_summary: 'Immaginate di lavorare accanto a un braccio robotico che vi passa
    viti e pezzi da montare: come capire se la squadra tra persona e macchina funziona
    bene? Le ricercatrici e i ricercatori hanno costruito un sistema che, con una
    sola telecamera capace di misurare anche la distanza, segue nello stesso momento
    i movimenti della persona e del robot, senza sensori sul corpo. Per riconoscere
    il braccio robotico hanno addestrato un programma su oltre mille immagini, poi
    ne hanno controllato la precisione confrontandolo con le posizioni registrate
    dal robot stesso, sia durante un montaggio insieme a una persona sia in un movimento
    ripetuto da solo. Nel movimento semplice l''errore medio è stato di circa due
    centimetri, nel lavoro condiviso di poco meno di sei. Ne nasce uno strumento accessibile
    per studiare come persone e robot si coordinano, per un lavoro più sicuro.'
