  why_open: "I dati raccolti; I materiali dello studio, come questionari e stimoli; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Ricordarsi di fare qualcosa al momento giusto, come imbucare una lettera passando davanti alla
    posta, richiede di tenere a mente l’intenzione e, insieme, di tenere d’occhio ciò che ci
    circonda. Che cosa fa il cervello in quell’attesa? Gli autori hanno analizzato l’attività
    cerebrale di 21 giovani adulti, registrata con la magnetoencefalografia, nel secondo che precede
    ogni stimolo, in due versioni di un compito di questo tipo: una richiedeva più sorveglianza,
    l’altra più memoria. Quando bisognava sorvegliare di più, si rafforzavano i collegamenti di una
    rete dell’attenzione guidata dagli obiettivi. Quando pesava di più la memoria, a dialogare erano
    invece altre reti, legate al controllo e all’attività a riposo. Il cervello, insomma, si prepara
    in modo diverso a seconda di che cosa ci serve per non dimenticare.
