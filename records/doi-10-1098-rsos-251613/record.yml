  why_open: I dati raccolti; L'articolo, gratuito sul sito della rivista
  public_summary: >-
    Chi suona uno strumento è anche più bravo in altre attività della mente? Spesso si pensa di sì,
    e il merito viene dato agli anni di studio musicale. Se così fosse, i professionisti dovrebbero
    superare anche i dilettanti. Francesca Talamini, Massimo Grassi e colleghi lo hanno verificato
    rianalizzando i dati di un grande progetto internazionale, raccolti da 33 laboratori in 15
    Paesi: quasi 1.250 persone tra non musicisti, musicisti amatoriali e professionisti. Come
    previsto, le abilità musicali crescevano con l'esperienza. Le altre capacità, invece, no:
    entrambi i gruppi di musicisti superavano i non musicisti, per esempio nel vocabolario e nella
    memoria per le immagini, ma i professionisti non superavano mai i dilettanti. Per gli autori,
    queste differenze potrebbero dipendere anche da chi sceglie di dedicarsi alla musica. Un
    risultato che invita a guardare la musica con occhi nuovi.
