  why_open: I dati raccolti; Il codice usato per le analisi; I materiali dello studio, come questionari e stimoli
  public_summary: >-
    Meglio una passeggiata nel bosco o un giro in centro città? Le preferenze per la
    natura o per la città orientano il nostro tempo libero, ma per studiarle serve
    uno strumento affidabile. Un gruppo di ricerca delle Università di Roma Sapienza,
    Padova e Firenze ha tradotto in italiano un breve questionario statunitense di
    dieci affermazioni e lo ha proposto a 582 adulti. Le risposte si raggruppano in
    due dimensioni distinte: il gusto per gli ambienti naturali e quello per gli
    ambienti urbani. Chi preferiva la natura si sentiva anche più legato a essa e più
    attento all'ambiente, e le preferenze aiutavano a prevedere quanto spesso le
    persone frequentavano la natura, per quanto tempo e con quanto piacere. Il
    questionario funziona allo stesso modo per uomini e donne: uno strumento semplice
    e solido, ora anche in italiano.
