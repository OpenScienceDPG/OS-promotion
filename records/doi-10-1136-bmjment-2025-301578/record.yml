      active psychological arms, multipronged retrieval January 2024-February 2025.'
    - 'PDF pp.3-5: 364/422 accessible (86%), 106/422 public (25%), 191/422 commercial-only (45%); resource-intensive
      retrieval, not estimates of clinical efficacy.'
    - 'PDF p.5: focus on severe disorders, no grouping into unique interventions, shared manuals across
      trials; percentages are arm-level, not unique-manual counts.'
    - 'PDF p.6 and downloaded Zenodo workbooks/codebook: survey data and variable dictionary public; no
      assertion that all underlying treatment manuals are open.'
