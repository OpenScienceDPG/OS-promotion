curation:
  status: reviewed
  why_open: "I dati raccolti; I materiali dello studio, come questionari e stimoli; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Sappiamo che molte psicoterapie funzionano. Ma se qualcuno volesse sapere esattamente come si
    svolgono, riuscirebbe a trovarne le istruzioni? Gli autori hanno fatto la prova, cercando i
    manuali e i protocolli di 422 trattamenti psicologici studiati in 260 sperimentazioni sui
    disturbi mentali gravi: hanno setacciato articoli e registri, scritto agli autori, cercato le
    edizioni in commercio. Alla fine, dopo un lavoro lungo e paziente, un manuale saltava fuori per
    l’86% dei trattamenti. Ma solo uno su quattro era liberamente accessibile, e quasi metà era
    disponibile solo a pagamento. Un’indagine che mette in luce un ostacolo concreto: per studiare e
    riprodurre le terapie che funzionano, le loro istruzioni dovrebbero essere a portata di mano.
  topics:
