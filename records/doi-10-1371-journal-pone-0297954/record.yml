  public_summary: >-
    Se il cane del vicino ringhia ogni volta che passiamo, impariamo presto ad aspettarci un
    incontro sgradevole: il passato ci aiuta a prevedere come ci faranno sentire gli eventi futuri.
    Ma che cosa succede quando i segnali diventano ambigui? In due esperimenti, circa 240 persone
    vedevano cerchi colorati seguiti da immagini neutre o spiacevoli: per alcune il colore
    annunciava sempre il tipo di immagine, per altre solo metà delle volte. Poi, con regole nuove,
    dovevano dire che cosa si aspettavano e come si sentivano. Il risultato è sorprendente: quando
    il segnale era ambiguo, le attese erano meno negative e le immagini risultavano meno spiacevoli.
    L’incertezza, insomma, sembra attutire le emozioni negative.
