  public_summary: 'Perché alcune persone sono più esposte di altre alla depressione,
    anche quando oggi stanno bene? Le ricercatrici e i ricercatori hanno coinvolto
    92 giovani adulti, in gran parte studenti universitari: alcuni avevano un genitore,
    un fratello o una sorella che aveva sofferto di depressione, altri avevano lievi
    sintomi depressivi, altri nessuna delle due condizioni. Con sensori appoggiati
    sulla testa hanno registrato l''attività elettrica del cervello mentre un segnale
    annunciava l''arrivo di un''immagine piacevole, neutra o spiacevole. Nei due gruppi
    più vulnerabili, il cervello si preparava meno alle immagini emozionanti in arrivo
    e, nei primissimi istanti, dedicava meno attenzione a quelle piacevoli, anche
    se le persone le giudicavano come tutti gli altri. Secondo il gruppo di ricerca,
    queste tracce sottili potrebbero diventare segnali preziosi per riconoscere presto
    chi è più vulnerabile.'
