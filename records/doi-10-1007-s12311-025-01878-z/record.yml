    fact_sources:
    - 'Abstract: CCAS (Schmahmann syndrome) affects cognitive and emotional functioning yet remains underdiagnosed; study standardizes the CCAS-S in Italy.'
    - 'Methods: scale items include semantic and phonemic fluency, digit span, cube draw and copy, similarities, go/no-go; parallel form B translated.'
    - 'Abstract: 671 healthy Italian volunteers from various geographical, educational and social backgrounds; version B given to 51 people.'
    - 'Abstract: optimal test-retest and inter-rater reliability, minimal practice effects after 1-3 months; first Italian standardization; authors advocate integration into routine assessment.'
