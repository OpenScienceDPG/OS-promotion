  public_summary: >-
    Le immagini dell’International Affective Picture System, una raccolta standardizzata di foto piacevoli,
    neutre e spiacevoli, sono tra gli strumenti più usati per studiare le emozioni nel cervello. Questa
    meta-analisi ha riunito 97 studi di risonanza magnetica funzionale pubblicati tra il 2000 e il 2023,
    per 152 esperimenti: 106 confrontavano immagini spiacevoli e neutre, 46 piacevoli e neutre. Le coordinate
    delle attivazioni riportate dagli studi sono state combinate per individuare le aree che rispondono
    in modo convergente, distinguendo se i partecipanti guardavano soltanto le immagini o svolgevano un
    compito semplice o impegnativo. Le immagini spiacevoli coinvolgono, come già noto, regioni limbiche
    e paralimbiche, ma anche altre aree frontali e parietali. Con la sola visione o con compiti semplici
    emergeva un’asimmetria: più attività frontale destra per le immagini spiacevoli e, nella sola visione,
    frontale sinistra per quelle piacevoli. Con compiti impegnativi rispondevano alle immagini spiacevoli
    diverse aree dell’emisfero destro; per quelle piacevoli gli studi erano troppo pochi. Gli autori dichiarano
    metodo e analisi preregistrati su PROSPERO; le coordinate dei singoli studi sono disponibili solo
    su richiesta.
