  public_summary: >-
    Abbiamo un «orologio interno» che batte con un ritmo tutto nostro? Molte teorie lo immaginano, e
    questo studio è andato a cercarlo in tre ritmi misurati sulle stesse persone: la velocità
    spontanea con cui battiamo un dito, il battito del cuore a riposo e il ritmo naturale delle onde
    elettriche del cervello. Se esistesse un unico metronomo interno, questi ritmi dovrebbero andare
    d’accordo. Analizzando 32 giovani universitari, gli autori non hanno trovato legami
    significativi tra le tre misure, nemmeno tenendo conto di età, orario della prova, abitudini da
    mattinieri o nottambuli ed esperienza musicale. Un risultato prezioso proprio perché «nullo»:
    pubblicarlo aiuta a non costruire teorie su collegamenti che, almeno qui, non si vedono.
