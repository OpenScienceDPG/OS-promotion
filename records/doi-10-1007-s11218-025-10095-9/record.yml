  why_open: "I dati raccolti; Il codice usato per le analisi; I materiali dello studio, come questionari e stimoli"
  public_summary: >-
    Le cosiddette soft skills contano a scuola? Sì, ma il loro legame con i voti sembra passare
    soprattutto dal modo in cui si studia. Lo studio ha coinvolto oltre 5.000 studenti delle
    superiori del Veneto, interrogati su abilità sociali ed emotive, metodo di studio, fiducia in
    sé, voti, soddisfazione per la vita e rapporti con i compagni. Sapersi organizzare e avere idee
    nuove andava di pari passo con un buon metodo di studio, più fiducia in sé e voti migliori. Ma
    il legame più forte con i voti era quello della fiducia nelle proprie capacità di studio. Altre
    abilità brillavano altrove: resilienza emotiva e capacità di relazionarsi si legavano a una vita
    più soddisfacente, cooperazione e relazione a una migliore accettazione da parte dei compagni.
    Un ritratto ricco di ciò che serve per stare bene a scuola, non solo per avere buoni voti.
