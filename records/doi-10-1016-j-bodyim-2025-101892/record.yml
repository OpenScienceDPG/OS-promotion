curation:
  status: curated
  why_open: "I dati raccolti"
  public_summary: >-
    Da dove nasce il disagio per il proprio corpo negli adolescenti? Non tutte le pressioni
    funzionano allo stesso modo. Lo studio ha coinvolto 788 studenti italiani tra i 13 e i 19 anni e
    ha seguito le tracce di tre fonti: famiglia, amici e media. Il dato più sorprendente riguarda la
    famiglia: le pressioni sull’aspetto respirate in casa si legavano direttamente alla vergogna per
    il proprio corpo, e attraverso questa ai sintomi dei disturbi alimentari, senza passare dal
    confronto con gli altri. Le pressioni dei coetanei si collegavano alla vergogna proprio tramite
    i confronti, quelle dei media in entrambi i modi. Un segnale da non sottovalutare: ciò che si
    dice sul corpo in famiglia conta, per le ragazze come per i ragazzi.
