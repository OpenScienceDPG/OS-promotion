  public_summary: >-
    Chi da bambino prova ansia davanti a un esercizio di matematica se la porterà
    dietro anche da grande? E l'ansia peggiora i risultati, o sono i brutti voti a
    farla crescere? Un gruppo di ricerca delle Università di Jaén e di Padova ha
    riunito 62 ricerche che hanno seguito nel tempo quasi 40.000 studenti, misurando
    più volte sia l'ansia per la matematica sia il rendimento. L'ansia si è rivelata
    piuttosto stabile, simile a un tratto del carattere, e sempre più radicata con il
    crescere dell'età. Il legame funziona poi in entrambe le direzioni, con forza
    simile: chi è più in ansia tende in seguito ad andare peggio, e chi va peggio
    tende a diventare più ansioso. Per gli autori, intervenire presto, quando l'ansia
    è meno radicata, può aiutare a spezzare questo circolo, senza dimenticare gli
    studenti più grandi.
