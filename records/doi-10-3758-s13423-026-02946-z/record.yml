  public_summary: >-
    Due gruppi possono avere la stessa media ed essere comunque molto diversi: pensate a due classi
    con lo stesso voto medio, una tutta di sei, l'altra di tre e di nove. Eppure molti studi di
    psicologia confrontano soprattutto le medie. Giulia Calignano, Ambra Perugini e colleghi
    propongono un test che guarda all'intera forma dei dati, misurando quanto i risultati di due
    gruppi si sovrappongono: più si sovrappongono, più i gruppi si somigliano. Con ampie
    simulazioni al computer, gli autori mostrano che il nuovo test non segnala differenze
    inesistenti più spesso del dovuto e coglie bene i casi in cui i gruppi differiscono per più
    aspetti insieme. Un esempio reale, con i tempi di lettura di parole comuni e rare, mostra
    differenze che il solo confronto delle medie non vedeva. Uno strumento semplice per guardare i
    dati con più attenzione.
