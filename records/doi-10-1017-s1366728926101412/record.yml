  public_summary: 'Pensare in una lingua straniera ci rende più razionali? Uno studio
    aveva trovato che un''altra lingua riduce l''illusione di causalità, cioè la tendenza
    a vedere un legame di causa ed effetto dove non c''è, come credere che un rimedio
    funzioni solo perché dopo averlo preso si guarisce. Le ricercatrici e i ricercatori
    lo hanno ripetuto con 220 adulti di madrelingua italiana, metà in italiano e metà
    in inglese. Tutti vedevano casi di pazienti immaginari che prendevano o no una
    medicina e poi guarivano o no; alla fine dovevano giudicare quanto la medicina
    funzionasse. L''illusione è comparsa in entrambe le lingue con forza simile: l''inglese
    non l''ha ridotta. È risultata invece più debole nelle persone con più anni di
    studio. Un risultato solido, che chiarisce i limiti dell''effetto della lingua
    sul ragionamento.'
