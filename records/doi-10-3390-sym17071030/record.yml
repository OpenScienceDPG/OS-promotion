  public_summary: >-
    Messi in un ambiente mai visto, alcuni pesci partono subito a esplorare, altri
    restano immobili: è solo una questione di specie? Un gruppo di ricerca
    dell'Università di Padova ha messo alla prova otto specie di piccoli pesci
    d'acqua dolce, tra cui pesci zebra, guppy e pesci gatto trasparenti, sempre con
    la stessa procedura per rendere i confronti affidabili. Ognuno dei 165 pesci
    veniva lasciato da solo in una vasca circolare nuova, osservando quanto tempo
    impiegava a muoversi, quanto restava fermo e come nuotava. Il coraggio
    nell'esplorare cambiava molto da specie a specie, e in generale i pesci
    preferivano nuotare in cerchio piuttosto che in linea retta. Nessuna specie, però,
    mostrava di girare più spesso in un verso che nell'altro. Una base di partenza
    preziosa per chi studia il comportamento spontaneo di questi animali.
