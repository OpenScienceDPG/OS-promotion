    sul sito della rivista
  public_summary: >-
    Mezz'ora di gioco può cambiare il modo in cui un bambino presta attenzione? I ricercatori
    hanno incontrato 48 bambini dell'ultimo anno della scuola dell'infanzia tre volte, a una
    settimana di distanza: senza giocare, dopo mezz'ora di Mario Kart, il videogioco di corse, e
    dopo mezz'ora di Tangram, il rompicapo di forme colorate. Ogni volta ascoltavano parole
    inventate, cercavano animali disegnati su un foglio e lanciavano un sacchetto su un tappeto.
    Dopo entrambi i giochi distinguevano meglio i suoni e trovavano più in fretta gli animali
    isolati, ma faticavano di più quando erano nascosti tra molti altri e facevano meno centri.
    Videogioco e rompicapo hanno avuto effetti simili. Secondo gli autori, il gioco coinvolgente
    orienta per un po' l'attenzione verso ciò che colpisce subito: un tassello utile per inserire
    il gioco, digitale e non, nella giornata dei più piccoli.
