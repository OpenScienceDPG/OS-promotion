  public_summary: >-
    Chi legge da sinistra a destra tende a immaginare le quantità piccole a sinistra e quelle
    grandi a destra. Vale anche per la velocità? Uno studio precedente aveva mostrato che gli
    italiani collocano i movimenti lenti a sinistra e quelli veloci a destra. Mario Dalmaso,
    Michele Vicovaro e colleghi hanno ripetuto l'esperimento con 30 studenti iraniani, abituati a
    leggere il persiano da destra a sinistra. Sullo schermo comparivano puntini in
    movimento: bisognava dire, premendo un tasto a sinistra o a destra, se erano più lenti o più
    veloci di un riferimento. Il risultato si è capovolto: per i partecipanti iraniani la velocità
    sembrava disporsi da destra a sinistra. Per gli autori, la direzione della scrittura plasma il
    modo in cui collochiamo nello spazio grandezze legate alla lettura, come la velocità. Un
    bell'esempio di come la cultura modelli la mente.
