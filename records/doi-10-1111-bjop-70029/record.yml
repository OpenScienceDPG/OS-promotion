  public_summary: 'Quando guardiamo qualcuno parlare, il cervello unisce senza fatica
    voce e movimento delle labbra, anche se i due segnali non arrivano esattamente
    insieme. Ma quanto ritardo siamo disposti a tollerare? In tre esperimenti, i ricercatori
    hanno mostrato a quasi 190 volontari una macchia luminosa che si allargava e si
    restringeva insieme a un suono che saliva e scendeva di volume, sfasandoli di
    qualche frazione di secondo, e hanno chiesto se sembrassero sincronizzati. Con
    un ritmo più veloce le persone notavano prima lo sfasamento. Quando invece il
    ritmo imitava l''andamento irregolare di frasi parlate, la tolleranza cresceva:
    la finestra entro cui suono e immagine sembravano contemporanei passava da circa
    320 a 370 millesimi di secondo. Lo studio aiuta a capire come il cervello unisce
    vista e udito e, secondo gli autori, apre nuove strade per studiare chi fatica
    a farlo.'
