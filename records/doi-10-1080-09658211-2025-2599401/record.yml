curation:
  status: curated
  why_open: I dati raccolti
  public_summary: >-
    Si può capire se qualcuno mente su una vacanza osservando come muove il mouse?
    Un gruppo di ricerca dell'Università di Padova ha chiesto a 90 volontari di
    rispondere sì o no, con un clic, a frasi su una loro vacanza recente. Un terzo
    raccontava la vacanza vera, un terzo una vacanza del tutto inventata, imparata
    il giorno prima, e un terzo una vacanza vera con alcuni dettagli cambiati. Il
    computer registrava ogni percorso del cursore sullo schermo. Chi mentiva muoveva
    il mouse più lentamente, e chi aveva ritoccato solo alcuni dettagli cambiava
    direzione più spesso. Programmi che imparano dagli esempi hanno riconosciuto chi
    mentiva in tre o quattro casi su cinque. Secondo gli autori, inventare tutto
    potrebbe richiedere meno sforzo che alterare un ricordo vero: un passo verso
    strumenti semplici ed economici per valutare i racconti.
