    fact_sources:
    - 'Abstract and Method: 90 participants answered binary questions about an autobiographical event (recent holiday) with a computer mouse; three groups of 30 (truthful, completely faked holiday learned the day before, real holiday with falsified details).'
    - 'Abstract and Results: deceptive responses slower; details-faked group made more direction changes (x-flips and y-flips).'
    - 'Abstract: machine learning classified deceptive vs truthful responses with average accuracy of 75% (completely faked) and 80% (details faked).'
    - 'Abstract and Discussion: authors suggest fabricating an entire event may be less demanding than modifying real details; mouse tracking is cheap and needs only a standard computer.'
