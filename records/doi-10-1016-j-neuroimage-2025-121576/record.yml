  public_summary: >-
    Contare e afferrare un oggetto: che cosa hanno in comune? Più di quanto sembri. Trenta adulti
    hanno svolto quattro compiti, tra cui confrontare quantità numeriche e afferrare un oggetto,
    mentre una luce nel vicino infrarosso, una tecnica non invasiva, misurava l’ossigenazione della
    superficie del loro cervello. Il risultato: numeri e presa fanno lavorare in parte le stesse
    aree, soprattutto una regione parietale posteriore a sinistra e, in misura minore, zone vicine
    alle aree motorie e sensoriali a destra. E in una porzione di quella regione sinistra, una
    maggiore differenza tra le risposte ai due compiti si associava a calcoli più accurati. Un
    indizio affascinante che il nostro senso dei numeri abbia radici nel corpo e nei movimenti delle
    mani.
