  public_summary: >-
    Una debole corrente elettrica che oscilla a un ritmo preciso, applicata sulla
    testa con alcuni elettrodi, può cambiare il modo in cui lavora il cervello? Su
    questa idea si basa una tecnica di stimolazione molto studiata, il cui
    funzionamento però resta poco chiaro. Un gruppo di ricerca di Padova e Venezia ha
    coinvolto 34 adulti in due sedute: una con 20 minuti di vera stimolazione, a 40
    oscillazioni al secondo, sulle aree che controllano il movimento, e una finta.
    Prima e dopo ha registrato l'attività elettrica del cervello a riposo e durante
    due compiti. La stimolazione non modificava i ritmi cerebrali, come ci si sarebbe
    potuti aspettare, ma abbassava in modo uniforme l'attività di fondo. Per gli
    autori, questo indica un meccanismo d'azione diverso e aiuta a capire meglio
    come funzionano queste tecniche.
