  public_summary: >-
    I musicisti ricordano meglio perché fanno musica, o perché in generale se la cavano un po’
    meglio in molte prove? Questo commento rianalizza i dati di un grande studio internazionale sui
    musicisti, partendo da un principio classico della ricerca sull’intelligenza: quando i punteggi
    di prove diverse vanno di pari passo, prima di interpretare le singole differenze bisogna
    considerare ciò che hanno in comune. Il risultato cambia la prospettiva: il vantaggio dei
    musicisti sta soprattutto in questa abilità comune, dove è moderato. Resta un vantaggio
    specifico chiaro solo nella memoria per le melodie e, al più, uno piccolo nel vocabolario. Un
    esempio di come rileggere gli stessi dati con occhi nuovi possa arricchire una scoperta.
