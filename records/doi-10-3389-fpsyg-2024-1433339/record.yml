  why_open: "I dati raccolti; Il codice usato per le analisi; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Mettere a punto un questionario psicologico richiede di raccogliere le risposte di centinaia o
    migliaia di persone; e se il questionario non funziona, si ricomincia da capo. Gli autori
    propongono SEMbeddings, un modo per anticipare parte di questo controllo prima ancora di
    raccogliere i dati: un modello linguistico, simile a quelli che fanno funzionare i chatbot,
    legge il testo delle domande e misura quanto si somigliano. L’idea è stata messa alla prova su
    96 domande di un questionario sui punti di forza del carattere, confrontando le previsioni con
    le risposte reali di oltre 31.000 persone. I modelli chiaramente sbagliati venivano riconosciuti
    quasi sempre, e le scale promosse dalla procedura funzionavano anche con i dati veri. Un aiuto
    prezioso per costruire questionari migliori.
