  why_open: Il piano dello studio, reso pubblico prima di raccogliere i dati; I dati raccolti; Il codice usato per le analisi
  public_summary: >-
    La psicoterapia funziona davvero, e funziona allo stesso modo in ogni parte del
    mondo? Per rispondere, un grande gruppo internazionale, con ricercatrici
    dell'Università di Padova, ha costruito Metapsy: un sistema di banche dati
    aperte e di programmi che raccoglie e tiene aggiornati i risultati degli studi
    sulle cure psicologiche. Grazie a questo sistema, gli autori hanno riunito più
    di mille studi, con quasi 86 mila pazienti e dodici problemi di salute mentale,
    dalla depressione alle fobie. I benefici risultano da modesti a moderati per
    problemi come le psicosi o i pensieri suicidi, e ampi per depressione, attacchi
    di panico, ansia e fobie. Gran parte delle ricerche viene da paesi ricchi e
    occidentali, ma non è emerso alcun segno che la psicoterapia funzioni meno
    altrove. Un'infrastruttura che permette di ottenere rapidamente prove
    aggiornate per curare meglio.
