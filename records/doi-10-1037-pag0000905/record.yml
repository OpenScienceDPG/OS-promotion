  why_open: "I dati raccolti; Il codice usato per le analisi"
  public_summary: >-
    Quando sappiamo per esperienza quanto dura un semaforo rosso, ci prepariamo a ripartire senza
    pensarci. Come cambia nel corso della vita questa capacità di anticipare i tempi degli eventi
    senza rendercene conto? Lo studio ha coinvolto 608 persone dai 5 agli 88 anni, che dovevano
    rispondere il più in fretta possibile a un bersaglio comparso dopo un’attesa breve, media o
    lunga; senza preavviso, in alcuni momenti prevalevano le attese brevi, in altri quelle lunghe.
    Ci si può regolare su due indizi: il tempo già trascorso in quella prova e la tendenza generale
    del momento. Entrambe le capacità ci sono già a 5-6 anni, migliorano fino ai 30-39 anni e poi
    calano, la prima da circa 40 anni, la seconda da circa 60. Un ritratto completo, dall’infanzia
    alla vecchiaia, di come la mente impara a giocare d’anticipo.
