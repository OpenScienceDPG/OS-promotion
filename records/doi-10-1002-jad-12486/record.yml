  public_summary: >-
    Finita la scuola, che cosa farò? Davanti a questa domanda alcuni ragazzi si sentono più pronti
    di altri. Lo studio, con 350 studenti di quarta e quinta superiore di due scuole italiane,
    mostra che contano anche abilità che non compaiono in pagella: sapersi organizzare, avere idee
    nuove, buttarsi nelle situazioni sociali. Chi si descriveva più forte su questi fronti guardava
    al futuro con più curiosità e fiducia e si sentiva più padrone delle proprie scelte, e questo al
    di là dei voti e della fiducia nelle proprie capacità scolastiche. Un’indicazione preziosa per
    chi si occupa di orientamento: per preparare i ragazzi al dopo-scuola vale la pena guardare
    anche a queste competenze, non solo alla media dei voti.
