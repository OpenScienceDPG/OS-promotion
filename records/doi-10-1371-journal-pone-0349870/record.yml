  public_summary: >-
    Un pulcino appena nato sa già distinguere tra «tanti» e «pochi»? Maria Loconsole, Elisa Tedaldi
    e Lucia Regolin lo hanno verificato con pulcini di un solo giorno di vita. Un primo gruppo ha
    trascorso le prime ventiquattro ore accanto a sette palline rosse, a cui si affezionano come a
    compagni. Un secondo gruppo ha osservato per un'ora, su uno schermo, insiemi sempre diversi di
    forme colorate, ma sempre in numero pari. Poi tutti potevano avvicinarsi a un gruppo di 5
    oppure di 9 elementi. I primi hanno passato più tempo vicino al gruppo più numeroso; i secondi,
    invece, vicino a quello da 5, un numero che non si divide in due metà uguali. Per le autrici,
    già dal primo giorno di vita convivono modi diversi di valutare le quantità. Un pulcino che
    racconta molto sulle radici del senso del numero.
