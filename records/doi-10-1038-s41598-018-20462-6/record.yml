  public_summary: >-
    Come si smaschera chi mente sulla propria identità, quando non ci sono documenti o impronte
    digitali da controllare? Guardando come scrive sulla tastiera. Quaranta persone hanno risposto
    per iscritto a domande sui propri dati personali: metà dicendo la verità, metà fingendo di
    essere qualcun altro. Tra le domande c’erano alcune trappole, come l’età da ricavare dalla data
    di nascita: chi dice la verità la conosce già, chi mente deve calcolarla, e quello sforzo lascia
    tracce nel modo di battere i tasti. Analizzando tempi, pause ed errori con algoritmi di
    apprendimento automatico, il sistema ha riconosciuto chi mentiva in circa il 95% dei casi, e ha
    funzionato bene anche con nuovi partecipanti e con 151 persone reclutate online. Un primo passo
    verso controlli di identità a distanza.
