  why_open: I dati raccolti; L'articolo, gratuito sul sito della rivista
  public_summary: 'Come si impara a reagire a un incendio sul lavoro senza correre
    rischi? Le ricercatrici e i ricercatori hanno confrontato tre modi di insegnare
    le procedure antincendio a 111 giovani adulti: un video con diapositive e spiegazioni,
    una realtà virtuale in cui un personaggio digitale dava le istruzioni, e la stessa
    realtà virtuale arricchita da pannelli informativi. Poi tutti hanno affrontato
    un incendio simulato, sempre in realtà virtuale. Chi aveva imparato con la realtà
    virtuale ha completato le procedure più in fretta e con punteggi migliori di chi
    aveva visto il video. L''esperienza è risultata coinvolgente e poco faticosa,
    ma chi si sentiva più stressato durante la simulazione otteneva risultati peggiori.
    Un piccolo gruppo di 16 lavoratori ha ottenuto risultati simili agli studenti.
    Secondo gli autori, una formazione virtuale ben progettata può rendere la sicurezza
    più facile da imparare.'
