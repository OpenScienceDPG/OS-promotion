  why_open: I materiali dello studio, come questionari e stimoli
  public_summary: 'Come si fa a far scoprire le stelle a chi non può vederle? Questo
    progetto trasforma l''astronomia in un''esperienza da toccare e ascoltare, oltre
    che da guardare. Le ricercatrici e i ricercatori hanno creato una vera catena
    di insegnamento: dottorandi in astrofisica progettano laboratori pratici insieme
    a psicologi e ad associazioni di persone cieche e sorde, poi li insegnano a studenti
    delle superiori, che li presentano al pubblico di un festival e infine li trasmettono
    agli insegnanti delle scuole. In quattro edizioni il festival ha accolto oltre
    diecimila visitatori. Tra quelli che hanno risposto ai questionari, più di tre
    su quattro si sono detti più fiduciosi che l''astronomia sia accessibile anche
    alle persone cieche o ipovedenti. Le attività, costruite con materiali economici,
    sono pensate per essere riproposte da insegnanti e divulgatori, anche senza un
    astronomo presente.'
