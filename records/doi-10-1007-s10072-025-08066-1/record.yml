  why_open: "L'articolo, gratuito sul sito della rivista; Uno strumento che altri possono riutilizzare, come un programma o un test"
  public_summary: >-
    Lo stesso punteggio a un test di memoria non significa la stessa cosa per un trentenne laureato
    e per un novantenne che ha fatto le elementari. Per interpretarlo servono valori di riferimento,
    e questo studio li fornisce per la versione 8.1 del Montreal Cognitive Assessment, un test breve
    per valutare le funzioni cognitive, compreso un indice che misura anche quanto un suggerimento
    aiuta a ricordare. Gli autori hanno esaminato 668 adulti italiani senza problemi cognitivi, dai
    18 ai 99 anni, in diverse regioni. Come atteso, età e istruzione pesano sulla maggior parte dei
    punteggi. Il risultato è uno strumento concreto: equazioni che permettono a medici e psicologi
    di correggere i punteggi e capire se una persona è nella norma per la sua età e la sua storia.
  topics:
