    come questionari e stimoli; L'articolo, gratuito sul sito della rivista
  public_summary: >-
    Al semaforo rosso ci prepariamo a ripartire senza pensare al tempo che passa. Ma misurare il
    tempo di proposito e sfruttarlo senza accorgercene impegnano il cervello allo stesso modo?
    Ricercatori di Padova e Granada hanno registrato l'attività cerebrale di 28 giovani adulti.
    Sullo schermo compariva un cerchio e, dopo un'attesa variabile fino a quasi due secondi, un
    simbolo al centro. In un compito bisognava giudicare se l'attesa fosse breve o lunga;
    nell'altro bastava rispondere al simbolo più velocemente possibile. I segnali cerebrali di
    attesa e preparazione al movimento comparivano in entrambi i compiti, ma erano più intensi
    quando il tempo veniva usato senza pensarci, soprattutto nelle attese lunghe. Secondo gli
    autori, i due modi di gestire il tempo condividono in gran parte gli stessi meccanismi: un
    tassello prezioso per capire come il cervello anticipa il futuro.
