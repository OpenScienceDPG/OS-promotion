curation:
  status: curated
  why_open: "I dati raccolti; Il codice usato per le analisi; I materiali dello studio, come questionari e stimoli; L'articolo, gratuito sul sito della rivista; Uno strumento che altri possono riutilizzare, come un programma o un test"
  public_summary: >-
    Quando sbagliamo possiamo trattarci come tratteremmo un amico in difficoltà, oppure diventare i
    nostri giudici più severi. Sono due atteggiamenti diversi, non due facce della stessa medaglia.
    Lo mostra questo studio, che ha messo alla prova la versione italiana breve di un questionario
    sull’autocompassione: appena 12 domande, compilate da oltre 2.000 adulti in sei gruppi diversi.
    Le risposte disegnano chiaramente due dimensioni: da un lato la gentilezza verso sé stessi,
    dall’altro la durezza e il senso di isolamento. Il questionario funziona bene, allo stesso modo
    per uomini e donne, e le due dimensioni si legano in modo diverso al benessere e al modo di
    gestire le emozioni. Ora anche in italiano c’è uno strumento rapido e solido per misurarle.
