curation:
  status: curated
  why_open: "Il codice usato per le analisi; I materiali dello studio, come questionari e stimoli; L'articolo, gratuito sul sito della rivista; Uno strumento che altri possono riutilizzare, come un programma o un test"
  public_summary: >-
    Quanto deve essere grande un effetto perché uno studio riesca a vederlo? Questo articolo propone
    di dirlo apertamente, riportando la «dimensione critica dell’effetto»: il valore minimo che, con
    quel campione e quel test, avrebbe raggiunto la significatività statistica. Un esempio: con 20
    partecipanti, una correlazione deve superare circa 0,44 per risultare significativa. Questo
    numero rende subito visibile quanto sia difficile ottenere risultati con campioni piccoli, e
    quanto possano bastare effetti minuscoli con campioni enormi. Gli autori forniscono formule ed
    esempi per le analisi più comuni e un pacchetto R gratuito, criticalESvalue, che fa i calcoli.
    Un piccolo numero che aiuta a leggere la ricerca con più consapevolezza.
