curation:
  status: reviewed
  why_open: "I dati raccolti"
  public_summary: >-
    Più opzioni di risposta significano una misura più precisa? Non necessariamente. Chi compila un
    questionario si trova spesso a scegliere tra «mai», «a volte», «spesso» e così via: ma le
    persone usano davvero tutte quelle sfumature nell’ordine previsto? Due studi lo hanno
    verificato, uno con 874 adulti su un questionario per i sintomi depressivi, con quattro o otto
    opzioni di risposta, l’altro con 412 adulti su una scala di comportamenti religiosi a dieci
    opzioni. Con modelli statistici capaci di vedere dove passa il confine tra una risposta e la
    successiva, gli autori mostrano che con otto o dieci opzioni quei confini risultavano spesso
    fuori ordine. Più scelte, insomma, non vogliono sempre dire più informazione: conviene
    verificarlo caso per caso.
  topics:
  - psicometria
  - scale di risposta
  - modelli di Rasch
