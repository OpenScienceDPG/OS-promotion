  public_summary: >-
    Settembre, primo giorno di scuola: zaino nuovo e buoni propositi. Ma quella voglia di
    impegnarsi arriva fino a giugno? Un gruppo di ricercatori padovani ha seguito per un intero
    anno scolastico 1.555 studenti delle superiori, chiedendo loro all'inizio, a metà e alla
    fine dell'anno quanto si sentissero coinvolti nello studio e come se la cavassero in alcune
    abilità personali: organizzarsi e portare a termine gli impegni, stare con gli altri,
    collaborare, avere idee nuove, gestire le emozioni. In media il coinvolgimento calava con il
    passare dei mesi, soprattutto nella prima parte dell'anno. Chi a settembre si descriveva più
    organizzato, più creativo e più socievole mostrava però un calo più contenuto. Per gli
    autori queste abilità sono una risorsa che aiuta i ragazzi a restare motivati, e insegnarle
    a scuola potrebbe sostenerli lungo tutto l'anno.
