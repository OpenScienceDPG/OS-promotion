  public_summary: >-
    Quando inspiriamo, i numeri che ci vengono in mente diventano più grandi? L'idea è meno strana di
    quanto sembri: secondo la teoria della «cognizione incarnata», il corpo contribuisce a dare forma
    anche ai pensieri più astratti, come quelli sui numeri. Sebastiano Cinetto e colleghi presentano qui
    il piano dettagliato di un nuovo esperimento. Trenta adulti scriveranno su un tablet cifre da 1 a
    9, cercando di metterle in fila il più possibile a caso, mentre una fascia sull'addome registrerà
    il respiro. I ricercatori verificheranno se durante l'inspirazione si scelgono numeri più grandi,
    se conta anche quanto si espande l'addome e se le cifre vengono addirittura scritte più grandi. Ricerche
    precedenti avevano già suggerito un legame simile: questo studio lo metterà alla prova con misure
    del respiro molto più fini. Un modo elegante per scoprire quanto mente e corpo lavorino insieme.
