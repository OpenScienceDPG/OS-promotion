  public_summary: >-
    Saper fare una cosa non significa farla sempre: si può essere capaci di organizzarsi o di
    calmarsi in un momento difficile, anche se di solito non lo si fa. Nei questionari, però, le
    abilità sociali ed emotive e i tratti di personalità, cioè il modo in cui tendiamo a
    comportarci, finiscono spesso per confondersi. Gli autori hanno proposto una versione rinnovata
    di un noto questionario sulle abilità, con domande pensate per separare ciò che si sa fare da
    ciò che si tende a fare. L’hanno sottoposta a 598 studenti delle superiori italiani, insieme a
    un questionario sulla personalità e a domande su scuola e benessere. Con la nuova versione
    abilità e personalità risultavano più distinte e gli studenti stessi percepivano la differenza;
    le valutazioni dei genitori confermavano la bontà della misura. Piccoli ritocchi, dunque, per
    misurare meglio ciò che conta.
