  why_open: Il piano dello studio, reso pubblico prima di raccogliere i dati; I dati
    raccolti; Il codice usato per le analisi; I materiali dello studio, come questionari
    e stimoli; Uno strumento che altri possono riutilizzare, come un programma o un
    test
  public_summary: >-
    C'è chi sa organizzarsi alla perfezione, chi fa subito amicizia, chi resta calmo sotto
    pressione: sono abilità sociali, emotive e di comportamento, e gli studi che le misurano
    crescono così in fretta che è difficile tenerne il conto. Gli autori hanno creato una
    raccolta «vivente»: ogni mese cercano le nuove ricerche, ne inseriscono i risultati in un
    archivio consultabile da tutti e li rendono esplorabili con un'applicazione web gratuita, che
    permette di filtrare gli studi e fare analisi su misura. Per mostrarne l'utilità hanno usato
    i dati raccolti finora per studiare il legame tra queste abilità e il rendimento scolastico.
    La capacità di gestire sé stessi, cioè organizzarsi e portare a termine gli impegni, è
    risultata la più associata a buoni risultati, anche tenendo conto della personalità. Uno
    strumento che aiuta la ricerca a restare aggiornata.
