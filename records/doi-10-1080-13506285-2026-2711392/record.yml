  public_summary: >-
    Quando una palla da biliardo ne colpisce un’altra, capiamo al volo se il rimbalzo «torna»
    oppure no. Ma da dove viene questa sensazione: da ciò che vediamo, da una fisica intuitiva
    approssimativa o da una conoscenza precisa delle leggi del moto? Gli autori hanno mostrato a 94
    persone brevi animazioni di due quadratini che si scontrano, variando velocità, peso simulato e
    forza del rimbalzo. Un gruppo doveva dire se l’urto sembrava naturale, gli altri se il
    movimento di ciascun oggetto era causato dallo scontro. Hanno poi confrontato le risposte con
    tre modelli matematici, tenendo conto che ognuno ha una propria soglia per decidere. I modelli
    basati sulla conoscenza della fisica, precisa o approssimativa, spiegavano le risposte molto
    meglio di quello fondato sulle sole impressioni visive. Uno sguardo affascinante su come la
    nostra mente ragiona sul mondo fisico.
