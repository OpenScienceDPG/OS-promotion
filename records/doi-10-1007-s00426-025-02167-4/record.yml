  why_open: "Il piano dello studio, reso pubblico prima di raccogliere i dati; I dati raccolti; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Se sommi la durata di due suoni e poi provi a riprodurre il risultato, tenderai ad allungarlo;
    se le sottrai, ad accorciarlo. Anche quando la risposta giusta è identica. È lo «slancio
    temporale»: come se la mente, facendo i conti con il tempo, prendesse la rincorsa nella
    direzione dell’operazione. Finora era stato osservato solo in laboratorio. Questo studio lo
    replica per la prima volta in modo diretto, online, con due esperimenti, e trova un effetto
    praticamente identico all’originale. Il secondo esperimento chiarisce anche che la tendenza ad
    accorciare dopo una sottrazione non dipendeva dall’ordine in cui comparivano i suoni. Un
    fenomeno solido, che ricorda il modo in cui la mente tratta spazio e numeri.
