curation:
  status: reviewed
  why_open: "Il piano dello studio, reso pubblico prima di raccogliere i dati; I dati raccolti; Il codice usato per le analisi; I materiali dello studio, come questionari e stimoli; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Se potessi cambiare qualcosa di te, preferiresti diventare una persona più estroversa o imparare
    a fare amicizia più facilmente? La distinzione è sottile: il carattere descrive come tendiamo a
    comportarci, le abilità ciò che sappiamo fare quando serve. Lo studio ha chiesto a 264
    universitari statunitensi e italiani quanto desiderassero cambiare cinque grandi tratti di
    personalità e le abilità corrispondenti, quanto lo ritenessero possibile, quanto si sentissero
    motivati e che effetti si aspettassero sulla propria vita. Le abilità hanno sempre ottenuto
    punteggi pari o superiori ai tratti, soprattutto la capacità di entrare in relazione con gli
    altri e quella di gestire impegni e obiettivi. Un messaggio incoraggiante: agli occhi dei
    giovani, puntare su ciò che si può imparare sembra più fattibile e motivante che voler cambiare
    chi si è.
