  why_open: "I dati raccolti; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Le piante di pisello «sentono» la concorrenza? Questo studio indaga il ruolo degli
    strigolattoni, ormoni vegetali coinvolti anche nei rapporti tra piante vicine. Gli autori hanno
    seguito in tre dimensioni i movimenti dei viticci di 32 piante, da sole o in coppia,
    confrontando piante comuni con piante mutanti che non producono questi ormoni o non riescono a
    percepirli. In coppia, le piante che non producevano gli ormoni acceleravano i movimenti, quelle
    che non li percepivano rallentavano. E una varietà comune, capace di afferrare il sostegno da
    sola, non ci riusciva più accanto alla pianta «sorda» agli ormoni, e sviluppava più radici. Un
    indizio che questi ormoni entrino in gioco quando una pianta si misura con una vicina.
