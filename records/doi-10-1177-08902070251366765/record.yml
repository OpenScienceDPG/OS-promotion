curation:
  status: reviewed
  why_open: "I dati raccolti; Il codice usato per le analisi; Il protocollo dettagliato dello studio; L'articolo, gratuito sul sito della rivista; Uno strumento che altri possono riutilizzare, come un programma o un test"
  public_summary: >-
    Speranza e vitalità sono le qualità del carattere che vanno più a braccetto con il benessere. Lo
    mostra questa meta-analisi, che ha riunito 130 studi su 24 punti di forza, come curiosità,
    gratitudine e autocontrollo, sintetizzando quasi cinquemila correlazioni. La maggior parte delle
    qualità si lega, in misura piccola o moderata, a più benessere e meno disagio psicologico;
    speranza e vitalità spiccano su tutte, con legami particolarmente forti. In generale, i punti di
    forza si legano più al sentirsi bene che all’assenza di sintomi, mentre l’umiltà mostra legami
    deboli. Una mappa preziosa delle qualità che accompagnano una buona salute mentale.
