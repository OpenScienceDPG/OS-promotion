  public_summary: 'Battiamo le palpebre migliaia di volte al giorno senza accorgercene.
    E se quel gesto automatico rivelasse qualcosa del nostro stato d''animo? Alon
    Tomashin, Alessandro Angrilli e colleghi hanno rianalizzato le registrazioni dell''attività
    cerebrale di 50 studentesse, in cui i movimenti degli occhi vengono di solito
    scartati come un disturbo. Ne hanno ricavato quattro misure dell''ammiccamento:
    quante volte si chiudono le palpebre, con quale ampiezza e quanto questi valori
    variano nel tempo. Le hanno poi confrontate con questionari sull''ansia, sia a
    riposo sia durante la visione di brevi spezzoni di film emozionanti. È emerso
    che un ammiccamento più ampio si accompagna a più ansia nel momento presente;
    durante i film il legame era più forte e coinvolgeva anche la frequenza. Un modo
    semplice e poco invasivo per studiare l''ansia attraverso gli occhi.'
