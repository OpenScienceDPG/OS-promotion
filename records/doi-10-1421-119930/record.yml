curation:
  status: curated
  why_open: I materiali dello studio, come questionari e stimoli
  public_summary: >-
    Come si resiste, psicologicamente, alla vita in carcere? Questa ricerca mette al centro
    la resilienza, cioè la capacità di affrontare le difficoltà senza farsi travolgere. Gli
    autori hanno tradotto in italiano un questionario di 25 frasi che la misura e lo hanno
    proposto a 48 uomini: 24 detenuti della casa di reclusione Due Palazzi di Padova e 24
    persone che frequentano lo stesso carcere per lavoro o volontariato, come agenti ed
    educatori. La versione italiana si è dimostrata affidabile. I detenuti riferivano più
    malessere psicologico, e tra loro chi si sentiva più resiliente mostrava meno segni di
    depressione. Secondo gli autori la resilienza è una risorsa preziosa per la salute
    mentale in carcere, e misurarla può aiutare a riconoscere per tempo chi ha più bisogno
    di sostegno.
