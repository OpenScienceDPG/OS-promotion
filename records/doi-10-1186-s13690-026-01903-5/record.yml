    dettagliato dello studio; L'articolo, gratuito sul sito della rivista
  public_summary: Una passeggiata nel parco o qualche ora tra gli alberi possono aiutarci
    ad affrontare meglio le difficoltà della vita? Questo articolo presenta un grande
    programma di ricerca europeo, della durata di quattro anni, che mette alla prova
    una teoria su come il contatto con la natura aiuti a costruire e mantenere la
    resilienza, cioè la capacità di reagire allo stress. In nove Paesi, nove studi
    coinvolgono l'intera popolazione, persone a rischio di problemi metabolici e persone
    con stress cronico o difficoltà di movimento o di memoria. A Padova, per esempio,
    un percorso di cinque settimane di attenzione consapevole nella natura viene confrontato
    con un gruppo in lista d'attesa. Il programma valuterà anche costi, equità, impatto
    sull'ambiente e ostacoli pratici, con guide finali per operatori, decisori e cittadini.
    Un progetto ambizioso per portare la natura nella cura delle persone.
