  public_summary: 'Ciò che vediamo adesso è sempre un po'' influenzato da ciò che
    abbiamo appena visto: la percezione di un oggetto tende ad avvicinarsi a quella
    del precedente, un effetto chiamato «dipendenza seriale». Ekaterina Andriushchenko,
    Andrey Chetverikov e Gianluca Campana si sono chiesti quale ruolo abbia la memoria.
    In tre esperimenti, con 90 partecipanti in tutto, le persone osservavano piccole
    immagini a strisce inclinate e dovevano riprodurne l''inclinazione. Quando dovevano
    tenere a mente un''immagine per riportarla di nuovo più tardi, la sua influenza
    sulla risposta successiva cresceva. Invece, indicare semplicemente quale immagine
    guardare non cambiava l''effetto. Secondo gli autori, conta lo sforzo di mantenere
    attiva un''informazione in memoria, non la sola attenzione. Un tassello prezioso
    per capire come passato e presente si intrecciano in ciò che vediamo.'
