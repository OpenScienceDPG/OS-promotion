  public_summary: >-
    Una passeggiata in montagna o un pomeriggio al mare possono cambiare il modo in
    cui guardiamo il nostro corpo? Per scoprirlo, un gruppo di ricerca ha riunito 19
    giovani donne italiane che amano stare all'aria aperta, in sei piccoli gruppi di
    discussione guidati da una ricercatrice, e ha analizzato con cura i loro racconti.
    Ne sono emersi tre temi. In natura le partecipanti dicevano di ascoltare meglio il
    proprio corpo e di apprezzarlo per ciò che sa fare, come raggiungere una vetta.
    Lontano dagli sguardi e dai confronti con gli altri, l'aspetto fisico perdeva
    importanza. Infine, la natura le aiutava a staccare dallo stress e a ritrovare sé
    stesse. Secondo gli autori, queste esperienze indicano piste preziose per nuovi
    studi e per interventi che aiutino le giovani donne a volersi bene, anche grazie
    al tempo trascorso nella natura.
