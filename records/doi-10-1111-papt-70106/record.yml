    fact_sources:
    - 'Abstract and Methods: six focus groups with 19 young Italian women who expose themselves to nature, moderated by the same researcher (SI); reflexive thematic analysis.'
    - 'Results: three themes - nature strengthens a connection with the body (body signals, appreciating what the body does, e.g. climbing a mountain; unity with nature); nature reduces emphasis on appearance (no judging gaze, fewer comparisons); nature as a catalyst for self-(re)connection (mental release, self-rediscovery).'
    - 'Abstract conclusions: directions for future quantitative studies and for prevention and intervention using nature exposure.'
    review_note: 'Scientific reread: qualitative perceptions reported as what participants said; mountain/sea opening is a rhetorical question, not a study fact; implications attributed to the authors. Age range not stated because abstract (22-35) and Table 1 (20-35) differ. Editorial reread: no jargon.'
