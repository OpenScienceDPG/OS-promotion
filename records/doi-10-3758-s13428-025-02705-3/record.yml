  public_summary: >-
    Per ripetere un esperimento non basta conoscerne il risultato: bisogna sapere esattamente chi vi
    ha partecipato, quali compiti ha svolto, come sono state misurate le risposte e analizzati i
    dati. PECANS mette ordine in tutto questo: è una lista di controllo pensata per la ricerca
    cognitiva e neuropsicologica. Gli autori l’hanno costruita interpellando esperti in due turni di
    consultazione e poi provandola su articoli pubblicati e manoscritti. La versione finale
    comprende 51 voci principali e 42 sottovoci, da scegliere secondo le caratteristiche dello
    studio. La prova sul campo ha mostrato quanto serva: negli articoli già pubblicati, molte
    informazioni essenziali sul metodo mancavano. Uno strumento concreto e liberamente utilizzabile
    per scrivere e valutare studi più completi e ripetibili.
