  public_summary: >-
    Cinquanta euro e il numero 50 sono la stessa cosa? Per la nostra mente, non sempre. In un
    esperimento online, 271 adulti dovevano collocare su una linea numeri oppure banconote da 5 a
    500 euro. Quando gli estremi della linea erano numeri precisi, numeri e soldi venivano sistemati
    in modo regolare. Con estremi vaghi, come «poco» e «tanto», il denaro invece si «comprimeva»: le
    somme grandi finivano più vicine tra loro, come se oltre una certa cifra ogni euro in più
    contasse un po’ meno. È proprio ciò che prevede una classica idea degli economisti. E un
    dettaglio curioso: chi era abituato a spendere cifre più alte ragionava sul denaro in modo più
    regolare. I soldi, insomma, non sono numeri come gli altri.
