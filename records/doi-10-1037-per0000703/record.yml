  public_summary: >-
    Le difficoltà nel sapere chi siamo o nel creare legami con gli altri
    riguardano solo chi ha un disturbo di personalità, oppure accompagnano molte
    forme di disagio psicologico? Un gruppo di ricerca delle Università di Padova,
    Firenze e Trieste ha chiesto a 1.183 adulti italiani di compilare questionari
    sul proprio modo di essere, cioè senso di identità, capacità
    di darsi obiettivi, empatia e intimità, e su molti sintomi, dall'ansia
    all'umore basso, dall'uso di sostanze ai comportamenti antisociali. Le
    difficoltà di funzionamento risultano legate a tutte le famiglie di sintomi,
    in particolare ad ansia e umore. Un senso di identità fragile accompagnava ogni
    tipo di disagio, la scarsa empatia si associava soprattutto all'ostilità verso
    gli altri e i problemi di intimità al ritiro sociale. Secondo gli autori,
    valutare il funzionamento della personalità può aiutare a capire e curare molti
    disturbi.
