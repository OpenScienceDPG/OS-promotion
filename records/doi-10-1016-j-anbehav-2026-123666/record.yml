  public_summary: 'I maiali sanno contare? Per scoprirlo, i ricercatori hanno lavorato
    con 16 maiali Kune Kune che vivono liberi al pascolo in un rifugio per animali
    in Austria. Davanti a ogni maiale c''era una fila di sei ciotole identiche e coperte:
    alcuni animali imparavano a trovare il cibo nella seconda ciotola, altri nella
    quinta. Gli odori venivano controllati con cura, perché il naso non facesse tutto
    il lavoro. I maiali hanno imparato bene il compito. Ma quando le ciotole sono
    state distanziate di più, hanno preferito quella che occupava il punto dove il
    cibo si era sempre trovato, invece di quella giusta per posizione nella fila.
    Insomma, per i maiali sembra contare più il "dove" che il "quanti". Una scoperta
    che aiuta a capire come specie animali diverse usano numeri e spazio per orientarsi.'
