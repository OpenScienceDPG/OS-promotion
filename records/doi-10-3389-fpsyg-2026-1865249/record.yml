  public_summary: >-
    Autismo e ADHD: per capire le difficoltà di comunicazione conta di più l’etichetta della
    diagnosi o l’intensità dei tratti? Gli autori hanno chiesto ai genitori di quasi 500 bambini e
    ragazzi italiani tra i 7 e i 16 anni, alcuni autistici, alcuni con ADHD e altri senza diagnosi,
    di descrivere le loro capacità comunicative e i loro tratti. Entrambi i gruppi con diagnosi
    mostravano difficoltà più marcate dei coetanei, soprattutto nell’autismo. Ma la vera chiave era
    un’altra: le difficoltà di comunicazione erano descritte meglio dall’intensità dei tratti, che
    varia con continuità in tutti i bambini, che dalla sola diagnosi. Un invito a guardare ogni
    bambino per le sue caratteristiche, oltre l’etichetta.
