curation:
  status: reviewed
  why_open: "I dati raccolti; Il codice usato per le analisi; I materiali dello studio, come questionari e stimoli; L'articolo, gratuito sul sito della rivista; Uno strumento che altri possono riutilizzare, come un programma o un test"
  public_summary: >-
    Dopo un ictus si possono superare i test di routine e avere, allo stesso tempo, difficoltà
    nascoste. Lo mostra questo studio con 46 pazienti che ai test tradizionali non avevano problemi
    di attenzione nello spazio. Dovevano indicare dei punti sullo schermo, a volte facendo nel
    frattempo un’altra cosa, come riconoscere una forma o un suono. In 15 di loro il doppio compito
    faceva emergere forti difficoltà a notare ciò che compariva sul lato opposto alla lesione; gli
    altri se la cavavano bene. Queste difficoltà si associavano a danni in una rete di aree frontali
    e parietali che il cervello usa in moltissime attività. Un messaggio chiaro: mettere alla prova
    i pazienti con compiti più impegnativi può rivelare ciò che i test semplici lasciano sfuggire.
  topics:
  - ictus
  - attenzione spaziale
  - multitasking
