curation:
  status: reviewed
  why_open: "I dati raccolti; Il codice usato per le analisi; L'articolo, gratuito sul sito della rivista"
  public_summary: >-
    Ognuno di noi dorme a modo suo, e alcune «firme» del sonno si riconoscono anche da un pisolino
    all’altro. Gli autori hanno registrato l’attività cerebrale di 19 giovani adulti durante due
    sonnellini pomeridiani, a una settimana di distanza. Si sono concentrati su due segnali del
    sonno non REM: le onde lente e i «fusi», brevi raffiche di attività elettrica legate
    all’apprendimento. I fusi si sono rivelati sorprendentemente costanti: frequenza, durata e
    quantità restavano simili da un pisolino all’altro, soprattutto per i fusi più rapidi. Le onde
    lente e la loro sincronia con i fusi cambiavano invece di più. Alcune caratteristiche del sonno,
    insomma, sembrano un tratto personale; altre dipendono di più dal momento.
  topics:
