  public_summary: >-
    Ripetere una serie di numeri o una serie di parole senza senso di due sillabe: sembrano prove
    simili, ma non misurano la memoria nello stesso modo. Gli autori hanno costruito valori di
    riferimento italiani per entrambe le prove, su 225 adulti senza problemi neurologici, con
    sequenze registrate e presentate al computer perché tutti le ascoltassero allo stesso modo. In
    media le persone ricordavano circa il doppio delle cifre rispetto alle parole inventate. Età e
    istruzione contavano per le cifre, mentre per le parole inventate contava solo l’età: per gli
    autori, un segno che questa prova risente meno delle strategie apprese. Due strumenti
    standardizzati, con norme italiane, per chi valuta la memoria.
