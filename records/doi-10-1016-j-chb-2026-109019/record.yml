    e stimoli; L'articolo, gratuito sul sito della rivista
  public_summary: 'Se un programma di intelligenza artificiale vi dicesse, sicuro
    di sé, che una persona sta mentendo, gli credereste? Le ricercatrici e i ricercatori
    hanno chiesto a 373 adulti di fare da giudici: dovevano leggere brevi racconti
    di esperienze personali, come un ricovero in ospedale o un incidente d''auto,
    alcuni veri e altri inventati. Accanto a ogni racconto compariva il verdetto di
    un sistema automatico immaginario, presentato come molto o poco affidabile, con
    un indicatore di quanto fosse sicuro. Le persone seguivano di più il sistema affidabile
    ma, a sorpresa, più il sistema si mostrava sicuro, più se ne allontanavano, soprattutto
    quando accusava qualcuno di mentire. Così, chi era aiutato dal sistema migliore
    distingueva verità e bugie meno bene del sistema da solo. Lo studio aiuta a capire
    come far collaborare persone e macchine nelle decisioni delicate.'
