  public_summary: >-
    Un test non dice solo quanti punti hai preso: può provare a ricostruire che cosa sai davvero e
    che cosa ti manca. Ma quanto possiamo fidarci di questa ricostruzione? Questo lavoro propone
    nuove misure per rispondere: la probabilità di avere individuato esattamente le conoscenze di
    una persona e, se ci si è sbagliati, di quanto. Con simulazioni al computer, gli autori mostrano
    come queste misure cambiano con il numero di domande e con la complessità delle conoscenze in
    gioco. Poi le applicano alle risposte di 286 studenti a domande di statistica: in questo
    esempio, la probabilità di ricostruire esattamente ciò che uno studente sapeva era dell’87%. Uno
    strumento utile per valutazioni più trasparenti sul proprio margine di errore.
