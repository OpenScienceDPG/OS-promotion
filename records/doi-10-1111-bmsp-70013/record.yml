      60 states for computational feasibility. Accuracy estimate rho=.87 is model-based, not externally
      validated diagnostic accuracy.'
    - 'PDF pp.19–20: larger item counts benefit accuracy in complex structures; estimated reliability
      can be biased upward with increasing error/structure size; model assumptions limit generalization.'
