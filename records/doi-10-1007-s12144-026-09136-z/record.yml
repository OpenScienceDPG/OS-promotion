  public_summary: Allenarsi fa bene, ma quando l'esercizio fisico diventa un bisogno
    incontrollabile può trasformarsi in un problema. Come accorgersene in tempo? Le
    ricercatrici e i ricercatori hanno messo alla prova in Danimarca un breve questionario
    di otto domande, pensato per individuare chi rischia una vera dipendenza dall'allenamento,
    per esempio chi si sente in colpa se salta una sessione o si allena anche da infortunato.
    Lo hanno fatto compilare a 392 adulti che fanno sport con regolarità, insieme
    ad altri questionari già conosciuti. Il test si è dimostrato affidabile e ha funzionato
    allo stesso modo per uomini e donne; un punteggio di circa 34 su 48 permette di
    riconoscere bene le persone a rischio. Chi si occupa di salute e sport in Danimarca
    può così contare su uno strumento semplice e rapido per cogliere presto i segnali
    di allarme.
