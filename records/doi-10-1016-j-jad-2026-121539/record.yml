    fact_sources:
    - 'Abstract: 23 studies (N = 2190) comparing late positive potential amplitudes to emotional pictures in depressive, remitted or familial-risk groups vs controls.'
    - 'Results: reduced amplitudes in depressive/at-risk groups overall; in adults for pleasant and unpleasant but not neutral stimuli; youth studies few and heterogeneous.'
    - 'Within-group analysis (11 studies): larger responses to emotional than neutral pictures preserved; authors interpret as generalized attenuation of emotional engagement, consistent with emotion context insensitivity, and suggest the measure as a possible objective marker.'
    review_note: 'Scientific reread: associative wording, at-risk findings not overstated, interpretation attributed to authors. Editorial reread: hook is illustrative, no jargon or statistics, one number.'
