  why_open: I dati raccolti; Il codice usato per le analisi; I materiali dello studio,
    come questionari e stimoli; L'articolo, gratuito sul sito della rivista
  public_summary: >-
    Quando l'umore è a terra, una bella foto o una scena spiacevole ci colpiscono come sempre?
    Un gruppo di ricercatori padovani ha raccolto e rianalizzato insieme 23 studi, con quasi
    2.200 partecipanti, che avevano registrato l'attività elettrica del cervello mentre le
    persone guardavano immagini piacevoli, neutre o spiacevoli. L'attenzione era su un segnale
    che cresce quando un'immagine ci cattura e ci coinvolge emotivamente. Nel complesso, nelle
    persone con sintomi depressivi questo segnale risultava in media più debole. Negli adulti la
    differenza riguardava le immagini cariche di emozione e non quelle neutre, mentre per
    bambini e ragazzi gli studi sono ancora pochi. Per gli autori la depressione si accompagna a
    un coinvolgimento emotivo più spento in generale, non solo verso ciò che è triste: una pista
    preziosa per comprenderla meglio e, in futuro, misurarla in modo più oggettivo.
